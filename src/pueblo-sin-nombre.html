<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>El Pueblo Sin Nombre</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Una sola hoja de pergamino con la historia y las reglas, y un panel de juego fijo al lado (barra inferior en móvil). */
:root{--desk:#120d0b;--paper:#ead9b4;--ink:#2b1d12;--ink2:#5c4630;--red:#8a2a35;--goldd:#8f6a1f;--rule:rgba(90,60,30,.38);
--pbg:#0c0a12;--pcard:#15121f;--pcard2:#1c1830;--pline:#2a2340;--pink:#ece7f5;--pmu:#a59fba;--pvio:#a78bfa;--pgold:#d9b86c;--pbad:#ec8aa0;--pok:#86d1ae;
--disp:Cinzel,Georgia,serif;--deco:"Cinzel Decorative",Cinzel,Georgia,serif;--serif:"Cormorant Garamond",Georgia,serif;--ui:Inter,system-ui,sans-serif;--num:"Space Grotesk",Inter,sans-serif;
--bar:calc(72px + env(safe-area-inset-bottom,0px));color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:auto;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:radial-gradient(1100px 640px at 28% -8%,#33201a 0,#120d0b 68%),#120d0b;color:var(--pink);font:15px/1.6 var(--ui);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#120d0b;z-index:60}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--pgold);outline-offset:2px}
html{scrollbar-gutter:stable}
html.lock{overflow:hidden}
[hidden]{display:none!important}
.view.enter{animation:vfade .5s ease-out backwards}
.mis.enter .scroll{animation:vin .8s cubic-bezier(.22,1,.36,1) backwards}
.view.leave{animation:vout .24s ease-in forwards;pointer-events:none}
@keyframes vin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes vfade{from{opacity:0}}
@keyframes vout{to{opacity:0}}
.col{min-width:0;padding:0 max(24px,env(safe-area-inset-right,0px)) 120px max(24px,env(safe-area-inset-left,0px))}

/* ===== selector de misiones ===== */
.home{position:relative;min-height:100vh;padding:calc(56px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 64px max(24px,env(safe-area-inset-left,0px));overflow:hidden}
.home::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(900px 520px at 50% -6%,rgba(217,160,90,.16),transparent 62%),radial-gradient(1200px 700px at 50% 120%,rgba(0,0,0,.55),transparent 60%)}
.home::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .5 0 0 0 0 .4 0 0 0 0 .3 0 0 0 .35 0'/%3E%3C/filter%3E%3Crect width='220' height='220' filter='url(%23n)'/%3E%3C/svg%3E")}
.hwrap{position:relative;z-index:1;max-width:1120px;margin:0 auto}
.hhead{text-align:center;margin:0 auto 44px;max-width:720px}
.hhead .sigil{width:58px;height:58px;color:var(--pgold);filter:drop-shadow(0 0 14px rgba(217,184,108,.35))}
.hhead .eb{color:#c99a62;letter-spacing:.32em;text-wrap:balance}
.hhead h1{margin:6px 0 0;font:700 clamp(36px,6.4vw,64px)/1.05 var(--deco);letter-spacing:.01em;background:linear-gradient(180deg,#f8ead0 0,#e2c37f 48%,#a87d34 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance;filter:drop-shadow(0 2px 18px rgba(217,160,90,.18))}
.hhead .orn{margin:16px auto 14px;color:#9c7a3c}
.hhead p.lead{margin:0;text-wrap:balance;font:italic 500 clamp(19px,2.4vw,22px)/1.45 var(--serif);color:#cdb894}
.hprog{display:inline-flex;align-items:center;gap:12px;white-space:nowrap;margin-top:18px;font:600 11px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:#a8906c}
.hprog i{display:flex;gap:7px;align-items:center}.hprog i b{width:8px;height:8px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.2px #6a5236}
.hprog i b.on{width:10px;height:10px;background:radial-gradient(circle at 35% 30%,#f6e3b0,#c99a48 60%,#8f6a1f);box-shadow:0 0 0 3px rgba(217,184,108,.16),0 0 10px rgba(226,195,127,.55)}
.mgridh{display:grid;gap:22px;grid-template-columns:repeat(3,minmax(0,1fr))}
.mcard{position:relative;display:flex;flex-direction:column;border-radius:10px;min-width:0;animation:vin .7s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*70ms + 120ms)}
.mcard .art{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:6px}
.mcard .txt{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.mcard .mn{font:600 11px var(--ui);letter-spacing:.28em;text-transform:uppercase}
.mcard h2{margin:0;font:700 22px/1.2 var(--disp);text-wrap:balance}
.mcard .th{margin:0;font:italic 500 18px/1.35 var(--serif)}
/* misión disponible: folio de pergamino */
.mcard.on{color:var(--ink);padding:10px;box-shadow:inset 0 0 46px rgba(100,58,20,.38),0 0 0 1px rgba(217,184,108,.55),0 0 0 6px rgba(18,13,11,.9),0 0 0 7px rgba(217,184,108,.35),0 24px 60px rgba(0,0,0,.6),0 0 80px rgba(217,160,90,.12);transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s}
.mcard.on .art{background:#1a1322;border:1.5px solid var(--goldd);box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.mcard.on .art svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.22,1,.36,1)}
.mcard.on .art .wax{position:absolute;left:14px;top:12px;width:48px;height:48px;font-size:16px;z-index:1}
.mcard.on .mn{color:var(--red)}
.mcard.on .th{color:var(--ink2)}
.mcard.on .meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.mcard.on .meta span{border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font:500 12px var(--ui);color:var(--ink2);background:rgba(255,248,230,.4)}
.mcard.on .meta b{color:var(--ink)}
.mst{display:flex;align-items:center;gap:8px;margin:auto 0 0;padding-top:14px;font:600 12px var(--ui);color:var(--ink2)}
.mst i{width:8px;height:8px;border-radius:50%;background:#5f8f6c;box-shadow:0 0 0 3px rgba(95,143,108,.2)}
.mst.live i{background:#7b5fd6;box-shadow:0 0 0 3px rgba(123,95,214,.22);animation:blink 2s infinite}
@keyframes blink{50%{box-shadow:0 0 0 6px rgba(123,95,214,0)}}
.go{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;padding:13px 18px;border:0;border-radius:8px;background:linear-gradient(180deg,#9a3442,#7a2431);color:#f8ead0;font:700 12.5px var(--ui);letter-spacing:.2em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px rgba(122,36,49,.35)}
.go::after{content:"";position:absolute;inset:0;border-radius:10px}
.go svg{width:16px;height:16px;transition:transform .3s}
.mcard.on:hover{transform:translateY(-4px)}
.mcard.on:hover .art svg{transform:scale(1.04)}
.mcard.on:hover .go svg{transform:translateX(4px)}
.mcard.on:has(.go:focus-visible){outline:2px solid var(--pgold);outline-offset:10px}
.go:focus-visible{outline:none}
/* misiones selladas */
.mcard.lk{color:#bda98a;background:linear-gradient(165deg,#21170f 0,#150f0b 70%);border:1px solid #3a2a1c;box-shadow:inset 0 1px 0 rgba(255,230,180,.05),0 18px 40px rgba(0,0,0,.4);padding:10px}
.mcard.lk .art{display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#2a1d14,#120c09 72%);border:1px solid #2e2116;box-shadow:inset 0 0 50px rgba(0,0,0,.7)}
.mcard.lk .emb{width:46%;max-width:120px;color:#8a6a3a;opacity:.55;filter:drop-shadow(0 1px 0 rgba(0,0,0,.8))}
.mcard.lk .lock{position:absolute;right:12px;top:12px;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6d2b33,#3d141b 72%);box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.25);color:#d9a8a8}
.mcard.lk .lock svg{width:16px;height:16px}
.mcard.lk .mn{color:#8f7556}
.mcard.lk h2{color:#d9c6a5}
.mcard.lk .th{color:#9d8a6e}
.soon{align-self:flex-start;margin-top:auto;padding-top:12px;font:600 10.5px var(--ui);letter-spacing:.24em;text-transform:uppercase;color:#7d6748}
.wax{display:grid;place-items:center;border-radius:50%;font:700 17px var(--disp);color:#f6e9d0;background:radial-gradient(circle at 35% 30%,#c4505f,#7a2431 70%);box-shadow:0 3px 10px rgba(0,0,0,.55),inset 0 0 0 3px rgba(0,0,0,.14),inset 0 0 0 5px rgba(255,255,255,.06)}
.hfoot{margin:48px auto 0;max-width:640px;text-align:center;font:500 12.5px/1.6 var(--ui);color:#7d6a52}

/* barra superior de la misión: volver + capítulos */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 auto;max-width:940px;display:flex;align-items:center;gap:10px;padding:10px 0 8px;background:linear-gradient(#120d0bf2 70%,#120d0b00)}
.back{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px 0 11px;border-radius:999px;border:1px solid #6b4a2a;background:linear-gradient(180deg,#2c1d12,#1c130c);color:#f1e2c2;font:600 12px var(--ui);letter-spacing:.12em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,230,180,.08),0 4px 12px rgba(0,0,0,.35);transition:border-color .2s,background .2s}
.back svg{width:16px;height:16px;color:var(--pgold);transition:transform .25s}
.back:hover{border-color:var(--pgold)}.back:hover svg{transform:translateX(-3px)}
.toc{flex:1;min-width:0;display:flex;gap:1px;overflow-x:auto;scrollbar-width:none}
.toc.ov{-webkit-mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.toc::-webkit-scrollbar{display:none}
.toc a{white-space:nowrap;text-decoration:none;color:#bfa985;font:600 12px var(--ui);letter-spacing:.12em;text-transform:uppercase;padding:9px 11px;border-radius:999px}
.toc a:hover{color:#f1e6cb}
.toc a.on{background:#3a2616;color:#f6e9d0;box-shadow:inset 0 0 0 1px #6b4a2a}

/* pergamino */
.scroll{max-width:900px;margin:6px auto 0}
.roller{position:relative;height:34px;border-radius:17px;background:linear-gradient(#3a2412,#a77c46 28%,#dcbc7c 50%,#8a6234 74%,#2f1c0d);box-shadow:0 10px 24px rgba(0,0,0,.55);z-index:2}
.roller::before,.roller::after{content:"";position:absolute;top:-5px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0dba0,#9a742d 62%,#4a3212);box-shadow:0 4px 10px rgba(0,0,0,.5)}
.roller::before{left:-16px}.roller::after{right:-16px}
.sheet{position:relative;margin:-4px 20px;padding:72px clamp(22px,7vw,88px) 80px;color:var(--ink)}
.sheet,.mcard.on{background:radial-gradient(120% 50% at 50% 0,rgba(255,250,235,.28),transparent 60%),
url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='260' height='260'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .36 0 0 0 0 .24 0 0 0 0 .1 0 0 0 .2 0'/%3E%3C/filter%3E%3Crect width='260' height='260' filter='url(%23n)'/%3E%3C/svg%3E"),
linear-gradient(90deg,#cdb27c 0,#e6d3a8 7%,#ecdcb9 50%,#e6d3a8 93%,#cdb27c 100%);
box-shadow:inset 0 0 70px rgba(100,58,20,.42),0 30px 80px rgba(0,0,0,.6)}
.sheet p{margin:0 0 14px}
.eb{margin:0 0 6px;font:600 11px var(--ui);letter-spacing:.28em;text-transform:uppercase;color:var(--red)}
.sheet h2{margin:0 0 4px;font:700 clamp(26px,4.4vw,38px)/1.12 var(--disp);color:var(--ink);text-wrap:balance}
.sheet h3{margin:0 0 6px;font:700 17px/1.25 var(--disp);color:var(--ink)}
.orn{display:block;width:min(320px,80%);height:22px;margin:10px 0 22px;color:var(--goldd)}
.sec>.eb,.sec>h2{text-align:center}
.sec>.orn{margin-left:auto;margin-right:auto}
.sec{padding-top:56px}
.sec:first-of-type{padding-top:40px}
.body{font:500 clamp(19px,2.3vw,21px)/1.55 var(--serif)}
.body p{max-width:64ch}
.note{font:italic 500 19px/1.45 var(--serif);color:var(--ink2)}
.small{font:500 13.5px/1.55 var(--ui);color:var(--ink2)}
.hl{color:var(--red)}

/* portada */
.cover{text-align:center;padding-bottom:20px}
.sigil{display:block;margin:0 auto 14px;width:54px;height:54px;color:var(--goldd)}
.cover h1{margin:0 0 6px;font:700 clamp(40px,8.6vw,76px)/1.04 var(--deco);color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.cover .sub{margin:0 auto 22px;font:italic 500 clamp(19px,2.6vw,25px)/1.35 var(--serif);color:var(--ink2);max-width:34ch}
.plate{padding:8px;border:1.5px solid var(--goldd);border-radius:4px;background:#1a1322;box-shadow:0 0 0 5px rgba(234,217,180,.9),0 0 0 6.5px var(--goldd),0 18px 36px rgba(60,30,10,.45);margin:0 8px}
.plate svg{display:block;width:100%;height:auto}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:30px 0 8px}
.chips span{border:1px solid var(--rule);border-radius:999px;padding:5px 14px;font:500 13px var(--ui);color:var(--ink2);background:rgba(255,248,230,.35)}
.chips b{color:var(--ink)}

/* prólogo */
.drop::first-letter{float:left;font:700 4.4em/.78 var(--deco);padding:.09em .1em 0 0;color:var(--red)}
/* tres ejemplos de una tabla: lo mejor, lo peor y uno al azar */
.picks{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr));margin:18px 0 6px}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;border:1px solid var(--rule);border-radius:8px;padding:30px 16px 18px;background:rgba(255,248,230,.42);box-shadow:inset 0 0 24px rgba(120,80,30,.08)}
.pick .lb{position:absolute;top:-11px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:3px 12px;border-radius:999px;font:600 10.5px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:#f6e9d0;background:#7a2431}
.pick.best .lb{background:#8f6a1f}.pick.rnd .lb{background:#4a3a8a}
.pick .seal{min-width:52px;width:auto;height:52px;padding:0 14px;border-radius:999px;font:700 16px var(--disp);white-space:nowrap;margin-bottom:12px}
.pick h3{margin:0 0 4px;font:700 16px/1.25 var(--disp);color:var(--ink)}
.pick p{margin:0;font:500 16.5px/1.4 var(--serif);color:var(--ink2)}
.pick small{display:block;margin-top:8px;font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);opacity:.75}
@media (max-width:640px){.picks{grid-template-columns:1fr;gap:20px}}

/* objetivos */
.objs{display:grid;gap:18px;margin:0 0 22px}
.ob{display:flex;gap:16px;align-items:flex-start}
.seal{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--disp);color:#f6e9d0;background:radial-gradient(circle at 35% 30%,#b84a58,#7a2431 70%);box-shadow:0 3px 8px rgba(60,20,10,.5),inset 0 0 0 3px rgba(0,0,0,.12)}
.seal.v{background:radial-gradient(circle at 35% 30%,#8a74d0,#4a3a8a 70%)}
.seal.g{background:radial-gradient(circle at 35% 30%,#e0c57c,#8a6a28 70%);color:#2b1d12}
.seal.o{background:none;border:2px dashed var(--red);color:var(--red);box-shadow:none}
.ob p{font:500 19px/1.5 var(--serif);margin:0}
.tw{overflow-x:auto;margin:6px 0 18px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;color:inherit}
th{font:600 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#7a5a38;text-align:left;padding:8px 10px;border-bottom:1.5px solid #6b4a2a}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top;font:500 16px/1.45 var(--serif);color:#3b2716}
td b{color:#2b1d12}
td:first-child{font:700 13px var(--ui);white-space:nowrap}
tr.cur td{background:rgba(138,42,53,.12)}
td.num{font-family:var(--ui);font-size:14px;font-weight:600}

/* pasos y mapa */
.steps{list-style:none;margin:0 0 22px;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;margin-bottom:12px;font:500 19px/1.5 var(--serif)}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--goldd);display:grid;place-items:center;font:700 14px var(--disp);color:var(--red);margin-top:2px}
.map{margin:10px 0 0;padding:10px;border:1px solid var(--rule);border-radius:4px;background:rgba(255,248,230,.3)}
.map svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
.map figcaption{font:500 13px/1.5 var(--ui);color:var(--ink2);margin-top:8px;text-align:center}
.fold{margin:12px 0;border:1px solid var(--rule);border-radius:6px;background:rgba(255,248,230,.3)}
.fold summary{cursor:pointer;list-style:none;padding:13px 16px;font:700 14px var(--disp);letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"+";font:600 20px var(--ui);color:var(--red)}
.fold[open] summary::after{content:"–"}
.fold .in{padding:4px 16px 14px}
.evg{display:grid;gap:4px 28px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.evg div{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);font:500 16px/1.4 var(--serif)}
.evg b{flex:none;width:28px;font:700 13px var(--ui);color:var(--red);padding-top:2px}

/* enemigos */
.mons{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:6px 0 24px}
.mon{border:1px solid var(--rule);border-radius:6px;padding:12px 14px 14px;background:rgba(255,248,230,.3)}
.mon svg{display:block;width:100%;max-width:150px;margin:0 auto 8px}
.mon p{font:500 17px/1.4 var(--serif);margin:0}
.bars{margin:6px 0 20px}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font:500 13px var(--ui);color:var(--ink2)}
.bar .t{flex:1;height:9px;border-radius:5px;background:rgba(90,60,30,.18);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#b8923f,#8f6a1f)}

/* heraldo */
.her{display:grid;gap:32px;grid-template-columns:minmax(0,240px) minmax(0,1fr);align-items:start}
@media (max-width:640px){.her{grid-template-columns:1fr;justify-items:center}.her .body{justify-self:stretch}}
.porf{margin:0;width:100%;max-width:240px}
.por{display:block;width:100%;height:auto;max-width:240px;border-radius:4px;border:1.5px solid var(--goldd);box-shadow:0 0 0 4px rgba(234,217,180,.9),0 0 0 5.5px var(--goldd),0 16px 30px rgba(60,30,10,.35)}
.porf figcaption{margin-top:14px;text-align:center;font:600 10.5px var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);opacity:.8}
.quote{position:relative;margin:26px 0 0;padding:22px 26px 20px;border-top:1px solid var(--goldd);border-bottom:1px solid var(--goldd);text-align:center}
.quote::before{content:"“";display:block;height:30px;margin:-4px 0 6px;font:700 54px/1 var(--deco);color:var(--red)}
.quote p{margin:0!important;font:italic 600 clamp(21px,2.6vw,25px)/1.4 var(--serif);color:var(--ink)}
.quote cite{display:block;margin-top:10px;font:600 11px var(--ui);font-style:normal;letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
/* ficha del Heraldo en la mesa (solo cuando entra en juego) */
.hfi{margin:10px 0 4px;padding:14px;border-radius:13px;border:1px solid #5b4a2a;background:linear-gradient(135deg,#2a2112,#1c1830)}
.hfimg{margin:-14px -14px 12px;overflow:hidden;border-radius:12px 12px 0 0;border-bottom:1px solid #5b4a2a}
.hfimg img{display:block;width:100%;height:auto}
/* Oleadas: grupos (en mesa / recién llegadas), contador de copias y recuadro fijo del jefe */
.grp{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 0 2px;padding-top:10px;border-top:1px dashed #3a3358;font:600 11px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--pmu)}
.grp span{font:600 11.5px var(--num);letter-spacing:.04em;text-transform:none}
.grp.new{color:var(--pgold)}
.un.gone{opacity:.45}.un.gone b{text-decoration:line-through;text-decoration-color:var(--pmu)}
.cnt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;padding:6px 8px;border-radius:9px;background:var(--pcard2);border:1px solid #2f2848;font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--pmu)}
.cnt .segs{display:flex;gap:4px}
.cnt .segs button{min-width:30px;height:28px;padding:0 8px;border-radius:7px;border:1px solid #3a3358;background:none;color:var(--pink);font:700 13px var(--num)}
.cnt .segs button.on{background:var(--pvio);border-color:var(--pvio);color:#0c0a12}
.cnt .segs button:hover:not(.on){border-color:var(--pvio)}
.cnt .rm{margin-left:auto;border:1px solid #6b3a48;background:none;color:var(--pbad);border-radius:7px;padding:6px 10px;font:600 11px var(--ui);letter-spacing:.06em;text-transform:none}
.cnt .rm:hover{background:rgba(236,138,160,.1)}
.cnt.off{justify-content:space-between;letter-spacing:.04em;text-transform:none;font-size:12px}
.cnts{display:grid;gap:6px;margin-top:8px}.cnts .cnt{margin-top:0}
.cnt>span:first-child{min-width:66px}
.wcard{scroll-margin-top:8px}
.wcard h3 em{font:600 11.5px var(--num);letter-spacing:.02em;text-transform:none;color:var(--pmu)}
.wsum{margin:0 0 10px;font-size:12.5px;line-height:1.5;color:var(--pmu)}
.wtog{position:sticky;bottom:12px;z-index:4;display:flex;justify-content:flex-end;margin:14px -4px 0 0;pointer-events:none}
.wtog button{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 14px;border-radius:999px;border:1px solid var(--pgold);background:linear-gradient(180deg,#2a2150,#1c1830);color:var(--pgold);font:700 11.5px var(--ui);letter-spacing:.12em;text-transform:uppercase;box-shadow:0 8px 22px rgba(0,0,0,.55),0 0 0 4px rgba(12,10,18,.7)}
.wtog button:hover{background:#2f2560}
.wtog svg{width:16px;height:16px}
.wtog button.ic{position:relative;width:46px;height:46px;padding:0;justify-content:center}
.wtog button.ic svg{width:20px;height:20px}
.wtog button.ic small{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;font-size:11px}
.wcard:not(.min) .un,.wcard:not(.min) .grp{padding-right:50px}
.wtog small{display:grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--pgold);color:#1a1208;font:700 12px var(--num);letter-spacing:0}
.hbx{position:sticky;top:-10px;z-index:3;display:flex;gap:12px;align-items:center;margin:0 0 12px;padding:10px;border-radius:12px;border:1px solid var(--pgold);background:linear-gradient(135deg,#2a2112,#1c1830);box-shadow:0 0 0 3px rgba(217,184,108,.08)}
.hbx img{flex:none;width:64px;height:81px;object-fit:cover;border-radius:7px;border:1px solid #5b4a2a}
.hbx>div{min-width:0}
.hbx .hbt{margin:0;font:600 10.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--pgold)}
.hbx b{display:block;margin-top:2px;font:700 15px var(--disp);color:var(--pink)}
.hbx .chipsr{margin:6px 0 2px}.hbx .linkb{padding-left:0}
.hfi h4{margin:0 0 8px;font:700 13px var(--ui);letter-spacing:.04em;color:var(--pgold)}
.hfi .chipsr{margin:0 0 10px}
.hfi p{margin:0 0 7px;font-size:12.5px;line-height:1.5;color:var(--pmu)}.hfi p b{color:var(--pink)}
.hfi ul{list-style:none;margin:0 0 8px;padding:0}.hfi li{padding:6px 0;border-top:1px solid #3a3024;font-size:12.5px;line-height:1.45;color:var(--pmu)}.hfi li b{color:var(--pgold);margin-right:6px}

/* lecturas */
.tl{list-style:none;margin:0;padding:0 0 0 24px;border-left:1.5px solid var(--goldd)}
.tl li{position:relative;padding:0 0 22px 22px}
.tl li::before{content:"";position:absolute;left:-31px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px #e8d6ac}
.tl h3{font:700 12px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
.tl p{font:italic 500 clamp(19px,2.3vw,21px)/1.5 var(--serif);margin:0;max-width:62ch}
.fins{display:grid;gap:14px;margin-top:8px}
.fin{border-left:3px solid var(--red);padding:4px 0 4px 16px;font:500 19px/1.5 var(--serif)}
.foot{margin:44px 0 0;padding-top:20px;border-top:1px solid var(--rule);font:500 13px/1.55 var(--ui);color:var(--ink2)}

/* ===== panel de juego ===== */
/* capa a pantalla completa que entra desde la derecha */
.panel{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;color:var(--pink);
background:radial-gradient(1000px 520px at 88% -12%,rgba(167,139,250,.13),transparent 62%),radial-gradient(800px 480px at -6% 112%,rgba(217,184,108,.07),transparent 60%),var(--pbg);
box-shadow:-40px 0 90px rgba(0,0,0,.7);transform:translateX(102%);visibility:hidden;
transition:transform .62s cubic-bezier(.22,1,.36,1),visibility 0s linear .62s}
.panel.open{transform:none;visibility:visible;transition:transform .62s cubic-bezier(.22,1,.36,1),visibility 0s}
.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(transparent,rgba(217,184,108,.5),transparent)}
.phead{flex:none;display:flex;align-items:center;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--pline);background:linear-gradient(180deg,rgba(12,10,18,.96),rgba(12,10,18,.82));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.px{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid #3a3358;background:radial-gradient(circle at 35% 30%,#221c38,#15121f);color:var(--pink);transition:border-color .2s,transform .35s cubic-bezier(.22,1,.36,1),color .2s}
.px svg{width:18px;height:18px}
.px:hover{border-color:var(--pgold);color:var(--pgold);transform:rotate(90deg)}
.ptl{min-width:0}
.ptl small{display:block;font:600 10.5px var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--pmu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptl h2{margin:2px 0 0;font:700 17px/1.1 var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--pgold)}
.pst{display:flex;gap:8px;margin-left:auto;align-items:center}
.pst span{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--pline);background:var(--pcard);font:600 12px var(--ui);color:var(--pmu);white-space:nowrap}
.pst span b{font:700 14px var(--num);color:var(--pink)}
.pst .mp{display:flex;gap:3px}.pst .mp i{width:9px;height:6px;border-radius:2px;background:#2a2340}.pst .mp i.on{background:linear-gradient(90deg,#a78bfa,#d9b86c)}
#pact{flex:none;margin-left:4px}
.pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:22px max(22px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));scrollbar-width:thin;scrollbar-color:#3a3358 transparent}
.pwrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mgrid{display:grid;gap:16px;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));align-items:start}
.pwrap.c1{max-width:640px}
.mcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel.intro .pwrap>.alert,.panel.intro .mcol>*{animation:vin .65s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--c,0)*80ms + var(--r,0)*70ms + 200ms)}
.mcol>*:nth-child(2){--r:1}.mcol>*:nth-child(3){--r:2}.mcol>*:nth-child(n+4){--r:3}
.pc{background:linear-gradient(180deg,#17142250,transparent 40%),var(--pcard);border:1px solid var(--pline);border-radius:16px;padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 14px 34px rgba(0,0,0,.28)}

/* botón flotante de la mesa */
.fab{position:fixed;z-index:45;right:max(22px,calc(env(safe-area-inset-right,0px) + 14px));bottom:max(22px,calc(env(safe-area-inset-bottom,0px) + 14px));display:flex;align-items:center;gap:12px;padding:7px 22px 7px 7px;border:0;border-radius:999px;color:#0c0a12;text-align:left;
background:linear-gradient(180deg,#c3b0ff 0,#a78bfa 45%,#8e6ff0 100%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(60,30,140,.25),0 0 0 1px rgba(167,139,250,.55),0 12px 30px rgba(110,80,220,.45),0 4px 10px rgba(0,0,0,.4);
transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s;animation:fabin .7s cubic-bezier(.22,1,.36,1) .45s backwards}
.fab:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(60,30,140,.25),0 0 0 1px rgba(201,184,255,.8),0 18px 40px rgba(110,80,220,.55),0 6px 14px rgba(0,0,0,.4)}
.fab:active{transform:translateY(0) scale(.98)}
.fab:focus-visible{outline:2px solid var(--pgold);outline-offset:4px}
@keyframes fabin{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
.fring{position:relative;flex:none;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a2150,#0f0c18);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 2px 6px rgba(40,20,90,.45);display:grid;place-items:center;color:var(--pgold)}
.fring svg.rg{position:absolute;inset:0;width:100%;height:100%}
.fring .ic{width:22px;height:22px}
.fring b{position:relative;font:700 19px/1 var(--num);color:#f3eefe}
.ftx b{display:block;font:700 12.5px/1.2 var(--ui);letter-spacing:.16em;text-transform:uppercase}
.ftx small{display:block;margin-top:3px;font:600 12px/1.2 var(--ui);color:#2b1f55}
.pc h3{margin:0 0 10px;font:600 11px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--pmu);display:flex;justify-content:space-between;align-items:center;gap:8px}
.pc h3 em{font-style:normal;color:var(--pmu);letter-spacing:.1em;text-align:right}
.startw{display:flex;justify-content:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--pline)}
.pb.big{text-transform:uppercase;letter-spacing:.16em;padding:12px 28px;font:700 13px var(--ui);border-radius:12px;box-shadow:0 6px 18px rgba(167,139,250,.25)}
.play{flex:none;width:32px;height:32px;padding:0;border-radius:50%;border:1px solid var(--pgold);background:radial-gradient(circle at 35% 30%,#2a2150,#15121f);color:var(--pgold);display:grid;place-items:center}
.play:hover{background:#2a2150}.play svg{width:14px;height:14px;margin-left:2px}
.mkr{padding:9px 10px;margin:0 0 6px;border:1px solid var(--pline);border-radius:11px;background:var(--pcard2)}
.mkr b{font-weight:600}.mkr.on{border-color:#5b4a2a;background:linear-gradient(135deg,#2a2112,#1c1830)}.mkr.on b{color:var(--pgold)}
.res.dim{opacity:.55}
.pb:disabled{opacity:.45;cursor:not-allowed;background:none}
.exit{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:16px;padding:12px 14px;border-radius:13px;border:1px solid #5b4a2a;background:linear-gradient(135deg,#2a2112,#1c1830);color:var(--pink)}
.exit svg{flex:none;width:32px;height:32px;color:var(--pgold)}
.exit b{display:block;font-size:13.5px;color:var(--pgold)}.exit small{display:block;margin-top:2px;color:var(--pmu);font-size:12px;line-height:1.4}
.exit:hover:not(:disabled){border-color:var(--pgold)}
.exit.on{background:linear-gradient(135deg,#e2c47c,#a8843a);border-color:var(--pgold)}.exit.on b,.exit.on small,.exit.on svg{color:#1a1208}
.exit:disabled{opacity:.45;cursor:not-allowed}
.seals button:disabled{cursor:not-allowed}.seals button:disabled:not(.on){opacity:.35}
.stp button:disabled{opacity:.3;cursor:not-allowed}
.lockn{display:flex;gap:10px;align-items:center;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--pline);font-size:12.5px;line-height:1.45;color:var(--pmu)}
.lockn svg{flex:none;width:18px;height:18px;color:var(--pgold)}
.dblk+.dblk{margin-top:18px;padding-top:16px;border-top:1px solid var(--pline)}
.dctl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;margin-top:12px}
.dctl.man{margin-top:10px;justify-content:center}
.dctl.ctr{justify-content:center}.dctl.ctr .pb{min-width:132px}
.cwrap{display:flex;justify-content:center}
.rnum{display:flex;align-items:center;gap:10px}
.rnum small{font:600 10.5px/1.3 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--pmu);text-align:right;max-width:72px}
.dctl .or{font:600 10.5px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pmu);padding:0 2px 10px}
.dl{display:flex;flex-direction:column;gap:3px}.dl small{font-size:10.5px;letter-spacing:.06em;color:var(--pmu)}
.dsel{appearance:none;-webkit-appearance:none;width:58px;height:33px;padding:0 22px 0 12px;border-radius:9px;border:1px solid #3a3358;background:var(--pcard2) url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23d9b86c' stroke-width='1.5'/%3E%3C/svg%3E") no-repeat right 9px center;color:var(--pink);font:700 15px var(--num);cursor:pointer}
.dsel:focus-visible{outline:2px solid var(--pgold);outline-offset:2px}
.dsel option{background:#1c1830;color:#ece7f5}
.dnote{margin:0 0 6px;font-size:12.5px;color:var(--pgold)}
.dmsg{margin:8px 0 0;font-size:12px;line-height:1.45;color:var(--pbad)}
.armyb{margin-top:16px;padding-top:14px;border-top:1px solid var(--pline)}
.armyr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.armyr p{margin:0;font-size:12.5px;line-height:1.45;color:var(--pmu)}.armyr p b{display:block;font-size:14px;color:var(--pink)}
.rbox{display:flex;align-items:center;gap:16px}
.rbox>b{font:700 46px/1 var(--num);color:var(--pink);min-width:44px;text-align:center}
.rbox{align-items:flex-start}.rbox>b{padding-top:4px}
.fx{list-style:none;margin:8px 0 0;padding:0}
.fx li{position:relative;padding:0 0 6px 14px;font-size:13px;line-height:1.35}
.fx li::before{content:"";position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:50%;background:var(--pgold)}
.fx li b{color:var(--pink);font-weight:600}.fx li small{display:block;color:var(--pmu);font-size:12px}
.nxt{margin:6px 0 0;padding-top:10px;border-top:1px solid var(--pline);font-size:12px;line-height:1.45;color:var(--pmu)}
.pb.mid{text-transform:uppercase;letter-spacing:.14em;padding:9px 20px;font:700 12px var(--ui);border-radius:10px}
.hintc{margin:8px 0 0;text-align:center;font-size:12px;color:var(--pmu)}
.alw{margin-top:14px;padding:12px 14px;border-radius:13px;border:1px solid #5b4a2a;background:linear-gradient(135deg,#2a2112,#1c1830)}
.alwh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.alwh b{font:700 13px var(--ui);color:var(--pgold);letter-spacing:.04em}.alwh span{font:600 12px var(--num);color:var(--pmu)}
.alw .un{border-top-color:#3a3024}
.linkb{border:0;background:none;padding:4px 6px;font:600 12px var(--ui);color:var(--pmu);text-decoration:underline;text-underline-offset:3px;text-decoration-color:#4a4268}
.linkb:hover{color:var(--pgold)}
.alh{list-style:none;margin:8px 0 0;padding:0}
.alh li{padding:8px 0;border-top:1px solid var(--pline);font-size:12.5px;color:var(--pmu)}
.alh li b{color:var(--pink);font-size:13px;margin-right:8px}.alh li small{font:600 11.5px var(--num)}.alh li span{display:block;margin-top:3px;line-height:1.45}
.pc h3 .tt{flex:none;border:1px solid var(--pgold);color:var(--pgold);border-radius:999px;padding:3px calc(11px - .2em) 3px 11px}
.pb{border:1px solid #5b49a8;background:none;color:#cdbfff;border-radius:11px;padding:10px 14px;font:600 13px var(--ui)}
.pb:hover{background:#2a2150}
.pb.pr{background:var(--pvio);border-color:var(--pvio);color:#0c0a12}
.pb.pr:hover{background:#c9b8ff}
.pb.gh{border-color:var(--pline);color:var(--pmu)}
.pb.sm{padding:7px 11px;font-size:12px;border-radius:9px}
.pb.pulse{box-shadow:0 0 0 0 #a78bfa88;animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 10px #a78bfa00}100%{box-shadow:0 0 0 0 #a78bfa00}}
@media (prefers-reduced-motion:reduce){.pb.pulse{animation:none;box-shadow:0 0 0 2px #a78bfa88}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seals{display:flex;gap:8px}
.seals button{width:40px;height:40px;border-radius:50%;border:1.5px solid #4a4268;background:none;color:var(--pmu);font:700 15px var(--num)}
.seals button.on{background:radial-gradient(circle at 35% 30%,#b84a58,#7a2431 70%);border-color:#b84a58;color:#fff}
.stp{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--pmu)}
.stp>span:first-child{flex:1}
.stp button{width:32px;height:32px;border-radius:9px;border:1px solid var(--pline);background:var(--pcard2);font:600 16px var(--ui);color:var(--pink)}
.stp b{min-width:42px;text-align:center;font:700 17px var(--num);color:var(--pink)}
.gauge{display:block;margin:0 auto;width:100%;max-width:250px}
.rd{display:flex;justify-content:space-between;align-items:flex-end;margin:-4px 0 12px}
.rd b{font:700 38px/1 var(--num)}
.tag{display:inline-block;border:1px solid var(--pgold);color:var(--pgold);border-radius:999px;padding:2px 11px;font:600 11px var(--ui);letter-spacing:.14em;text-transform:uppercase}
.tog{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:13px;color:var(--pmu);cursor:pointer}
.tog input{width:20px;height:20px;accent-color:#a78bfa;margin:0}
.alert{background:linear-gradient(135deg,#2a2150,#1c1830);border:1px solid #5b49a8;border-radius:14px;padding:14px 16px;font-size:14px}
.alert b{color:var(--pgold)}
.un{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:1px solid var(--pline)}
.un:first-of-type{border-top:0}
.un .q{grid-row:span 2;font:700 30px/1 var(--num);color:var(--pgold);text-align:center;padding-top:2px}
.un b{font-size:14px}.un small{display:block;color:var(--pmu);font-size:12.5px;line-height:1.45}
.chipsr{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chipsr i{font-style:normal;border-radius:7px;background:var(--pcard2);border:1px solid #3a3358;padding:2px 8px;font:600 12px var(--num);color:var(--pink)}
.chipsr i.ch{border-color:var(--pgold);color:var(--pgold)}
.tgs{display:inline-flex;gap:4px;vertical-align:1px}.tg{font:600 10.5px var(--ui);letter-spacing:.06em;text-transform:uppercase;font-style:normal;border-radius:6px;padding:1px 6px;border:1px solid var(--pgold);color:var(--pgold)}.tg.rc{border-color:#3a3358;color:var(--pmu)}
#armyTxt{display:block;width:100%;box-sizing:border-box;min-height:200px;margin:6px 0 8px;background:var(--pcard2);color:var(--pink);border:1px solid #3a3358;border-radius:10px;padding:10px;font:12px/1.45 ui-monospace,Consolas,monospace;resize:vertical}

/* ---------- ficha del héroe (solo en la mesa): medallones apilados abajo a la derecha y hoja de campaña ---------- */
.pbody{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}

.hf-hmed::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a2150,#0f0c18);box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 0 1px rgba(217,184,108,.55),0 0 22px rgba(167,139,250,.18)}

svg.hf-rg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.hf-cnt{position:absolute;right:-4px;top:-4px;z-index:9;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--pgold);color:#1a1405;font:700 12px var(--num);display:grid;place-items:center;box-shadow:0 0 0 3px var(--pbg)}
.hf-fan{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.hf-mrow{display:flex;align-items:center;gap:10px;border:0;padding:0;background:none;color:inherit;animation:hfrise .45s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0)*55ms)}

<script>
const DATA={"ev": [["11", "Golpe del vacío", "Un héroe al azar queda Aturdido."], ["12", "Suelo de ceniza", "Un héroe al azar queda Afectado."], ["13", "Maldición del olvido", "Un héroe al azar tiene -1 a las tiradas de Fuerza hasta el siguiente evento."], ["14", "Derrumbe", "Un héroe al azar sufre D3 heridas."], ["15", "Zarzas secas", "Un héroe al azar queda Debilitado."], ["16", "Memoria falsa", "Un héroe al azar tiene -1 a las tiradas de Voluntad hasta el siguiente evento."], ["21", "Trampa del Umbral", "Un héroe al azar sufre D3 impactos."], ["22", "Susurros sin voz", "Un héroe al azar pierde D3 de poder."], ["23", "Viento maldito", "Un héroe al azar queda Afligido."], ["24", "Enjambre de sombras", "Un héroe al azar queda Aturdido."], ["25", "Hilos de olvido", "Un héroe al azar tiene -1 a las tiradas de Destreza hasta el siguiente evento."], ["26", "Moho gris", "Un héroe al azar queda Enfermo."], ["31", "Tierra que se borra", "Un cuadrante al azar cuenta como terreno peligroso hasta el siguiente evento."], ["32", "Erosión maldita", "Todos los héroes y enemigos tienen -1 a las tiradas de Defensa hasta el siguiente evento."], ["33", "Bruma que aturde", "Todos los héroes y enemigos tienen -1 a impactar hasta el siguiente evento."], ["34", "Lluvia de ceniza", "Un cuadrante al azar cuenta como terreno difícil hasta el siguiente evento."], ["35", "Niebla espesa", "Todos los héroes y enemigos tienen -6\" de alcance al disparar hasta el siguiente evento."], ["36", "Temblor del pozo", "Todos los héroes y enemigos tienen -1 a los chequeos de moral hasta el siguiente evento."], ["41", "Charco de recuerdos", "Un héroe al azar tiene +1 a los chequeos de moral hasta el siguiente evento."], ["42", "Perro fiel", "Un héroe al azar tiene +1 a las tiradas de Destreza hasta el siguiente evento."], ["43", "Mapa olvidado", "Coloca D3 fichas de búsqueda, cada una a 6\" del centro de cuadrantes distintos."], ["44", "Cuervo vigía", "Un héroe al azar tiene +6\" de alcance al disparar hasta el siguiente evento."], ["45", "Eco de un aldeano", "Un héroe al azar restaura D3 de poder."], ["46", "Sumidero", "Una unidad enemiga al azar queda Aturdida."], ["51", "Niebla de lucidez", "Un héroe al azar tiene +1 a las tiradas de Voluntad hasta el siguiente evento."], ["52", "Bayas veloces", "Un héroe al azar se mueve +2\" al Avanzar y +4\" al Correr o Cargar hasta el siguiente evento."], ["53", "Arma encantada", "Un héroe al azar tiene +1 a impactar en cuerpo a cuerpo hasta el siguiente evento."], ["54", "Espíritu de apoyo", "Un héroe al azar tiene +1 a las tiradas de Fuerza hasta el siguiente evento."], ["55", "Vientos encantados", "Un héroe al azar tiene +1 a impactar al disparar hasta el siguiente evento."], ["56", "Espíritu guardián", "Un héroe al azar tiene +1 a las tiradas de Defensa hasta el siguiente evento."], ["61", "Bolsa de elixires", "Un héroe al azar recibe un Elixir de poder."], ["62", "Visión profética", "Revela el contenido de D3 fichas de búsqueda al azar que aún no se hayan revelado."], ["63", "Bolsa de bombas", "Un héroe al azar recibe una Bomba aturdidora."], ["64", "Montón de oro", "Un héroe al azar recibe 15 de oro."], ["65", "Caja de pociones", "Un héroe al azar recibe una Poción de salud."], ["66", "Claridad súbita", "Un héroe al azar recibe D3 de XP."]], "nar": [["Antes de empezar", "El camino termina donde las casas empiezan, y las casas están en pie, con las puertas abiertas y la ropa tendida. No hay humo en las chimeneas ni huellas en el barro. La Voz del Filo os dijo que aquí vivían unas cuarenta personas, pero al mirar el pueblo ninguno de vosotros sabría decir cómo lo sabe. En la plaza, el pozo está destapado. Del fondo no sube agua, sino silencio."], ["Ronda 1", "Algo se mueve junto al pozo, y no es el viento. Figuras grises salen de las puertas con andares torpes, como si recordaran a medias cómo caminar. Tienen forma de personas, pero les falta algo que no sabríais nombrar. Una de ellas se detiene y mira hacia el pozo, como si esperara una orden que todavía no ha llegado."], ["Ronda 2", "El aire se enfría sin que baje el sol. En una ventana ves una taza aún caliente y una mesa puesta para alguien. Junto a la taza hay una silla apartada, como si alguien acabara de levantarse, y ninguno de vosotros lo ha visto salir. Nadie vive aquí, pero el pueblo parece esperar visita."], ["Ronda 3", "Un roce a vuestra espalda. Algo se ha levantado donde un instante antes no había nada, y os mira sin cara con la cabeza ladeada, como un niño que escucha. Cuando por fin se mueve, no viene hacia vosotros: va hacia el pozo, y se arrodilla."], ["Ronda 4", "Ladridos a lo lejos, rápidos y mal afinados. Los perros del pueblo corren hacia vosotros con la carne torcida y los ojos blancos. Más atrás, algo más lento se arrastra entre las sombras de los muros. Al llegar a la plaza dejan de ladrar a la vez, y todos miran en la misma dirección."], ["Ronda 5", "Desde algún rincón del pueblo llegan voces que cantan una sola nota, larga y apagada. Hombres encapuchados avanzan en fila, con el signo del Umbral cosido en las mangas. Al pasar junto al pozo, el que va primero se inclina, como quien saluda a alguien que todavía no ha llegado."], ["Se cumple el objetivo principal", "Al retirar el último rastro, vuestras manos tocan un diario cuya letra os suena, aunque ninguno recuerda a su dueño. Sus páginas están intactas, como si el Vacío no hubiera podido borrarlas. La plaza se vacía y el cielo se oscurece sin que anochezca. El pueblo se está olvidando de sí mismo y de vosotros también. Es hora de correr hacia la esquina más cercana."], ["Se activa el objetivo secundario", "El pozo respira. La tierra a su alrededor se hunde y vuelve a subir, y todo lo que no sois vosotros corre hacia vosotros. Desde el fondo sube un sonido que podría ser una voz, o vuestros nombres dichos del revés. El Vacío no quiere ya esperar."], ["Llega el Heraldo", "Una figura alta cruza la plaza sin prisa. Lleva una túnica sin color y un rostro que se os escurre de la memoria apenas dejáis de mirarlo. No levanta el arma. Solo dice vuestros nombres, y por un instante dudáis de que sean los vuestros."]], "fin": ["Misión cumplida: al volver la vista, el pueblo ha desaparecido. En vuestras manos queda el diario de alguien cuyo nombre no recordáis, pero cuya letra os suena. En la última página hay una dirección, Ocaso, y un camino dibujado hacia el bosque de Eryn, donde las raíces han empezado a moverse. Esa noche, junto al fuego, uno de vosotros oye su nombre al otro lado de los árboles, dicho sin prisa. El Heraldo no os ha olvidado. Os sigue.", "Misión cumplida y Heraldo destruido: el Heraldo cae sin ruido, y por un instante vuestros nombres suenan bien dichos. Cuando se disipa la ceniza, el pozo está en calma y el diario pesa un poco menos. Entre los restos de su túnica encontráis una semilla negra, todavía tibia, que late como un corazón pequeño. La última página señala Ocaso, y el único camino hacia allí cruza el bosque de Eryn. En algún lugar, alguien ha notado que el Heraldo no ha vuelto.", "Derrota: el camino os devuelve al borde del pueblo, sin recordar bien cómo llegasteis. Habéis perdido algo, pero nadie sabe decir qué."], "pro": ["Hace mucho que los Primordiales dejaron de responder. Siete fuerzas sostenían el mundo y callaron a la vez, y lo que quedó se rompió en pedazos. Esos pedazos se llaman Rupturas, lugares donde la realidad olvida cómo funcionar y hace lo que quiere. En unas crece la selva sin control, en otras las máquinas se mueven solas, y en las de Neth simplemente se borra lo que había.", "Vosotros vivís en Varek's Hold, la ciudad que se alza contra un muro que nadie construyó, el último resto de un Primordial que no cayó del todo. Allí mandan tres Voces: la del Muro, que vigila, la del Mercado, que cuenta monedas, y la del Filo, que paga a quienes hacen lo que las otras dos no quieren que conste. Esta mañana os ha llamado la tercera.", "No os ofrece asiento. Sobre la mesa hay un mapa con una cruz de tinta fresca y un saquito de plata, más del que valdría el trabajo si fuera sencillo. Al norte de la frontera, dice, hay una aldea de la que ya nadie habla. Hace tres semanas un mercader dejó de recibir cartas de allí, y dos días después dejó de recordar que las esperaba. Una patrulla fue a mirar y volvió sin saber a qué había ido. Todos los registros de aquel pueblo están en blanco, y no es un error.", "La orden es sencilla: entrar, buscar lo que quede, reunir cuatro cosas que parezcan importantes y salir antes de que el pueblo os olvide. Probablemente haya cultistas del Umbral, porque donde Neth borra, ellos suelen estar cerca. Si vuestras cabezas os dan problemas, será la Ruptura y no ellos. La Voz no promete nada más.", "Partís al norte esa misma tarde. Al pisar el camino de la frontera, el mapa empieza a parecer menos claro. Las huellas del mercader se acaban en una curva sin motivo, y lo único que os guía son los postes de una cerca que ya nadie cuida. Al llegar a la cima, el pueblo se despliega ante vosotros: casas en pie, puertas abiertas, ni un alma."], "obj": ["Objetivo principal: búsqueda por zonas. Coloca 3 marcadores en el centro de tres cuadrantes distintos (o en el centro de la mesa). Un héroe a 1\" de un marcador gasta una acción de habilidad y pasa una tirada de Wil: retira el marcador y tira un dado. El objetivo se cumple al retirar los tres marcadores (regla de la casa: no se usa la tirada de 5+). El marcador más cercano a un enemigo es el Objetivo de IA. Quien retire el último marcador recoge el diario del olvidado.", "Objetivo secundario: se prepara cuando se cumple el principal y sube la Alertness en 3. Tira 1d6 en la tabla de abajo y usa las reglas de ese objetivo del Campaign Builder.", "Fin de la misión: con el principal cumplido, todos los héroes deben estar a 6\" o menos de la misma esquina y sin enemigos alrededor al final de una ronda (regla de la casa: sin enemigos alrededor). El secundario no es obligatorio.", "Pelea de jefe (opcional): tras cumplir ambos objetivos, los héroes pueden activarla. Al final de esa ronda llega una oleada de refuerzos de doble valor, con el Heraldo del Umbral, y no entran más refuerzos. El héroe más cercano a un enemigo es el Objetivo de IA.", "Al terminar: los héroes recuperan 3 heridas y 3 de poder, pero no las condiciones ni las heridas duraderas. Un héroe inconsciente al terminar cuenta como muerto y sufre una herida duradera.", "Derrota: si todos los héroes quedan inconscientes a la vez, todos cuentan como muertos, sufren heridas duraderas y repiten el capítulo."], "prep": ["Mesa: tamaño estándar, 48\"x48\" (122 x 122 cm) con más de 20 piezas de terreno (casas abandonadas y obstáculos). También puede jugarse en 24\"x24\" con todas las distancias a la mitad. El pozo del centro es la Ruptura de Neth.", "1. Objetivos: prepara el objetivo principal. El secundario se prepara más tarde.", "2. Fichas de búsqueda: coloca D3 + el número de héroes. Reparte la mitad por cuadrantes y la otra mitad por esquinas, numéralos de 1 a 4 y tira un dado por ficha: con 1-4 va a 6\" o menos del centro de ese cuadrante (o de esa esquina), y con 5-6 eliges tú. Cada ficha es un cofre.", "3. Despliegue enemigo: ver Oleadas y sorpresas.", "4. Despliegue de héroes: tira un dado. Con 1-4 se despliegan a 6\" o menos de la esquina con ese número, y con 5-6 eliges la esquina.", "5. Desafíos opcionales: la misión empieza de noche (-1 a impactar al disparar y visión limitada a 12\"). Pasa a alba (-1 a impactar al disparar) cuando llegan los primeros refuerzos, y a día después. También se usan los eventos de Neth y la pelea de jefe."]};

function parseArmy(t){
 const re=/^(?:(\d+)\s*x\s+)?(.+?)\s*\[(\d+)\]\s*Q(\d)\+\s*D(\d)\+\s*\|\s*(\d+)\s*pts?\s*(?:\|\s*(.*))?$/i,out=[],bad=[];let last=null;
 String(t).split(/\r?\n/).forEach(raw=>{const l=raw.trim();if(!l||/^\+\+/.test(l))return;
  const m=l.match(re);
  if(m){last={n:+(m[1]||1),name:m[2].trim(),mod:+m[3],q:+m[4],d:+m[5],pts:+m[6],rules:(m[7]||"").trim(),w:""};out.push(last)}
  else if(last)last.w+=(last.w?" · ":"")+l;else bad.push(l)});
 return{units:out.filter(u=>u.pts>0&&u.n>0),bad};
}

if(!ARMY.length){ARMY_TXT=ARMY_DEF;ARMY=parseArmy(ARMY_DEF).units;ASIG=sig(ARMY_DEF)}
function setArmy(t){ARMY_TXT=t;ARMY=parseArmy(t).units;ASIG=sig(t)}
const HER={name:"Heraldo del Umbral",pts:150}; /* jefe de la casa: coste estimado, lo representa la miniatura que elijas */

/* Sorteo de una oleada: unidades al azar de la lista sin pasarse del valor.
   Primero usa copias que no hayan salido en oleadas anteriores; si no queda ninguna que quepa,
   recicla (la unidad solo se usa si ya fue eliminada). Nunca más copias de las que tienes en una misma oleada. */
/* Copias de cada unidad que están ahora mismo en la mesa: las de oleadas anteriores (S.table)
   y las vivas de la oleada en curso (salvo la que se está sorteando, skipK). */
/* Miniaturas por unidad. "4x Huruk lanceros" son 4 unidades de MODELS miniaturas cada una.
   De momento todas tienen 3 (decisión de Nacho, 2026-11-17); más adelante se afinará por unidad (p. ej. con el [n] de Army Forge). */
const MODELS=3,modsOf=i=>MODELS;
/* Miniaturas vivas de una unidad sorteada (e.m; sin valor = completa). */
const aliveM=e=>e.d?0:(e.m==null?modsOf(e.i):e.m);
function busy(skipK){
 const b=ARMY.map(()=>0);
 (S.table||[]).forEach(t=>{if(ARMY[t.i]&&t.m>0)b[t.i]++});
 const ck=curW(),c=S.comp[ck];
 if(S.shown&&c&&ck!==skipK&&!c.merged)c.u.forEach(e=>{if(aliveM(e)>0&&ARMY[e.i])b[e.i]++});
 return b;
}
/* Al pasar a la siguiente oleada (o al llegar el jefe), las unidades que siguen vivas pasan a «En mesa» (S.table: una entrada por unidad, con sus miniaturas). */
function mergeWave(k){
 const c=S.comp[k];if(!c||c.merged)return;
 S.table=(S.table||[]).filter(t=>t.m>0&&ARMY[t.i]);
 c.u.forEach(e=>{const m=aliveM(e);if(m>0&&ARMY[e.i])S.table.push({i:e.i,m})});
 S.table.sort((x,y)=>x.i-y.i);c.merged=true;
}
/* Sorteo: solo copias que no estén ya en la mesa (regla de la casa). Si no cabe ninguna, la oleada sale más corta. */
function genComp(k,budget){
 const bz=busy(k),left=ARMY.map((a,i)=>Math.max(0,a.n-bz[i])),u=[];
 let rem=budget;
 const draw=()=>{const c=[];ARMY.forEach((a,i)=>{if(a.pts<=rem)for(let j=0;j<left[i];j++)c.push(i)});return c.length?c[Math.floor(Math.random()*c.length)]:-1};
 for(let g=0;g<300;g++){const i=draw();if(i<0)break;left[i]--;u.push({i});rem-=ARMY[i].pts}
 if(!u.length&&budget>0){let i=-1;ARMY.forEach((a,j)=>{if(left[j]>0&&(i<0||a.pts<ARMY[i].pts))i=j});if(i>=0)u.push({i})}
 if(k!=="boss"&&k%2===1&&u.length)u[Math.floor(Math.random()*u.length)].a=true;
 u.sort((x,y)=>x.i-y.i||((x.a?1:0)-(y.a?1:0)));
 return{b:budget,s:ASIG,u};
}
const wGroups=c=>{const g=[];c.u.forEach((e,j)=>{const x=g.find(y=>y.i===e.i&&y.a===!!e.a);if(x)x.j.push(j);else g.push({i:e.i,a:!!e.a,j:[j]})});return g};
function comp(k){
 const b=k==="boss"?Math.max(0,2*BUD()-HER.pts):BUD(),c=S.comp[k];
 if(!c||c.b!==b||c.s!==ASIG||c.u.some(e=>!ARMY[e.i])){S.comp[k]=genComp(k,b);delete S.rolls[k]}
 return S.comp[k];
}
function waveDef(k){
 const B=BUD();
 if(k==="boss")return{name:"Jefe",budget:2*B,p:"c",her:true,c:comp(k),surprise:"Oleada de doble valor y no entran más refuerzos. Las unidades de IA a 12\" usan la Calidad del Heraldo en moral mientras no esté Aturdido."};
 if(k===0)return{name:"Centinelas",budget:B,p:"q",c:comp(0),surprise:"Tira el evento de Neth de la ronda 1."};
 const c=comp(k);
 if(k%2===1)return{name:"Refuerzos "+k,budget:B,p:"c",c,surprise:"La unidad marcada con Ambush entra D3 rondas después, al empezar la ronda, a 6\" o menos de un Objetivo de IA (al azar si hay varios)."+(k>1?" Evento de Neth.":"")};
 const cas=c.u.some(e=>/\bCaster/i.test(ARMY[e.i].rules));
 return{name:"Refuerzos "+k,budget:B,p:"c",c,surprise:(cas?"Mientras la unidad con Caster no esté Aturdida, las unidades enemigas a 6\" de ella ganan +1 a impactar en cuerpo a cuerpo. ":"")+"Evento de Neth."};
}

const PEL=[[1,1,"Afligido","Al activarse debe superar Fuerza para quitárselo; si falla, recibe 1 herida."],[2,2,"Enfermo","Al activarse debe superar Voluntad para quitárselo; recibe tantas heridas como poder gaste."],[3,3,"Afectado","Puede gastar D3 de poder para quitárselo; mientras tanto tiene -1 a todas las tiradas de característica."],[4,4,"Debilitado","Al activarse debe superar Destreza para quitárselo; mientras tanto mueve la mitad."],[5,6,"Ninguno","El aire huele a ceniza, y nada más."]];

const POC=[[1,3,"Poción de curación","Un héroe a 1\" se quita todos sus estados."],[4,5,"Poción de teletransporte","El héroe se coloca a 6\" o menos de la esquina que elija."],[6,6,"Poción de salud","Un héroe a 1\" restaura 3 heridas."]];
const pick=(t,d)=>t.find(r=>d>=r[0]&&d<=r[1]);
const CHEST=[[1,2,"Peligro","Un cofre que nunca tuvo dueño. Se desvanece al tocarlo y deja algo en el aire."],[3,3,"Bolsa de elixires","Frascos que alguien olvidó beber."],[4,4,"Bolsa de bombas","Esferas de arcilla con la etiqueta borrada."],[5,5,"Caja de pociones","Pociones en fila, cada una con un nombre que ya nadie recuerda."],[6,6,"Tesoro maldito","Monedas frías que pesan más de lo que deberían."]];
function rollChest(A,B){
 const a=A||R(6),c=pick(CHEST,a);let b=0,t="ok",title=c[2],text=c[3],x="";
 if(a<=2){b=B||R(6);const p=pick(PEL,b);title="Peligro · "+p[2];text=p[3]+" El cofre desaparece; solo afecta a un héroe a 1\".";t="bad"}
 else if(a===3){b=B||R(6);const p=pick(ELX,b);title=p[2];text=p[3]}
 else if(a===4){b=B||R(6);const p=pick(BMB,b);title=p[2];text=p[3]+" Se lanza como acción a 12\"."}
 else if(a===5){b=B||R(6);const p=pick(POC,b);title=p[2];text=p[3]}
 else{t="bad";title="Tesoro maldito";text="Los héroes obtienen "+5*S.d+" de oro y surge un Borrado débil junto al héroe que abrió el cofre."}
 return{a,b,t,title,text,x}
}

/* ---------- acciones ---------- */
function setNar(k){S.nar=k}
function reinforce(){
 if(S.shown)mergeWave(S.wave);
 S.shown=true;S.wave++;S.needEv=true;
 setNar(S.wave%2===1?"w1":"w2");
 S.alert="Entra la oleada "+(S.wave+1)+". Despliégala y tira un evento de Neth.";
}
/* Sube la Alertness. Al llegar a 6 entran refuerzos y lo que sobra pasa a la nueva cuenta
   (la cuenta va de 1 a 6 como un dado; al llegar a 6 entran refuerzos y vuelve siempre a 1, aunque sobre algo: regla de la casa para dar un respiro). Devuelve true si entraron refuerzos. */
/* Refuerzos por Alertness 6 (regla de la casa: separados de "Oleada actual"). Se sortean con la lista y se guardan en S.alw. */
function alertWave(){
 S.alw.push({c:genComp("al",BUD()),r:null,round:S.round});
 S.alShow=true;S.needEv=true;S.noEn=false;
 setNar(S.alw.length%2===1?"w1":"w2");
 S.alert="La Alertness llega a 6: entran refuerzos ("+S.alw.length+"). Los tienes en «Nivel de alerta». Despliégalos y tira un evento de Neth.";
}
function addAl(n){
 S.al+=n;
 if(S.boss){S.al=Math.min(5,S.al);return false}
 if(S.al>=6){alertWave();S.al=1;return true}
 return false;
}
function endRound(){
 S.alert="";
 if(S.armed&&!S.boss){if(S.shown)mergeWave(S.wave);S.shown=true;S.boss=true;S.armed=false;S.round++;setNar("boss");S.needEv=false;S.alert="Llega la pelea de jefe: el Heraldo y su oleada de doble valor. No entran más refuerzos.";return}
 const add=S.noEn?0:1;S.noEn=false; /* si se marcó Sin enemigos, el +2 ya se sumó */
 S.round++;
 if(S.boss)return;
 if(!addAl(add)&&S.round<=3)setNar("r"+S.round);
}
/* Secundario: se prepara con su botón una vez cumplido el principal. d6 en la tabla y +3 de Alertness. */
function prepSec(v){
 if(!S.prim||S.secRolled)return;
 S.secRolled=true;S.sec=v||R(6);setNar("sec");
 if(addAl(3)){S.alert="Objetivo secundario: "+DATA.sec[S.sec-1][0]+". La Alertness sube 3 y llega a 6: entran refuerzos (en «Nivel de alerta»). Despliégalos y tira un evento de Neth."}
 else S.alert="Objetivo secundario: "+DATA.sec[S.sec-1][0]+". La Alertness sube 3.";
 hist("Secundario",S.sec+" "+DATA.sec[S.sec-1][0]);
}
function startGame(){S.round=1;S.needEv=true;setNar("r1");S.alert="Empieza la ronda 1. Tira el evento de Neth."}
function setMk(i){S.mk[i]=S.mk[i]?0:1;if(S.mk.every(Boolean)&&!S.prim){S.prim=true;setNar("pri")}else if(!S.mk.every(Boolean)&&S.prim&&!S.manualPrim)S.prim=false}
const ACT={
 d:v=>{if(!S.round)S.d=+v},
 pts:v=>{if(!S.round)S.pts=Math.min(3000,Math.max(50,S.pts+ +v))},
 heroes:v=>{if(!S.round)S.heroes=Math.min(4,Math.max(2,S.heroes+ +v))},

 end:()=>endRound(),
 alAdj:v=>{v=+v;if(v<0){S.al=Math.max(1,S.al+v);return}
  if(addAl(v)&&S.round){S.round++;S.alw[S.alw.length-1].round=S.round;S.alert="La Alertness llega a 6: pasáis a la ronda "+S.round+" y entran refuerzos (en «Nivel de alerta»). Despliégalos y tira un evento de Neth."}},
 /* Sin enemigos en mesa: suma +2 al momento (en lugar del +1 de fin de ronda). Desmarcar lo deshace. */

 mk:v=>setMk(+v),
 secDone:()=>{S.secDone=!S.secDone},

 pos:()=>rollPos(),

 alHide:()=>{S.alShow=false},
 alHist:()=>{UI.alHist=!UI.alHist},
 reroll:()=>{const k=curW();delete S.comp[k];delete S.rolls[k]},
 /* Miniaturas en mesa de una unidad: "t|i|n" (S.table[i]) o "w|j|n" (entrada j de la oleada en curso). n=0 la elimina del tablero. */

/* Pestaña de cada unidad: cuántas miniaturas siguen en la mesa (de t a 1) o eliminarla del tablero. */
function cntTab(kind,ix,n,t,lb){
 if(!n)return`<div class="cnt off"><span>${lb} · eliminada del tablero</span><button class="pb sm gh" data-a="cnt" data-v="${kind}|${ix}|${t}" data-f="c${kind}${ix}u">Deshacer</button></div>`;
 let s="";for(let m=t;m>=1;m--)s+=`<button type="button" class="${m===n?"on":""}" data-a="cnt" data-v="${kind}|${ix}|${m}" data-f="c${kind}${ix}_${m}" aria-pressed="${m===n}" aria-label="${lb}: ${m} ${m===1?"miniatura":"miniaturas"} en mesa">${m}</button>`;
 return`<div class="cnt"><span>${lb}</span><div class="segs" role="group" aria-label="${lb}: miniaturas en mesa">${s}</div><button type="button" class="rm" data-a="cnt" data-v="${kind}|${ix}|0" data-f="c${kind}${ix}x">Eliminar del tablero</button></div>`;
}
/* Fila de una unidad del ejército con una pestaña por cada unidad sorteada (copias = [{kind,ix,m}]). */
function armyRow(i,copies,place,rs,tags){
 const a=ARMY[i],t=modsOf(i),live=copies.filter(c=>c.m>0).length;
 const tabs=copies.map((c,q)=>cntTab(c.kind,c.ix,c.m,t,copies.length>1?"Unidad "+(q+1):"Miniaturas")).join("");
 return unitRow(live,a.name,prof(a)+" · "+a.pts+" pts c/u · "+t+" miniaturas por unidad",place,rs,tags,`<div class="cnts">${tabs}</div>`,live?"":"gone");
}
/* Recuadro fijo del jefe: aparece al activar la pelea de jefe y se queda arriba de «Oleadas». */

}
/* Ficha del Heraldo: solo se ve en la mesa cuando entra en juego (en el pergamino está oculta). */
function herFicha(){
 return`<div class="hfi"><figure class="hfimg"><img src="${IMG_JEFE}" width="640" height="808" alt="El Heraldo del Umbral se alza sobre los tejados del pueblo, con la hoz vertical en la mano"></figure><h4>Ficha del Heraldo · estadísticas de la casa</h4><div class="chipsr"><i>Calidad 3+</i><i>Defensa 3+</i><i class="ch">Tough(${TG[S.d-1]})</i><i>Fear(3)</i><i>Caster(3)</i></div>
 <p><b>Reglas especiales:</b> <i>Villain</i>, <i>Fear</i>(3), <i>Stealth</i>, <i>Tough</i>(${TG[S.d-1]}), <i>Caster</i>(3). Con <i>Villain</i>, las unidades de IA a 12" usan su Calidad en moral si es mejor, mientras no esté Aturdido.</p>
 <p><b>Hoz del vacío</b> (cuerpo a cuerpo): 4 ataques, AP(2), <i>Rending</i>.</p>
 <ul><li><b>Olvido · 1</b>Un héroe a 12" pasa una tirada de Wil o pierde su siguiente acción de habilidad.</li><li><b>Borrado · 2</b>Un héroe a 12" recibe 3 impactos con AP(1).</li><li><b>Silencio · 3</b>Todos los héroes a 9" pasan una tirada de Wil o pierden D3 de poder.</li></ul>
 <p><b>Cómo actúa:</b> gana 3 fichas de hechizo al empezar cada ronda, elige un hechizo al azar y gasta todas sus fichas al activarse. Con 4+ surte efecto sobre un objetivo en línea de visión. Un héroe con <i>Caster</i> a 18" puede gastar fichas para restarle -1 por ficha. Con <i>Tough</i>(9) o más no queda Aturdido, y cada moral fallido le causa D3 heridas.</p>
 <p><b>Punto débil:</b> los ataques del héroe que lleve el diario del olvidado contra el Heraldo ganan AP(1).</p></div>`;
}
function waveCard(){
 if(!S.shown&&!S.boss&&S.wave===0)return`<section class="pc"><h3><span class="tt">Oleadas</span></h3>${bossBox()}<p style="margin:0 0 12px;font-size:12.5px;line-height:1.5;color:var(--pmu)">Todavía no hay enemigos en la mesa. Elige antes la dificultad, los puntos de los héroes y tu ejército, y pulsa el botón para generar la primera oleada.</p><div class="cwrap"><button class="pb pr big" data-a="first" data-f="first">Primera oleada</button></div></section>`;
 const k=curW(),w=waveDef(k),ro=S.rolls[k]&&!Array.isArray(S.rolls[k])?S.rolls[k]:null,g=wGroups(w.c);
 /* En mesa: lo que sigue vivo de oleadas anteriores, agrupado por unidad. */
 const T=(S.table||[]).map((t,ix)=>({t,ix})).filter(o=>ARMY[o.t.i]&&o.t.m!=null);
 let old="";
 if(T.length){const n=T.filter(o=>o.t.m>0).length,G=[];
  T.forEach(o=>{const x=G.find(y=>y.i===o.t.i);const c={kind:"t",ix:o.ix,m:o.t.m};if(x)x.c.push(c);else G.push({i:o.t.i,c:[c]})});
  old=`<p class="grp">En mesa · oleadas anteriores<span>${n} ${n===1?"unidad":"unidades"}</span></p>`+G.map(x=>armyRow(x.i,x.c,"",[],"")).join("")}
 /* Recién llegadas: la oleada en curso, una pestaña por unidad sorteada. */
 let h="";
 if(w.her)h+=unitRow(1,HER.name,"Q3+ D3+ · Villain, Fear(3), Stealth, Caster(3), Tough("+TG[S.d-1]+") · "+HER.pts+" pts (estimado)",PLACE.c,ro&&ro.h?[ro.h]:[],"");
 g.forEach(x=>{h+=armyRow(x.i,x.j.map(j=>({kind:"w",ix:j,m:aliveM(w.c.u[j])})),PLACE[x.a?"a":w.p],ro?x.j.map(j=>ro.u[j]).filter(Boolean):[],x.a?`<i class="tg">Ambush</i>`:"")});
 if(!ARMY.length)h=`<p style="margin:6px 0;font-size:12.5px;color:var(--pbad)">No hay unidades en tu lista. Pégala en «Ejército enemigo».</p>`;
 else if(!g.length)h+=`<p style="margin:6px 0;font-size:12.5px;line-height:1.5;color:var(--pbad)">No quedan copias libres que quepan en esta oleada. Elimina del tablero las unidades que hayan caído y pulsa «Otra composición».</p>`;
 const tot=w.c.u.reduce((s,e)=>s+ARMY[e.i].pts,0)+(w.her?HER.pts:0),n=w.c.u.length+(w.her?1:0);
 const lbl=k==="boss"?"Oleada del jefe":k===0?"Centinelas":"Refuerzos "+k;
 /* Unidades vivas en mesa (anteriores + recién llegadas) para el resumen y el botón de minimizar. */
 const onT=T.filter(o=>o.t.m>0).length+w.c.u.filter(e=>aliveM(e)>0).length+(w.her&&!S.dead?1:0);
 const sum=`${onT} ${onT===1?"unidad":"unidades"} en mesa`;
 const body=S.wMin?`<p class="wsum">Última oleada: ${lbl}. Pulsa «Mostrar oleadas» para ver las unidades.</p>`:`<p style="margin:0 0 6px;font-size:12.5px;color:var(--pmu)">Valor de la última oleada: <b style="color:var(--pink)">${w.budget} pts</b> (${k==="boss"?"el doble de ":""}${PC[S.d-1]}% de ${S.pts}). Sorteadas: <b style="color:var(--pink)">${n} unidades · ${tot} pts</b>.</p>${old}<p class="grp new">${T.length?"Recién llegadas · ":""}${lbl}<span>${n} ${n===1?"unidad":"unidades"}</span></p>${h}<p style="margin:8px 0 10px;font-size:12.5px;line-height:1.5;color:var(--pmu)">${em(w.surprise)}</p>`;
 /* Botón para minimizar/mostrar: va al final de la tarjeta y, si la tarjeta es más alta que la pantalla, se queda pegado abajo (sticky). */
 /* Abierta: botón redondo que flota abajo a la derecha, en un margen reservado (no tapa unidades). Minimizada: píldora con texto. */
 const tog=`<div class="wtog"><button type="button" class="${S.wMin?"":"ic"}" data-a="wTog" data-f="wTog" aria-expanded="${!S.wMin}" aria-controls="wcard" aria-label="${S.wMin?"Mostrar oleadas":"Minimizar oleadas"} (${sum})" title="${S.wMin?"Mostrar oleadas":"Minimizar oleadas"}"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${S.wMin?"M6 9l6 6 6-6":"M6 15l6-6 6 6"}"/></svg>${S.wMin?"Mostrar oleadas":""}<small>${onT}</small></button></div>`;
 return`<section class="pc wcard${S.wMin?" min":""}" id="wcard"><h3><span class="tt">Oleadas</span><em>${sum}</em></h3>${bossBox()}${body}<div class="row"><button class="pb sm" data-a="pos" data-f="pos">Sortear posiciones</button><button class="pb sm gh" data-a="reroll" data-f="reroll">Otra composición</button>${S.boss?"":`<button class="pb sm" data-a="next" data-f="next">Siguiente oleada</button>`}</div>${tog}</section>`;
}

 return h+`</div>`;

/* Recuadro "Número de ronda" */
const STG={

 "Alba":{fx:[["-1 a impactar al disparar","Para héroes y enemigos."],["Visión normal","Ya no hay límite de 12\"."]],next:"Pasa a día con los siguientes refuerzos."},
 "Día":{fx:[["Sin penalizaciones","Disparo y visión normales."]],next:"Se mantiene hasta el final de la misión."}};
function roundCard(){
 const st=stage(),g=STG[st];

/* Refuerzos por alerta dentro del recuadro "Nivel de alerta" */
const unitsLine=c=>{const g={};c.u.forEach(e=>{const k=ARMY[e.i]?ARMY[e.i].name:"?";g[k]=(g[k]||0)+1});return Object.entries(g).map(([k,v])=>v+"× "+k).join(" · ")};
function alertBox(){

  const g=[];w.c.u.forEach((e,j)=>{const x=g.find(y=>y.i===e.i);if(x)x.j.push(j);else g.push({i:e.i,j:[j]})});
  const tot=w.c.u.reduce((s,e)=>s+ARMY[e.i].pts,0);
  h+=`<div class="alw"><div class="alwh"><b>Refuerzos por alerta ${L.length}</b><span>${w.c.u.length} unidades · ${tot} pts</span></div>${g.map(x=>{const a=ARMY[x.i];return unitRow(x.j.length,a.name,prof(a)+" · "+a.pts+" pts c/u",PLACE.c,w.r?x.j.map(j=>w.r[j]):[],"")}).join("")}<div class="row" style="justify-content:center;margin-top:10px"><button class="pb sm" data-a="alPos" data-f="alPos">Sortear posiciones</button><button class="pb sm gh" data-a="alHide" data-f="alHide">Ya están en la mesa</button></div></div>`;

   Medallones apilados abajo a la derecha de la mesa; al pulsarlos se abren con el botón + para añadir héroes.

const HKEY="psn-heroes-v1";
const hfX=()=>Math.min(5*S.d,(S.prim?2*S.d:0)+(S.secDone?S.d:0)+(S.dead?2*S.d:0));
const HF_WAKI=`++ Wakiisen - Barbarian (Ogres) [AOFQ 285pts] [Lvl 4] ++

Dual Hand Weapons (A8)

const HF_ST=[["at","Aturdido"],["af","Afligido"],["en","Enfermo"],["de","Debilitado"],["ac","Afectado"]];

const HF_TABS=[["regla","Reglas"],["hab","Habilidades"],["equipo","Equipo"]];
const HF_PAL=[["#4a3a7a","#211a3a"],["#2f4a6e","#16223a"],["#5a3a2a","#2a1a12"],["#2e5a4a","#122a22"]];
/* Explicaciones: resumen propio de reglas comunes de OPR y las de Wakiisen traducidas del texto que dictó Nacho (2026-11-17). */
const HF_GLOS={
 "ap":"Las tiradas de Defensa contra este ataque restan el valor indicado.",

 "rage":"El héroe sufre 1 herida y gana +2 a impactar en cuerpo a cuerpo al cargar, hasta el final de la ronda."
};
const HI={minus:'<svg viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 6h7"/></svg>',plus:'<svg viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 6h7M6 2.5v7"/></svg>',pen:'<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10.5 2.5l3 3L6 13H3v-3z"/></svg>',ok:'<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',x:'<svg viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>',imp:'<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M3 13h10"/></svg>',add:'<svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>'};
const HF_SKULL=`<span class="hf-skull" role="img" aria-label="Inconsciente"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#e3283c" d="M12 2.2c-4.9 0-8.6 3.5-8.6 8.2 0 2.7 1.2 4.6 3 5.8v2.6c0 .9.7 1.6 1.6 1.6h1v-2.1h1.3v2.1h3.4v-2.1h1.3v2.1h1c.9 0 1.6-.7 1.6-1.6v-2.6c1.8-1.2 3-3.1 3-5.8 0-4.7-3.7-8.2-8.6-8.2z"/><ellipse cx="8.6" cy="11" rx="2.2" ry="2.5" fill="#1a0507"/><ellipse cx="15.4" cy="11" rx="2.2" ry="2.5" fill="#1a0507"/><path fill="#1a0507" d="M12 13.4l-1.5 2.6h3z"/><path d="M7.4 6.2c1-1.3 2.6-2 4.2-2.1" stroke="#ff8a96" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".7"/></svg></span>`;
const hfMk=o=>Object.assign({name:"Nuevo héroe",raza:"",prof:"",nivel:1,pts:0,cal:4,def:4,fue:4,des:4,vol:4,hp:3,hpMax:3,pw:0,pwMax:0,pot:0,gold:0,st:[],img:"",sk:[],c:0},o);
function hfSplit(s){const out=[];let d=0,b="";for(const ch of s){if(ch==="(")d++;else if(ch===")")d=Math.max(0,d-1);if(ch===","&&!d){if(b.trim())out.push(b.trim());b=""}else b+=ch}if(b.trim())out.push(b.trim());return out}
/* Lee la exportación de héroe de Army Forge (AoF: Quest):
   ++ Nombre - Profesión (Raza) [AOFQ 285pts] [Lvl 4] ++
   Nombre | Qua 3+ Def 6+ Tou 18 Pow 4 | Str 3+ Dex 6+ Wil 6+ | 285pts | 9XP | reglas
   armas · Consumables: 2x Health Potion · Skills: a, b */
function hfParse(t){
 const lines=String(t).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
 const reQ=/^(.+?)\s*\|\s*Qua\s*(\d)\+\s*Def\s*(\d)\+\s*(?:Tou\s*(\d+))?\s*(?:Pow\s*(\d+))?\s*\|\s*Str\s*(\d)\+\s*Dex\s*(\d)\+\s*Wil\s*(\d)\+\s*\|\s*(\d+)\s*pts?\s*(?:\|\s*(\d+)\s*XP)?\s*(?:\|\s*(.*))?$/i;
 const r={prof:"",raza:"",nivel:null,rules:[],weap:[],cons:[],skills:[],pot:null};let u=false;
 for(const l of lines){
  if(/^\+\+/.test(l)){const s=l.replace(/^\+\+\s*|\s*\+\+$/g,""),lv=s.match(/\[Lvl\s*(\d+)\]/i),body=s.replace(/\[.*?\]/g,"").replace(/\(v[\d.]+\)/g,"").trim(),m=body.match(/^(.+?)\s+-\s+(.+?)(?:\s*\((.+?)\))?\s*$/);
   if(lv)r.nivel=+lv[1];if(m){r.hname=m[1].trim();r.prof=m[2].trim();r.raza=(m[3]||"").trim()}continue}
  let m=l.match(reQ);
  if(m&&!u){u=true;Object.assign(r,{name:m[1].trim(),cal:+m[2],def:+m[3],hpMax:m[4]?+m[4]:null,pwMax:m[5]!=null?+m[5]:null,fue:+m[6],des:+m[7],vol:+m[8],pts:+m[9],afxp:m[10]?+m[10]:null});r.rules=hfSplit(m[11]||"");continue}
  if(!u)continue;
  if((m=l.match(/^Consumables?:\s*(.*)$/i))){for(const x of hfSplit(m[1])){const c=x.match(/^(\d+)\s*x\s+(.+)$/i),n=c?+c[1]:1,nm=(c?c[2]:x).trim();if(/health\s*potion|poci[oó]n de salud/i.test(nm))r.pot=(r.pot||0)+n;else r.cons.push({n:nm,q:n})}continue}
  if((m=l.match(/^Skills?:\s*(.*)$/i))){r.skills.push(...hfSplit(m[1]));continue}
  r.weap.push(...hfSplit(l).map(x=>{const w=x.match(/^(.+?)\s*\((.*)\)$/);return w?{n:w[1].trim(),k:w[2].trim()}:{n:x,k:""}}));
 }
 if(!u)return{err:"No encuentro la línea del héroe. En Army Forge se ve así: Nombre | Qua 3+ Def 6+ Tou 18 Pow 4 | Str 3+ Dex 6+ Wil 6+ | 285pts | …"};
 return r;
}
function hfClamp(h){h.hpMax=Math.max(1,+h.hpMax||1);h.pwMax=Math.max(0,+h.pwMax||0);h.hp=Math.min(Math.max(0,+h.hp||0),h.hpMax);h.pw=Math.min(Math.max(0,+h.pw||0),h.pwMax);h.pot=Math.max(0,+h.pot||0);h.gold=Math.max(0,+h.gold||0);h.nivel=Math.max(1,+h.nivel||1)}
/* Copia lo leído a la ficha. No toca el oro ni los estados; la XP de Army Forge no se usa (la de la campaña empieza en 0). Tough(n) ya son las heridas: no se repite en Reglas. */
function hfApply(h,r){
 h.name=r.name||r.hname||h.name;h.cal=r.cal;h.def=r.def;if(r.prof)h.prof=r.prof;if(r.raza)h.raza=r.raza;if(r.nivel)h.nivel=r.nivel;if(r.pts)h.pts=r.pts;
 if(r.fue)h.fue=r.fue;if(r.des)h.des=r.des;if(r.vol)h.vol=r.vol;
 if(r.hpMax){const full=h.hp===h.hpMax;h.hpMax=r.hpMax;if(full||h.hp>r.hpMax)h.hp=r.hpMax}
 if(r.pwMax!=null){const full=h.pw===h.pwMax;h.pwMax=r.pwMax;if(full||h.pw>r.pwMax)h.pw=r.pwMax}
 if(r.pot!=null)h.pot=r.pot;
 h.sk=r.rules.filter(x=>!/^Tough\(\d+\)$/i.test(x)).map(x=>({g:"regla",n:x,k:"",d:""}))
  .concat(r.skills.map(x=>({g:"hab",n:x,k:"",d:""})),r.weap.map(x=>({g:"equipo",n:x.n,k:x.k,d:""})),r.cons.map(x=>({g:"equipo",n:(x.q>1?x.q+"× ":"")+x.n,k:"Consumible",d:""})));
 hfClamp(h);
}
function hfDefault(){const h=hfMk({c:0});hfApply(h,hfParse(HF_WAKI));h.hp=h.hpMax;h.pw=h.pwMax;return[h]}

/* Perfil de un arma en las cuatro casillas de Army Forge: RNG (alcance), ATK (dados), AP y SPE (reglas especiales). */
function hfWeapon(k){let rng="",atk="",ap="";const spe=[];
 for(const p of hfSplit(k||"")){let m;if((m=p.match(/^(\d+)\s*"$/)))rng=m[1]+'"';else if((m=p.match(/^A(\d+)$/i)))atk="A"+m[1];else if((m=p.match(/^AP\((\d+)\)$/i)))ap=m[1];else spe.push(p)}

 return`<div class="hf-wp">${c("RNG",rng)}${c("ATK",atk)}${c("AP",ap)}${c("SPE",spe.join(", "))}</div>`}

 h+=sec("cofres","Botín","Cofres",`<div class="body"><p>Cada ficha de búsqueda es un cofre. Un héroe gasta una acción de habilidad (Descubrir): a 6&quot; o menos y con línea de visión pasa una tirada de Wil, y a 1&quot; o menos no necesita tirada. Después se tira el contenido y, si hace falta, el objeto. Si es un objeto o oro y el héroe está a 1&quot;, lo recoge. Si no, deja un marcador de tesoro.</p><p class="note">Esto es solo una muestra de lo que puede guardar un cofre. La mesa de juego tira el resto por ti.</p></div>${picks(chestPicks())}`);
 h+=sec("heraldo","Lo que se cuenta","Heraldo del Umbral",`<div class="her"><figure class="porf"><img class="por" src="${IMG_RETRATO}" width="480" height="606" alt="El Heraldo del Umbral: capucha vacía, armadura negra con cuernos en las hombreras y tres esferas oscuras sobre la mano"><figcaption>El Heraldo del Umbral</figcaption></figure><div class="body"><p>Nadie en Varek’s Hold sabe cómo se llama, y quienes dicen haberlo visto no se ponen de acuerdo en su cara. Unos hablan de un sacerdote del Umbral que bajó a un pozo como este hace años y nunca terminó de subir.</p><p>Otros juran que no es nadie: solo el hueco que deja una persona cuando el mundo la olvida, vestido con lo último que llevaba puesto. Los cultistas lo llaman Heraldo y bajan la voz al decirlo, como si anunciara la llegada de alguien más.</p><p class="note">Puede que nunca aparezca. Puede que ya os esté mirando.</p></div></div><blockquote class="quote"><p>No os voy a matar. Os voy a dejar marchar, y cuando volváis a casa nadie os estará esperando.</p><cite>Palabras atribuidas al Heraldo</cite></blockquote>`);
 h+=sec("lecturas","Para leer en voz alta","Narración",`<p class="note" style="margin-top:-6px">Lee cada texto cuando ocurra el momento indicado. El panel de juego te muestra el que toca.</p><ol class="tl">${DATA.nar.filter(n=>n[0]!=="Llega el Heraldo").map(n=>`<li><h3>${esc(n[0])}</h3><p>${esc(n[1])}</p></li>`).join("")}</ol><h3 style="margin-top:8px">Finales</h3><div class="fins">${DATA.fin.map(f=>{const i=f.indexOf(": ");return`<div class="fin"><b class="hl">${esc(f.slice(0,i))}.</b> ${esc(cap(f.slice(i+2)))}</div>`}).join("")}</div>`);
 h+=sec("enemigos","Oleadas","Lo que el pueblo ha olvidado",`<div class="mons"><div class="mon">${cMon("bor")}<h3>Borrados</h3><p>Figuras grises que recuerdan a medias cómo caminar. Espectros o muertos vivientes de rostro liso.</p></div><div class="mon">${cMon("cul")}<h3>Cultistas del Umbral</h3><p>Túnicas negras con el signo del Umbral en las mangas. Cantan una sola nota. Un <i>Caster</i> los guía.</p></div><div class="mon">${cMon("ani")}<h3>Animales deformados</h3><p>Perros del pueblo con la carne torcida y los ojos blancos. Rápidos (<i>Fast</i>) y mal afinados.</p></div></div>
 <div class="body"><p>Ten al menos 2 o 3 veces más unidades que héroes, y puntos para 2 o 3 oleadas completas.</p><p><b class="hl">Tamaño de oleada.</b> Porcentaje de los puntos totales de los héroes. Ejemplo: con 300 puntos de héroes, una oleada de nivel 2 vale 150 puntos.</p></div><div class="bars" id="bars"></div>
 <div class="body"><p><b class="hl">Centinelas.</b> Antes de empezar se despliegan en el centro de un cuadrante al azar: un dado por unidad, con 1-4 va al cuadrante con ese número y con 5-6 eliges. El PDF no fija cuántos son, así que usa el tamaño de una oleada.</p><p><b class="hl">Alertness.</b> Al final de cada ronda sube 1, o 2 si no queda ningún enemigo en la mesa. Al llegar a 6 entra una oleada de refuerzos y la Alertness vuelve a 0.</p><p><b class="hl">Refuerzos.</b> Cada unidad entra a 6&quot; o menos de una esquina al azar: con 1-4 va a la esquina con ese número y con 5-6 eliges.</p></div>
 <div class="tw"><table id="wvt"></table></div><p class="small">El panel de juego sortea al azar las unidades de cada oleada con tu propia lista de Army Forge (pégala en «Ejército enemigo»), sin pasarse de su valor. Los Borrados, animales y cultistas son el papel que hacen en la historia: tus miniaturas los representan. Solo salen copias que no estén ya en la mesa: en «Oleadas» marca cuántas siguen en pie o elimínalas del tablero, y las que caen vuelven a estar disponibles. El Heraldo cuenta como 150 pts (estimación de la casa).</p>`);
 $("#sheet").innerHTML=h;
}

function buildToc(){
 const T=[["historia","Historia"],["objetivos","Objetivos"],["preparacion","Preparación"],["eventos","Eventos"],["cofres","Cofres"],["heraldo","Heraldo"],["lecturas","Narración"],["enemigos","Oleadas"]];
 $("#toc").innerHTML=T.map(t=>`<a href="#${t[0]}">${t[1]}</a>`).join("");
 if("IntersectionObserver" in window){const links=[...document.querySelectorAll("#toc a")];
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>{const on=a.getAttribute("href")==="#"+e.target.id;a.classList.toggle("on",on);if(on){const t=$("#toc");t.scrollLeft=a.offsetLeft-t.clientWidth/2+a.clientWidth/2}})}),{rootMargin:"-30% 0px -60% 0px"});
  T.forEach(t=>{const el=document.getElementById(t[0]);if(el)io.observe(el)})}
}
