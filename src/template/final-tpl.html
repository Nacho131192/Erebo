<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>El Pueblo Sin Nombre</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Una sola hoja de pergamino con la historia y las reglas, y un panel de juego fijo al lado (barra inferior en móvil). */
:root{--desk:#120d0b;--paper:#ead9b4;--ink:#2b1d12;--ink2:#5c4630;--red:#8a2a35;--goldd:#8f6a1f;--rule:rgba(90,60,30,.38);
--pbg:#0c0a12;--pcard:#15121f;--pcard2:#1c1830;--pline:#2a2340;--pink:#ece7f5;--pmu:#a59fba;--pvio:#a78bfa;--pgold:#d9b86c;--pbad:#ec8aa0;--pok:#86d1ae;
--disp:Cinzel,Georgia,serif;--deco:"Cinzel Decorative",Cinzel,Georgia,serif;--serif:"Cormorant Garamond",Georgia,serif;--ui:Inter,system-ui,sans-serif;--num:"Space Grotesk",Inter,sans-serif;
--bar:calc(72px + env(safe-area-inset-bottom,0px));color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:auto;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:radial-gradient(1100px 640px at 28% -8%,#33201a 0,#120d0b 68%),#120d0b;color:var(--pink);font:15px/1.6 var(--ui);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#120d0b;z-index:60}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--pgold);outline-offset:2px}
html{scrollbar-gutter:stable}
html.lock{overflow:hidden}
[hidden]{display:none!important}
.view.enter{animation:vfade .5s ease-out backwards}
.mis.enter .scroll{animation:vin .8s cubic-bezier(.22,1,.36,1) backwards}
.view.leave{animation:vout .24s ease-in forwards;pointer-events:none}
@keyframes vin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes vfade{from{opacity:0}}
@keyframes vout{to{opacity:0}}
.col{min-width:0;padding:0 max(24px,env(safe-area-inset-right,0px)) 120px max(24px,env(safe-area-inset-left,0px))}

/* ===== selector de misiones ===== */
.home{position:relative;min-height:100vh;padding:calc(56px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 64px max(24px,env(safe-area-inset-left,0px));overflow:hidden}
.home::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(900px 520px at 50% -6%,rgba(217,160,90,.16),transparent 62%),radial-gradient(1200px 700px at 50% 120%,rgba(0,0,0,.55),transparent 60%)}
.home::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .5 0 0 0 0 .4 0 0 0 0 .3 0 0 0 .35 0'/%3E%3C/filter%3E%3Crect width='220' height='220' filter='url(%23n)'/%3E%3C/svg%3E")}
.hwrap{position:relative;z-index:1;max-width:1120px;margin:0 auto}
.hhead{text-align:center;margin:0 auto 44px;max-width:720px}
.hhead .sigil{width:58px;height:58px;color:var(--pgold);filter:drop-shadow(0 0 14px rgba(217,184,108,.35))}
.hhead .eb{color:#c99a62;letter-spacing:.32em;text-wrap:balance}
.hhead h1{margin:6px 0 0;font:700 clamp(36px,6.4vw,64px)/1.05 var(--deco);letter-spacing:.01em;background:linear-gradient(180deg,#f8ead0 0,#e2c37f 48%,#a87d34 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance;filter:drop-shadow(0 2px 18px rgba(217,160,90,.18))}
.hhead .orn{margin:16px auto 14px;color:#9c7a3c}
.hhead p.lead{margin:0;text-wrap:balance;font:italic 500 clamp(19px,2.4vw,22px)/1.45 var(--serif);color:#cdb894}
.hprog{display:inline-flex;align-items:center;gap:12px;white-space:nowrap;margin-top:18px;font:600 11px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:#a8906c}
.hprog i{display:flex;gap:7px;align-items:center}.hprog i b{width:8px;height:8px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.2px #6a5236}
.hprog i b.on{width:10px;height:10px;background:radial-gradient(circle at 35% 30%,#f6e3b0,#c99a48 60%,#8f6a1f);box-shadow:0 0 0 3px rgba(217,184,108,.16),0 0 10px rgba(226,195,127,.55)}
.mgridh{display:grid;gap:22px;grid-template-columns:repeat(3,minmax(0,1fr))}
.mcard{position:relative;display:flex;flex-direction:column;border-radius:10px;min-width:0;animation:vin .7s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*70ms + 120ms)}
.mcard .art{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:6px}
.mcard .txt{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.mcard .mn{font:600 11px var(--ui);letter-spacing:.28em;text-transform:uppercase}
.mcard h2{margin:0;font:700 22px/1.2 var(--disp);text-wrap:balance}
.mcard .th{margin:0;font:italic 500 18px/1.35 var(--serif)}
/* misión disponible: folio de pergamino */
.mcard.on{color:var(--ink);padding:10px;box-shadow:inset 0 0 46px rgba(100,58,20,.38),0 0 0 1px rgba(217,184,108,.55),0 0 0 6px rgba(18,13,11,.9),0 0 0 7px rgba(217,184,108,.35),0 24px 60px rgba(0,0,0,.6),0 0 80px rgba(217,160,90,.12);transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s}
.mcard.on .art{background:#1a1322;border:1.5px solid var(--goldd);box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.mcard.on .art svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.22,1,.36,1)}
.mcard.on .art .wax{position:absolute;left:14px;top:12px;width:48px;height:48px;font-size:16px;z-index:1}
.mcard.on .mn{color:var(--red)}
.mcard.on .th{color:var(--ink2)}
.mcard.on .meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.mcard.on .meta span{border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font:500 12px var(--ui);color:var(--ink2);background:rgba(255,248,230,.4)}
.mcard.on .meta b{color:var(--ink)}
.mst{display:flex;align-items:center;gap:8px;margin:auto 0 0;padding-top:14px;font:600 12px var(--ui);color:var(--ink2)}
.mst i{width:8px;height:8px;border-radius:50%;background:#5f8f6c;box-shadow:0 0 0 3px rgba(95,143,108,.2)}
.mst.live i{background:#7b5fd6;box-shadow:0 0 0 3px rgba(123,95,214,.22);animation:blink 2s infinite}
@keyframes blink{50%{box-shadow:0 0 0 6px rgba(123,95,214,0)}}
.go{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;padding:13px 18px;border:0;border-radius:8px;background:linear-gradient(180deg,#9a3442,#7a2431);color:#f8ead0;font:700 12.5px var(--ui);letter-spacing:.2em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px rgba(122,36,49,.35)}
.go::after{content:"";position:absolute;inset:0;border-radius:10px}
.go svg{width:16px;height:16px;transition:transform .3s}
.mcard.on:hover{transform:translateY(-4px)}
.mcard.on:hover .art svg{transform:scale(1.04)}
.mcard.on:hover .go svg{transform:translateX(4px)}
.mcard.on:has(.go:focus-visible){outline:2px solid var(--pgold);outline-offset:10px}
.go:focus-visible{outline:none}
/* misiones selladas */
.mcard.lk{color:#bda98a;background:linear-gradient(165deg,#21170f 0,#150f0b 70%);border:1px solid #3a2a1c;box-shadow:inset 0 1px 0 rgba(255,230,180,.05),0 18px 40px rgba(0,0,0,.4);padding:10px}
.mcard.lk .art{display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#2a1d14,#120c09 72%);border:1px solid #2e2116;box-shadow:inset 0 0 50px rgba(0,0,0,.7)}
.mcard.lk .emb{width:46%;max-width:120px;color:#8a6a3a;opacity:.55;filter:drop-shadow(0 1px 0 rgba(0,0,0,.8))}
.mcard.lk .lock{position:absolute;right:12px;top:12px;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6d2b33,#3d141b 72%);box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.25);color:#d9a8a8}
.mcard.lk .lock svg{width:16px;height:16px}
.mcard.lk .mn{color:#8f7556}
.mcard.lk h2{color:#d9c6a5}
.mcard.lk .th{color:#9d8a6e}
.soon{align-self:flex-start;margin-top:auto;padding-top:12px;font:600 10.5px var(--ui);letter-spacing:.24em;text-transform:uppercase;color:#7d6748}
.wax{display:grid;place-items:center;border-radius:50%;font:700 17px var(--disp);color:#f6e9d0;background:radial-gradient(circle at 35% 30%,#c4505f,#7a2431 70%);box-shadow:0 3px 10px rgba(0,0,0,.55),inset 0 0 0 3px rgba(0,0,0,.14),inset 0 0 0 5px rgba(255,255,255,.06)}
.hfoot{margin:48px auto 0;max-width:640px;text-align:center;font:500 12.5px/1.6 var(--ui);color:#7d6a52}

/* barra superior de la misión: volver + capítulos */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 auto;max-width:940px;display:flex;align-items:center;gap:10px;padding:10px 0 8px;background:linear-gradient(#120d0bf2 70%,#120d0b00)}
.back{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px 0 11px;border-radius:999px;border:1px solid #6b4a2a;background:linear-gradient(180deg,#2c1d12,#1c130c);color:#f1e2c2;font:600 12px var(--ui);letter-spacing:.12em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,230,180,.08),0 4px 12px rgba(0,0,0,.35);transition:border-color .2s,background .2s}
.back svg{width:16px;height:16px;color:var(--pgold);transition:transform .25s}
.back:hover{border-color:var(--pgold)}.back:hover svg{transform:translateX(-3px)}
.toc{flex:1;min-width:0;display:flex;gap:1px;overflow-x:auto;scrollbar-width:none}
.toc.ov{-webkit-mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.toc::-webkit-scrollbar{display:none}
.toc a{white-space:nowrap;text-decoration:none;color:#bfa985;font:600 12px var(--ui);letter-spacing:.12em;text-transform:uppercase;padding:9px 11px;border-radius:999px}
.toc a:hover{color:#f1e6cb}
.toc a.on{background:#3a2616;color:#f6e9d0;box-shadow:inset 0 0 0 1px #6b4a2a}

/* pergamino */
.scroll{max-width:900px;margin:6px auto 0}
.roller{position:relative;height:34px;border-radius:17px;background:linear-gradient(#3a2412,#a77c46 28%,#dcbc7c 50%,#8a6234 74%,#2f1c0d);box-shadow:0 10px 24px rgba(0,0,0,.55);z-index:2}
.roller::before,.roller::after{content:"";position:absolute;top:-5px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0dba0,#9a742d 62%,#4a3212);box-shadow:0 4px 10px rgba(0,0,0,.5)}
.roller::before{left:-16px}.roller::after{right:-16px}
.sheet{position:relative;margin:-4px 20px;padding:72px clamp(22px,7vw,88px) 80px;color:var(--ink)}
.sheet,.mcard.on{background:radial-gradient(120% 50% at 50% 0,rgba(255,250,235,.28),transparent 60%),
url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='260' height='260'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .36 0 0 0 0 .24 0 0 0 0 .1 0 0 0 .2 0'/%3E%3C/filter%3E%3Crect width='260' height='260' filter='url(%23n)'/%3E%3C/svg%3E"),
linear-gradient(90deg,#cdb27c 0,#e6d3a8 7%,#ecdcb9 50%,#e6d3a8 93%,#cdb27c 100%);
box-shadow:inset 0 0 70px rgba(100,58,20,.42),0 30px 80px rgba(0,0,0,.6)}
.sheet p{margin:0 0 14px}
.eb{margin:0 0 6px;font:600 11px var(--ui);letter-spacing:.28em;text-transform:uppercase;color:var(--red)}
.sheet h2{margin:0 0 4px;font:700 clamp(26px,4.4vw,38px)/1.12 var(--disp);color:var(--ink);text-wrap:balance}
.sheet h3{margin:0 0 6px;font:700 17px/1.25 var(--disp);color:var(--ink)}
.orn{display:block;width:min(320px,80%);height:22px;margin:10px 0 22px;color:var(--goldd)}
.sec>.eb,.sec>h2{text-align:center}
.sec>.orn{margin-left:auto;margin-right:auto}
.sec{padding-top:56px}
.sec:first-of-type{padding-top:40px}
.body{font:500 clamp(19px,2.3vw,21px)/1.55 var(--serif)}
.body p{max-width:64ch}
.note{font:italic 500 19px/1.45 var(--serif);color:var(--ink2)}
.small{font:500 13.5px/1.55 var(--ui);color:var(--ink2)}
.hl{color:var(--red)}

/* portada */
.cover{text-align:center;padding-bottom:20px}
.sigil{display:block;margin:0 auto 14px;width:54px;height:54px;color:var(--goldd)}
.cover h1{margin:0 0 6px;font:700 clamp(40px,8.6vw,76px)/1.04 var(--deco);color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.cover .sub{margin:0 auto 22px;font:italic 500 clamp(19px,2.6vw,25px)/1.35 var(--serif);color:var(--ink2);max-width:34ch}
.plate{padding:8px;border:1.5px solid var(--goldd);border-radius:4px;background:#1a1322;box-shadow:0 0 0 5px rgba(234,217,180,.9),0 0 0 6.5px var(--goldd),0 18px 36px rgba(60,30,10,.45);margin:0 8px}
.plate svg{display:block;width:100%;height:auto}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:30px 0 8px}
.chips span{border:1px solid var(--rule);border-radius:999px;padding:5px 14px;font:500 13px var(--ui);color:var(--ink2);background:rgba(255,248,230,.35)}
.chips b{color:var(--ink)}

/* prólogo */
.drop::first-letter{float:left;font:700 4.4em/.78 var(--deco);padding:.09em .1em 0 0;color:var(--red)}
/* tres ejemplos de una tabla: lo mejor, lo peor y uno al azar */
.picks{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr));margin:18px 0 6px}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;border:1px solid var(--rule);border-radius:8px;padding:30px 16px 18px;background:rgba(255,248,230,.42);box-shadow:inset 0 0 24px rgba(120,80,30,.08)}
.pick .lb{position:absolute;top:-11px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:3px 12px;border-radius:999px;font:600 10.5px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:#f6e9d0;background:#7a2431}
.pick.best .lb{background:#8f6a1f}.pick.rnd .lb{background:#4a3a8a}
.pick .seal{min-width:52px;width:auto;height:52px;padding:0 14px;border-radius:999px;font:700 16px var(--disp);white-space:nowrap;margin-bottom:12px}
.pick h3{margin:0 0 4px;font:700 16px/1.25 var(--disp);color:var(--ink)}
.pick p{margin:0;font:500 16.5px/1.4 var(--serif);color:var(--ink2)}
.pick small{display:block;margin-top:8px;font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);opacity:.75}
@media (max-width:640px){.picks{grid-template-columns:1fr;gap:20px}}

/* objetivos */
.objs{display:grid;gap:18px;margin:0 0 22px}
.ob{display:flex;gap:16px;align-items:flex-start}
.seal{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--disp);color:#f6e9d0;background:radial-gradient(circle at 35% 30%,#b84a58,#7a2431 70%);box-shadow:0 3px 8px rgba(60,20,10,.5),inset 0 0 0 3px rgba(0,0,0,.12)}
.seal.v{background:radial-gradient(circle at 35% 30%,#8a74d0,#4a3a8a 70%)}
.seal.g{background:radial-gradient(circle at 35% 30%,#e0c57c,#8a6a28 70%);color:#2b1d12}
.seal.o{background:none;border:2px dashed var(--red);color:var(--red);box-shadow:none}
.ob p{font:500 19px/1.5 var(--serif);margin:0}
.tw{overflow-x:auto;margin:6px 0 18px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;color:inherit}
th{font:600 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#7a5a38;text-align:left;padding:8px 10px;border-bottom:1.5px solid #6b4a2a}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top;font:500 16px/1.45 var(--serif);color:#3b2716}
td b{color:#2b1d12}
td:first-child{font:700 13px var(--ui);white-space:nowrap}
tr.cur td{background:rgba(138,42,53,.12)}
td.num{font-family:var(--ui);font-size:14px;font-weight:600}

/* pasos y mapa */
.steps{list-style:none;margin:0 0 22px;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;margin-bottom:12px;font:500 19px/1.5 var(--serif)}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--goldd);display:grid;place-items:center;font:700 14px var(--disp);color:var(--red);margin-top:2px}
.map{margin:10px 0 0;padding:10px;border:1px solid var(--rule);border-radius:4px;background:rgba(255,248,230,.3)}
.map svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
.map figcaption{font:500 13px/1.5 var(--ui);color:var(--ink2);margin-top:8px;text-align:center}
.fold{margin:12px 0;border:1px solid var(--rule);border-radius:6px;background:rgba(255,248,230,.3)}
.fold summary{cursor:pointer;list-style:none;padding:13px 16px;font:700 14px var(--disp);letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"+";font:600 20px var(--ui);color:var(--red)}
.fold[open] summary::after{content:"–"}
.fold .in{padding:4px 16px 14px}
.evg{display:grid;gap:4px 28px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.evg div{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);font:500 16px/1.4 var(--serif)}
.evg b{flex:none;width:28px;font:700 13px var(--ui);color:var(--red);padding-top:2px}

/* enemigos */
.mons{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:6px 0 24px}
.mon{border:1px solid var(--rule);border-radius:6px;padding:12px 14px 14px;background:rgba(255,248,230,.3)}
.mon svg{display:block;width:100%;max-width:150px;margin:0 auto 8px}
.mon p{font:500 17px/1.4 var(--serif);margin:0}
.bars{margin:6px 0 20px}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font:500 13px var(--ui);color:var(--ink2)}
.bar .t{flex:1;height:9px;border-radius:5px;background:rgba(90,60,30,.18);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#b8923f,#8f6a1f)}

/* heraldo */
.her{display:grid;gap:32px;grid-template-columns:minmax(0,240px) minmax(0,1fr);align-items:start}
@media (max-width:640px){.her{grid-template-columns:1fr;justify-items:center}.her .body{justify-self:stretch}}
.porf{margin:0;width:100%;max-width:240px}
.por{display:block;width:100%;height:auto;max-width:240px;border-radius:4px;border:1.5px solid var(--goldd);box-shadow:0 0 0 4px rgba(234,217,180,.9),0 0 0 5.5px var(--goldd),0 16px 30px rgba(60,30,10,.35)}
.porf figcaption{margin-top:14px;text-align:center;font:600 10.5px var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);opacity:.8}
.quote{position:relative;margin:26px 0 0;padding:22px 26px 20px;border-top:1px solid var(--goldd);border-bottom:1px solid var(--goldd);text-align:center}
.quote::before{content:"“";display:block;height:30px;margin:-4px 0 6px;font:700 54px/1 var(--deco);color:var(--red)}
.quote p{margin:0!important;font:italic 600 clamp(21px,2.6vw,25px)/1.4 var(--serif);color:var(--ink)}
.quote cite{display:block;margin-top:10px;font:600 11px var(--ui);font-style:normal;letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
/* ficha del Heraldo en la mesa (solo cuando entra en juego) */
.hfi{margin:10px 0 4px;padding:14px;border-radius:13px;border:1px solid #5b4a2a;background:linear-gradient(135deg,#2a2112,#1c1830)}
.hfimg{margin:-14px -14px 12px;overflow:hidden;border-radius:12px 12px 0 0;border-bottom:1px solid #5b4a2a}
.hfimg img{display:block;width:100%;height:auto}
/* Oleadas: grupos (en mesa / recién llegadas), contador de copias y recuadro fijo del jefe */
.grp{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 0 2px;padding-top:10px;border-top:1px dashed #3a3358;font:600 11px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--pmu)}
.grp span{font:600 11.5px var(--num);letter-spacing:.04em;text-transform:none}
.grp.new{color:var(--pgold)}
.un.gone{opacity:.45}.un.gone b{text-decoration:line-through;text-decoration-color:var(--pmu)}
.cnt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;padding:6px 8px;border-radius:9px;background:var(--pcard2);border:1px solid #2f2848;font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--pmu)}
.cnt .segs{display:flex;gap:4px}
.cnt .segs button{min-width:30px;height:28px;padding:0 8px;border-radius:7px;border:1px solid #3a3358;background:none;color:var(--pink);font:700 13px var(--num)}
.cnt .segs button.on{background:var(--pvio);border-color:var(--pvio);color:#0c0a12}
.cnt .segs button:hover:not(.on){border-color:var(--pvio)}
.cnt .rm{margin-left:auto;border:1px solid #6b3a48;background:none;color:var(--pbad);border-radius:7px;padding:6px 10px;font:600 11px var(--ui);letter-spacing:.06em;text-transform:none}
.cnt .rm:hover{background:rgba(236,138,160,.1)}
.cnt.off{justify-content:space-between;letter-spacing:.04em;text-transform:none;font-size:12px}
.cnts{display:grid;gap:6px;margin-top:8px}.cnts .cnt{margin-top:0}
.cnt>span:first-child{min-width:66px}
.wcard{scroll-margin-top:8px}
.wcard h3 em{font:600 11.5px var(--num);letter-spacing:.02em;text-transform:none;color:var(--pmu)}
.wsum{margin:0 0 10px;font-size:12.5px;line-height:1.5;color:var(--pmu)}
.wtog{position:sticky;bottom:12px;z-index:4;display:flex;justify-content:flex-end;margin:14px -4px 0 0;pointer-events:none}
.wtog button{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 14px;border-radius:999px;border:1px solid var(--pgold);background:linear-gradient(180deg,#2a2150,#1c1830);color:var(--pgold);font:700 11.5px var(--ui);letter-spacing:.12em;text-transform:uppercase;box-shadow:0 8px 22px rgba(0,0,0,.55),0 0 0 4px rgba(12,10,18,.7)}
.wtog button:hover{background:#2f2560}
.wtog svg{width:16px;height:16px}
.wtog button.ic{position:relative;width:46px;height:46px;padding:0;justify-content:center}
.wtog button.ic svg{width:20px;height:20px}
.wtog button.ic small{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;font-size:11px}
.wcard:not(.min) .un,.wcard:not(.min) .grp{padding-right:50px}
.wtog small{display:grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--pgold);color:#1a1208;font:700 12px var(--num);letter-spacing:0}
.hbx{position:sticky;top:-10px;z-index:3;display:flex;gap:12px;align-items:center;margin:0 0 12px;padding:10px;border-radius:12px;border:1px solid var(--pgold);background:linear-gradient(135deg,#2a2112,#1c1830);box-shadow:0 0 0 3px rgba(217,184,108,.08)}
.hbx img{flex:none;width:64px;height:81px;object-fit:cover;border-radius:7px;border:1px solid #5b4a2a}
.hbx>div{min-width:0}
.hbx .hbt{margin:0;font:600 10.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--pgold)}
.hbx b{display:block;margin-top:2px;font:700 15px var(--disp);color:var(--pink)}
.hbx .chipsr{margin:6px 0 2px}.hbx .linkb{padding-left:0}
.hfi h4{margin:0 0 8px;font:700 13px var(--ui);letter-spacing:.04em;color:var(--pgold)}
.hfi .chipsr{margin:0 0 10px}
.hfi p{margin:0 0 7px;font-size:12.5px;line-height:1.5;color:var(--pmu)}.hfi p b{color:var(--pink)}
.hfi ul{list-style:none;margin:0 0 8px;padding:0}.hfi li{padding:6px 0;border-top:1px solid #3a3024;font-size:12.5px;line-height:1.45;color:var(--pmu)}.hfi li b{color:var(--pgold);margin-right:6px}

/* lecturas */
.tl{list-style:none;margin:0;padding:0 0 0 24px;border-left:1.5px solid var(--goldd)}
.tl li{position:relative;padding:0 0 22px 22px}
.tl li::before{content:"";position:absolute;left:-31px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px #e8d6ac}
.tl h3{font:700 12px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
.tl p{font:italic 500 clamp(19px,2.3vw,21px)/1.5 var(--serif);margin:0;max-width:62ch}
.fins{display:grid;gap:14px;margin-top:8px}
.fin{border-left:3px solid var(--red);padding:4px 0 4px 16px;font:500 19px/1.5 var(--serif)}
.foot{margin:44px 0 0;padding-top:20px;border-top:1px solid var(--rule);font:500 13px/1.55 var(--ui);color:var(--ink2)}

/* ===== panel de juego ===== */
/* capa a pantalla completa que entra desde la derecha */
.panel{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;color:var(--pink);
background:radial-gradient(1000px 520px at 88% -12%,rgba(167,139,250,.13),transparent 62%),radial-gradient(800px 480px at -6% 112%,rgba(217,184,108,.07),transparent 60%),var(--pbg);
box-shadow:-40px 0 90px rgba(0,0,0,.7);transform:translateX(102%);visibility:hidden;
transition:transform .62s cubic-bezier(.22,1,.36,1),visibility 0s linear .62s}
.panel.open{transform:none;visibility:visible;transition:transform .62s cubic-bezier(.22,1,.36,1),visibility 0s}
.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(transparent,rgba(217,184,108,.5),transparent)}
.phead{flex:none;display:flex;align-items:center;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--pline);background:linear-gradient(180deg,rgba(12,10,18,.96),rgba(12,10,18,.82));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.px{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid #3a3358;background:radial-gradient(circle at 35% 30%,#221c38,#15121f);color:var(--pink);transition:border-color .2s,transform .35s cubic-bezier(.22,1,.36,1),color .2s}
.px svg{width:18px;height:18px}
.px:hover{border-color:var(--pgold);color:var(--pgold);transform:rotate(90deg)}
.ptl{min-width:0}
.ptl small{display:block;font:600 10.5px var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--pmu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptl h2{margin:2px 0 0;font:700 17px/1.1 var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--pgold)}
.pst{display:flex;gap:8px;margin-left:auto;align-items:center}
.pst span{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--pline);background:var(--pcard);font:600 12px var(--ui);color:var(--pmu);white-space:nowrap}
.pst span b{font:700 14px var(--num);color:var(--pink)}
.pst .mp{display:flex;gap:3px}.pst .mp i{width:9px;height:6px;border-radius:2px;background:#2a2340}.pst .mp i.on{background:linear-gradient(90deg,#a78bfa,#d9b86c)}
#pact{flex:none;margin-left:4px}
.pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:22px max(22px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));scrollbar-width:thin;scrollbar-color:#3a3358 transparent}
.pwrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.mgrid{display:grid;gap:16px;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));align-items:start}
.pwrap.c1{max-width:640px}
#pact{display:flex;gap:8px}
.panel.intro .pwrap>.finw,.panel.intro .pwrap>.txtw{animation:vin .65s cubic-bezier(.22,1,.36,1) both;animation-delay:160ms}
/* Pantalla de configuración (antes de empezar la partida): solo la tarjeta de configuración, centrada y en grande. */
.setupw{max-width:640px;margin:clamp(0px,4vh,48px) auto 0;display:flex;flex-direction:column;gap:16px;animation:vin .6s cubic-bezier(.22,1,.36,1) both}
.setupw .pc{padding:28px clamp(18px,4vw,36px)}
.setupw .pc h3{justify-content:center;margin-bottom:20px}
.setupw .pc h3 .tt{font-size:13px;padding:6px 16px}
.setupw .seals{justify-content:center;gap:12px}
.setupw .seals button{width:52px;height:52px;font-size:20px}
.setupw .seals+p{text-align:center;font-size:14px!important}
.setupw .stp{font-size:15px;margin-top:16px}
.setupw .stp b{font-size:20px}
.setupw .startw{margin-top:24px;padding-top:24px}
.mcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel.intro .pwrap>.alert,.panel.intro .mcol>*{animation:vin .65s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--c,0)*80ms + var(--r,0)*70ms + 200ms)}
.mcol>*:nth-child(2){--r:1}.mcol>*:nth-child(3){--r:2}.mcol>*:nth-child(n+4){--r:3}
.pc{background:linear-gradient(180deg,#17142250,transparent 40%),var(--pcard);border:1px solid var(--pline);border-radius:16px;padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 14px 34px rgba(0,0,0,.28)}

/* botón flotante de la mesa */
.fab{position:fixed;z-index:45;right:max(22px,calc(env(safe-area-inset-right,0px) + 14px));bottom:max(22px,calc(env(safe-area-inset-bottom,0px) + 14px));display:flex;align-items:center;gap:12px;padding:7px 22px 7px 7px;border:0;border-radius:999px;color:#0c0a12;text-align:left;
background:linear-gradient(180deg,#c3b0ff 0,#a78bfa 45%,#8e6ff0 100%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(60,30,140,.25),0 0 0 1px rgba(167,139,250,.55),0 12px 30px rgba(110,80,220,.45),0 4px 10px rgba(0,0,0,.4);
transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s;animation:fabin .7s cubic-bezier(.22,1,.36,1) .45s backwards}
.fab:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(60,30,140,.25),0 0 0 1px rgba(201,184,255,.8),0 18px 40px rgba(110,80,220,.55),0 6px 14px rgba(0,0,0,.4)}
.fab:active{transform:translateY(0) scale(.98)}
.fab:focus-visible{outline:2px solid var(--pgold);outline-offset:4px}
@keyframes fabin{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
.fring{position:relative;flex:none;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a2150,#0f0c18);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 2px 6px rgba(40,20,90,.45);display:grid;place-items:center;color:var(--pgold)}
.fring svg.rg{position:absolute;inset:0;width:100%;height:100%}
.fring .ic{width:22px;height:22px}
.fring b{position:relative;font:700 19px/1 var(--num);color:#f3eefe}
.ftx b{display:block;font:700 12.5px/1.2 var(--ui);letter-spacing:.16em;text-transform:uppercase}
.ftx small{display:block;margin-top:3px;font:600 12px/1.2 var(--ui);color:#2b1f55}
.pc h3{margin:0 0 10px;font:600 11px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--pmu);display:flex;justify-content:space-between;align-items:center;gap:8px}
.pc h3 em{font-style:normal;color:var(--pmu);letter-spacing:.1em;text-align:right}
.startw{display:flex;justify-content:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--pline)}
.pb.big{text-transform:uppercase;letter-spacing:.16em;padding:12px 28px;font:700 13px var(--ui);border-radius:12px;box-shadow:0 6px 18px rgba(167,139,250,.25)}
.play{flex:none;width:32px;height:32px;padding:0;border-radius:50%;border:1px solid var(--pgold);background:radial-gradient(circle at 35% 30%,#2a2150,#15121f);color:var(--pgold);display:grid;place-items:center}
.play:hover{background:#2a2150}.play svg{width:14px;height:14px;margin-left:2px}
.plays{display:inline-flex;gap:6px}.play.np svg{margin-left:0}
.mkr{padding:9px 10px;margin:0 0 6px;border:1px solid var(--pline);border-radius:11px;background:var(--pcard2)}
.mkr b{font-weight:600}.mkr.on{border-color:#5b4a2a;background:linear-gradient(135deg,#2a2112,#1c1830)}.mkr.on b{color:var(--pgold)}
.res.dim{opacity:.55}
.pb:disabled{opacity:.45;cursor:not-allowed;background:none}
.exit{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:16px;padding:12px 14px;border-radius:13px;border:1px solid #5b4a2a;background:linear-gradient(135deg,#2a2112,#1c1830);color:var(--pink)}
.exit svg{flex:none;width:32px;height:32px;color:var(--pgold)}
.exit b{display:block;font-size:13.5px;color:var(--pgold)}.exit small{display:block;margin-top:2px;color:var(--pmu);font-size:12px;line-height:1.4}
.exit:hover:not(:disabled){border-color:var(--pgold)}
.exit.on{background:linear-gradient(135deg,#e2c47c,#a8843a);border-color:var(--pgold)}.exit.on b,.exit.on small,.exit.on svg{color:#1a1208}
.exit:disabled{opacity:.45;cursor:not-allowed}
.seals button:disabled{cursor:not-allowed}.seals button:disabled:not(.on){opacity:.35}
.stp button:disabled{opacity:.3;cursor:not-allowed}
.lockn{display:flex;gap:10px;align-items:center;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--pline);font-size:12.5px;line-height:1.45;color:var(--pmu)}
.lockn svg{flex:none;width:18px;height:18px;color:var(--pgold)}
.dblk+.dblk{margin-top:18px;padding-top:16px;border-top:1px solid var(--pline)}
.dctl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;margin-top:12px}
.dctl.man{margin-top:10px;justify-content:center}
.dctl.ctr{justify-content:center}.dctl.ctr .pb{min-width:132px}
.cwrap{display:flex;justify-content:center}
.rnum{display:flex;align-items:center;gap:10px}
.rnum small{font:600 10.5px/1.3 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--pmu);text-align:right;max-width:72px}
.dctl .or{font:600 10.5px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pmu);padding:0 2px 10px}
.dl{display:flex;flex-direction:column;gap:3px}.dl small{font-size:10.5px;letter-spacing:.06em;color:var(--pmu)}
.dsel{appearance:none;-webkit-appearance:none;width:58px;height:33px;padding:0 22px 0 12px;border-radius:9px;border:1px solid #3a3358;background:var(--pcard2) url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23d9b86c' stroke-width='1.5'/%3E%3C/svg%3E") no-repeat right 9px center;color:var(--pink);font:700 15px var(--num);cursor:pointer}
.dsel:focus-visible{outline:2px solid var(--pgold);outline-offset:2px}
.dsel option{background:#1c1830;color:#ece7f5}
/* Aviso de evento pendiente: lo que más resalta de la mesa, justo encima de «Tirar». */
.dnote{flex-basis:100%;margin:0 0 2px;text-align:center;font:800 14px/1.3 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#ffe27a;text-shadow:0 0 10px rgba(255,214,90,.75),0 0 22px rgba(255,170,40,.45);animation:dng 1.6s ease-in-out infinite}
@keyframes dng{50%{color:#fff3c4;text-shadow:0 0 14px rgba(255,226,122,.95),0 0 30px rgba(255,170,40,.6)}}
@media (prefers-reduced-motion:reduce){.dnote{animation:none}}
/* Hasta tirar el primer evento de Neth, todo lo demás de la mesa queda bloqueado (menos el audio del texto). */
.evlock .mcol>.mc:not([data-k="dice"]),.evlock .dblk:not(.evb){opacity:.32;filter:grayscale(.6);pointer-events:none;user-select:none}.dmsg{margin:8px 0 0;font-size:12px;line-height:1.45;color:var(--pbad)}
.armyb{margin-top:16px;padding-top:14px;border-top:1px solid var(--pline)}
.armyr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.armyr p{margin:0;font-size:12.5px;line-height:1.45;color:var(--pmu)}.armyr p b{display:block;font-size:14px;color:var(--pink)}
.rbox{display:flex;align-items:center;gap:16px}
.rbox>b{font:700 46px/1 var(--num);color:var(--pink);min-width:44px;text-align:center}
.rbox{align-items:flex-start}.rbox>b{padding-top:4px}
.fx{list-style:none;margin:8px 0 0;padding:0}
.fx li{position:relative;padding:0 0 6px 14px;font-size:13px;line-height:1.35}
.fx li::before{content:"";position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:50%;background:var(--pgold)}
.fx li b{color:var(--pink);font-weight:600}.fx li small{display:block;color:var(--pmu);font-size:12px}
.nxt{margin:6px 0 0;padding-top:10px;border-top:1px solid var(--pline);font-size:12px;line-height:1.45;color:var(--pmu)}
.pb.mid{text-transform:uppercase;letter-spacing:.14em;padding:9px 20px;font:700 12px var(--ui);border-radius:10px}
.hintc{margin:8px 0 0;text-align:center;font-size:12px;color:var(--pmu)}
.alw{margin-top:14px;padding:12px 14px;border-radius:13px;border:1px solid #5b4a2a;background:linear-gradient(135deg,#2a2112,#1c1830)}
.alwh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.alwh b{font:700 13px var(--ui);color:var(--pgold);letter-spacing:.04em}.alwh span{font:600 12px var(--num);color:var(--pmu)}
.alw .un{border-top-color:#3a3024}
.linkb{border:0;background:none;padding:4px 6px;font:600 12px var(--ui);color:var(--pmu);text-decoration:underline;text-underline-offset:3px;text-decoration-color:#4a4268}
.linkb:hover{color:var(--pgold)}
.alh{list-style:none;margin:8px 0 0;padding:0}
.alh li{padding:8px 0;border-top:1px solid var(--pline);font-size:12.5px;color:var(--pmu)}
.alh li b{color:var(--pink);font-size:13px;margin-right:8px}.alh li small{font:600 11.5px var(--num)}.alh li span{display:block;margin-top:3px;line-height:1.45}
.pc h3 .tt{flex:none;border:1px solid var(--pgold);color:var(--pgold);border-radius:999px;padding:3px calc(11px - .2em) 3px 11px}
.pb{border:1px solid #5b49a8;background:none;color:#cdbfff;border-radius:11px;padding:10px 14px;font:600 13px var(--ui)}
.pb:hover{background:#2a2150}
.pb.pr{background:var(--pvio);border-color:var(--pvio);color:#0c0a12}
.pb.pr:hover{background:#c9b8ff}
.pb.gh{border-color:var(--pline);color:var(--pmu)}
.pb.sm{padding:7px 11px;font-size:12px;border-radius:9px}
.defw{justify-content:center;margin-top:16px}
.pb.defb{padding:12px 30px;border-radius:12px;font:700 13.5px var(--ui);letter-spacing:.16em;text-transform:uppercase}
.pb.pulse{box-shadow:0 0 0 0 #a78bfa88;animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 10px #a78bfa00}100%{box-shadow:0 0 0 0 #a78bfa00}}
@media (prefers-reduced-motion:reduce){.pb.pulse{animation:none;box-shadow:0 0 0 2px #a78bfa88}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seals{display:flex;gap:8px}
.seals button{width:40px;height:40px;border-radius:50%;border:1.5px solid #4a4268;background:none;color:var(--pmu);font:700 15px var(--num)}
.seals button.on{background:radial-gradient(circle at 35% 30%,#b84a58,#7a2431 70%);border-color:#b84a58;color:#fff}
.stp{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--pmu)}
.stp>span:first-child{flex:1}
.stp button{width:32px;height:32px;border-radius:9px;border:1px solid var(--pline);background:var(--pcard2);font:600 16px var(--ui);color:var(--pink)}
.stp b{min-width:42px;text-align:center;font:700 17px var(--num);color:var(--pink)}
.gauge{display:block;margin:0 auto;width:100%;max-width:250px}
.rd{display:flex;justify-content:space-between;align-items:flex-end;margin:-4px 0 12px}
.rd b{font:700 38px/1 var(--num)}
/* Noche / Alba / Día: subtítulo subrayado dentro de «Número de ronda» (sin cápsula). */

.hf-upl input{position:absolute;width:1px;height:1px;opacity:0}
.hf-note{margin:0;font:400 12px/1.45 var(--ui);color:var(--pmu)}

.hf-imp{display:flex;flex-direction:column;gap:12px}

.hf-steps li b{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--goldd);display:grid;place-items:center;font:700 10px var(--num);color:var(--pgold)}

.hf-prev h4{margin:0;font:700 12px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pok)}

@media (max-width:520px){.hf-skr{grid-template-columns:1fr 32px}.hf-skr .hf-fl:nth-child(2){grid-column:1/-1;order:3}.hf-stt span{font-size:7.5px;letter-spacing:.04em}}

/* ===== selector de campañas (baraja del Umbral) y selector de misiones (mapa del norte) ===== */
.camp,.mapv{--wax:#8a2a35;--gold:#d9b86c;--gold2:#a87d34;--night:#0c0a12}
.keb{margin:0;font:600 11px var(--ui);letter-spacing:.24em;text-transform:uppercase}
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchips span{border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font:500 12px var(--ui);color:var(--ink2);background:rgba(255,248,230,.4)}
.kchips b{color:var(--ink)}
.kcta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 18px;border:0;border-radius:8px;background:linear-gradient(180deg,#9a3442,#7a2431);color:#f8ead0;font:700 12.5px var(--ui);letter-spacing:.2em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px rgba(122,36,49,.35);transition:filter .2s,transform .2s}
.kcta:hover{filter:brightness(1.12)}.kcta:active{transform:translateY(1px)}
.kcta svg{width:16px;height:16px;transition:transform .3s}.kcta:hover svg{transform:translateX(4px)}
.kcta.vio{background:linear-gradient(180deg,#7357d6,#5136a3);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px rgba(81,54,163,.4)}
.kcta.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule)}
.kstl{display:flex;align-items:center;gap:8px;margin:0;font:600 12px var(--ui);color:var(--ink2)}
.kstl i{width:8px;height:8px;border-radius:50%;background:#5f8f6c;box-shadow:0 0 0 3px rgba(95,143,108,.2)}
.kstl.live i{background:#7b5fd6;box-shadow:0 0 0 3px rgba(123,95,214,.22);animation:kblink 2s infinite}
.kstl.done i{background:var(--gold2);box-shadow:0 0 0 3px rgba(168,125,52,.2)}
.kstl.lock i{background:#6a5236;box-shadow:none}
@keyframes kblink{50%{box-shadow:0 0 0 6px rgba(123,95,214,0)}}
@keyframes krise{from{opacity:0;transform:translateY(10px)}}
@keyframes kfade{from{opacity:0}}
.klock{display:flex;gap:10px;align-items:center;padding:11px 13px;border:1px dashed var(--rule);border-radius:8px;font:500 13.5px/1.4 var(--ui);color:var(--ink2);background:rgba(255,248,230,.25)}
.klock svg{width:18px;height:18px;flex:none;color:var(--wax)}
.kres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--rule)}
.kres div{padding:9px 10px;background:#ecdcb8;display:flex;flex-direction:column;gap:1px;min-width:0}
.kres span{font:600 9.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.kres b{font:700 15px/1.25 var(--disp);color:var(--ink)}
.korn{display:flex;align-items:center;gap:10px;color:#8f6a1f}
.korn::before,.korn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(143,106,31,.6),transparent)}
.korn svg{width:14px;height:14px}
.kwax{flex:none;display:grid;place-items:center;width:50px;height:50px;border-radius:50%;font:700 17px var(--disp);color:#f6e2c4;background:radial-gradient(circle at 34% 30%,#b4404f,#7d2230 55%,#4e121b);box-shadow:inset 0 0 0 3px rgba(0,0,0,.18),inset 0 -3px 6px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.45);text-shadow:0 1px 0 rgba(0,0,0,.5)}
.kwax.live{background:radial-gradient(circle at 34% 30%,#9479ea,#5a3fae 55%,#2f1f66)}
.kwax.lock{background:radial-gradient(circle at 34% 30%,#5d4b3b,#3a2d22 55%,#1e1712);color:#a8906c}
.kwax.done{background:radial-gradient(circle at 34% 30%,#d9b86c,#a87d34 55%,#6b4c18);color:#2b1d12;text-shadow:0 1px 0 rgba(255,240,200,.4)}

/* --- campañas: baraja --- */
.camp{position:relative;height:100vh;height:100svh;min-height:660px;overflow:hidden;--ac:#8b6cf0;--cw:168px;--ch:258px;background:radial-gradient(900px 600px at 75% 30%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 70%),radial-gradient(800px 500px at 0% 100%,rgba(217,184,108,.06),transparent 60%),var(--night)}
.kbg{position:absolute;inset:0}
.klay{position:absolute;inset:0}
.klay.in{animation:kfade .8s ease}
.klay img{position:absolute;right:0;top:0;height:100%;width:64%;object-fit:cover;object-position:50% 14%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 42%);mask-image:linear-gradient(90deg,transparent 0,#000 42%);filter:brightness(.62) saturate(.85) contrast(1.05)}
.klay .kbk{position:absolute;right:8%;top:6%;width:min(34%,300px);opacity:.14;color:#c9a456}
.klay .kbk svg{width:100%;height:auto;display:block}
.camp::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(12,10,18,.95) 0,rgba(12,10,18,.55) 34%,transparent 60%),linear-gradient(90deg,rgba(12,10,18,.88),transparent 55%)}
.kbrand{position:absolute;z-index:3;top:calc(30px + env(safe-area-inset-top,0px));left:max(56px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:13px;color:var(--pgold)}
.kbrand .sigil{width:40px;height:40px;filter:drop-shadow(0 0 12px rgba(217,184,108,.35))}
.kbrand b{display:block;font:700 24px/1 var(--deco);letter-spacing:.04em;background:linear-gradient(180deg,#f8ead0,#e2c37f 50%,#a87d34);-webkit-background-clip:text;background-clip:text;color:transparent}
.kbrand span{display:block;margin-top:4px;font:600 10px var(--ui);letter-spacing:.24em;text-transform:uppercase;color:#8f86a6}
.kinfo{position:absolute;z-index:2;left:max(56px,env(safe-area-inset-left,0px));top:calc(150px + env(safe-area-inset-top,0px));width:min(450px,40%);display:flex;flex-direction:column;gap:14px;animation:krise .55s cubic-bezier(.22,1,.36,1)}
.kinfo .keb{color:color-mix(in srgb,var(--ac) 60%,#efe3cc)}
.kinfo .knum{position:absolute;left:-22px;top:-30px;z-index:-1;font:700 170px/1 var(--deco);color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--ac) 45%,transparent);opacity:.55;pointer-events:none}
.kinfo h2{margin:0;font:700 clamp(36px,4.2vw,56px)/1.02 var(--deco);color:#f4e6cc;text-wrap:balance;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.kinfo .hook{margin:0;font:italic 500 21px/1.42 var(--serif);color:#d9cbb2;text-wrap:pretty}
.kinfo .kchips span{background:rgba(255,255,255,.04);border-color:rgba(217,184,108,.25);color:#cdb894}
.kinfo .kchips b{color:#f1e2c4}
.kinfo .kstl{color:#cdb894}
.kinfo .kcta{width:auto;align-self:flex-start;padding:14px 26px}
.kinfo .klock{color:#cdb894;border-color:rgba(217,184,108,.3);background:rgba(255,255,255,.03)}
.kinfo .klock svg{color:#b4404f}
.kfan{position:absolute;left:66%;bottom:44px;z-index:3;width:0;height:var(--ch)}
.kcard{position:absolute;left:calc(var(--cw) / -2);bottom:0;width:var(--cw);height:var(--ch);padding:0;border:0;border-radius:12px;background:#120c1c;transform-origin:50% 330%;transform:rotate(calc(var(--o) * 7deg));transition:transform .55s cubic-bezier(.22,1,.36,1),box-shadow .4s;box-shadow:0 14px 30px rgba(0,0,0,.6),0 0 0 1px rgba(217,184,108,.5);overflow:hidden;animation:kdeal .8s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i) * 70ms + 100ms)}
@keyframes kdeal{from{transform:rotate(0deg) translateY(120px);opacity:0}}
.kcard:hover{transform:rotate(calc(var(--o) * 7deg)) translateY(-16px)}
.kcard.on{transform:rotate(calc(var(--o) * 7deg)) translateY(-44px) scale(1.06);z-index:5;box-shadow:0 24px 50px rgba(0,0,0,.7),0 0 0 1.5px var(--gold),0 0 40px color-mix(in srgb,var(--cac) 55%,transparent)}
.kcard:focus-visible{outline:none;box-shadow:0 0 0 2px var(--gold),0 0 0 5px rgba(217,184,108,.3)}
.kcard::after{content:"";position:absolute;inset:6px;border-radius:8px;border:1px solid rgba(217,184,108,.45);pointer-events:none}
.kcard .kart{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--cac) 55%,#120c1c),#120c1c 75%)}
.kcard .kart img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.kcard .kcn{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:999px;background:rgba(12,10,18,.8);border:1px solid rgba(217,184,108,.6);font:700 12px var(--disp);color:#f1e2c4}
.kcard .kct{position:absolute;inset:auto 0 0;padding:36px 12px 16px;background:linear-gradient(0deg,rgba(12,10,18,.96) 30%,transparent);font:700 13.5px/1.2 var(--disp);letter-spacing:.04em;color:#f4e6cc;text-align:center;text-wrap:balance}
.kcard .kct small{display:block;margin-top:5px;font:600 8.5px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:#a59fba}
.kcard .kback{position:absolute;inset:0;width:100%;height:100%;color:#c9a456}
.kcard.s-lock{background:radial-gradient(circle at 50% 45%,#221830,#0e0a16 75%)}
.kcard.s-lock .kcn{background:transparent;border-color:rgba(217,184,108,.3);color:#a8906c;top:auto;bottom:14px}
.kcard .klv{position:absolute;left:50%;top:52px;transform:translateX(-50%);padding:3px 9px;border-radius:999px;background:#5136a3;color:#efe9ff;font:700 9px var(--ui);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;box-shadow:0 0 0 3px rgba(123,95,214,.25)}
.kcard.shake{animation:kshake .45s}
@keyframes kshake{25%{translate:-5px 0}50%{translate:5px 0}75%{translate:-3px 0}}
.khint{position:absolute;left:max(56px,env(safe-area-inset-left,0px));bottom:32px;z-index:2;margin:0;display:flex;gap:8px;align-items:center;font:600 10.5px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:#7d7494}
.khint kbd{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;border:1px solid #3a3358;background:#15121f;font:600 12px var(--ui);color:#cfc6e4}
@media (max-width:860px){
 .camp{height:auto;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;--cw:124px;--ch:190px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .camp::after{display:none}
 .kbrand{left:max(20px,env(safe-area-inset-left,0px));top:calc(20px + env(safe-area-inset-top,0px))}
 .kbrand .sigil{width:32px;height:32px}.kbrand b{font-size:20px}
 .kbg{position:relative;height:360px;flex:none}
 .kbg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--night) 2%,transparent 60%),linear-gradient(180deg,rgba(12,10,18,.75),transparent 30%)}
 .klay img{width:100%;-webkit-mask-image:none;mask-image:none;object-position:50% 16%}
 .klay .kbk{right:50%;transform:translateX(50%);width:170px;top:70px}
 .kinfo{position:relative;left:auto;top:auto;width:auto;margin:-100px 0 0;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));gap:12px}
 .kinfo .knum{font-size:110px;left:4px;top:-24px}
 .kinfo h2{font-size:34px}.kinfo .hook{font-size:19px}
 .kinfo .kcta{width:100%;align-self:stretch}
 .kfan{position:relative;left:auto;bottom:auto;width:auto;height:auto;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:58px max(20px,env(safe-area-inset-right,0px)) 30px max(20px,env(safe-area-inset-left,0px));margin-top:6px;scrollbar-width:none}
 .kcard{position:relative;left:auto;flex:none;scroll-snap-align:center;transform:none;animation:none}
 .kcard:hover{transform:translateY(-6px)}
 .kcard.on{transform:translateY(-22px)}
 .khint{display:none}
}

/* --- misiones: mapa del norte --- */
.mapv{position:relative;height:100vh;height:100svh;min-height:660px;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr);gap:18px 30px;padding:calc(18px + env(safe-area-inset-top,0px)) max(26px,env(safe-area-inset-right,0px)) 26px max(26px,env(safe-area-inset-left,0px));background:radial-gradient(800px 520px at 30% -4%,rgba(217,160,90,.14),transparent 65%),radial-gradient(900px 600px at 50% 120%,rgba(0,0,0,.6),transparent 60%),#1a120d}
.mvh{grid-column:1/-1;display:flex;align-items:center;gap:16px;min-width:0}
.mvh .mvt{min-width:0}
.mvh .keb{color:#a8906c;font-size:10px}
.mvh h1{margin:2px 0 0;font:700 clamp(20px,2.3vw,28px)/1.1 var(--deco);background:linear-gradient(180deg,#f8ead0,#e2c37f 50%,#a87d34);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvh .mprog{margin-left:auto;display:inline-flex;align-items:center;gap:12px;white-space:nowrap;font:600 11px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:#a8906c}
.mprog i{display:flex;gap:7px;align-items:center}
.mprog i b{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.2px #6a5236}
.mprog i b.on{width:10px;height:10px;background:radial-gradient(circle at 35% 30%,#f6e3b0,#c99a48 60%,#8f6a1f);box-shadow:0 0 0 3px rgba(217,184,108,.16),0 0 10px rgba(226,195,127,.55)}
.mmapw{position:relative;min-height:0;min-width:0}
.mmap{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 20px 28px rgba(0,0,0,.55)) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.mmap text{font-family:var(--serif)}
.mmap .mt{fill:#e6d1a4;stroke:#3b2615;stroke-width:1.5;stroke-linejoin:round}
.mmap .mts{fill:#3b2615;opacity:.2}
.mmap .tr{fill:#e3cc9b;stroke:#3b2615;stroke-width:1.3}
.mmap .trs{fill:none;stroke:#3b2615;stroke-width:2.2;opacity:.32}
.mmap .tk{stroke:#3b2615;stroke-width:1.3}
.mmap .mhl{fill:none;stroke:#3b2615;stroke-width:1.4;opacity:.7}
.mmap .wt{fill:none;stroke:#3f5260;stroke-width:2.4;stroke-linecap:round;opacity:.85}
.mmap .lk{fill:rgba(63,82,96,.16);stroke:#3f5260;stroke-width:1.8}
.mmap .rp{fill:none;stroke:#3f5260;stroke-width:1.2;opacity:.55}
.mmap .gl{fill:#e6d1a4;stroke:#3b2615;stroke-width:1.4;stroke-linejoin:round}
.mmap .fr{fill:none;stroke:#3b2615;stroke-width:1.6;stroke-dasharray:16 6 3 6;opacity:.75}
.mmap .rt-on{fill:none;stroke:#8a2a35;stroke-width:3.4;stroke-dasharray:12 7;stroke-linecap:round}
.mmap .rt-off{fill:none;stroke:#3b2615;stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round;opacity:.55}
.mmap .lab{fill:#3b2615;font:italic 600 19px var(--serif)}
.mmap .cap{fill:#3b2615;font:600 13px var(--disp);letter-spacing:.24em}
.mmap .fogt{fill:#6b4f30;font:italic 500 24px var(--serif);opacity:.6}
.mmap .fogr{transition:transform 1.9s cubic-bezier(.45,0,.2,1)}
.mmap .rv{transform-box:fill-box;transform-origin:center;transition:transform 1.7s .35s cubic-bezier(.3,0,.2,1)}
.mmap .lens{pointer-events:none}
.mmap .pin{cursor:pointer;outline:none}
.mmap .pin .hit{fill:transparent}
.mmap .pin .ring{fill:none;stroke:#b4404f;stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:mpulse 2.4s ease-out infinite}
.mmap .pin.s-live .ring{stroke:#7b5fd6}
.mmap .pin.s-done .ring,.mmap .pin.s-lock .ring{display:none}
@keyframes mpulse{0%{transform:scale(1);opacity:.85}100%{transform:scale(2.2);opacity:0}}
.mmap .pin .sel{fill:none;stroke:#7a5a1c;stroke-width:2;stroke-dasharray:4 5;transform-box:fill-box;transform-origin:center;opacity:0;transition:opacity .3s}
.mmap .pin.on .sel,.mmap .pin:focus-visible .sel{opacity:1;animation:mspin 16s linear infinite}
@keyframes mspin{to{transform:rotate(360deg)}}
.mmap .pin .mseal{transform-box:fill-box;transform-origin:center;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.mmap .pin:hover .mseal,.mmap .pin.on .mseal{transform:scale(1.14)}
.mmap .pin .wn{fill:#f6e2c4;font:700 14px var(--disp);text-anchor:middle}
.mmap .pin.s-done .wn{fill:#2b1d12}
.mmap .pin.s-lock .wn{fill:#b39b78;opacity:.75}
.mmap .pin .wxi{fill:none;stroke:rgba(0,0,0,.22);stroke-width:2}
.mmap .pin .plab{fill:#2b1d12;font:italic 700 23px var(--serif);paint-order:stroke;stroke:#e9d6ac;stroke-width:6px;stroke-linejoin:round}
.mmap .pin .psub{fill:#5c4630;font:600 9.5px var(--ui);letter-spacing:.16em;paint-order:stroke;stroke:#e9d6ac;stroke-width:5px;stroke-linejoin:round}
.mmap .pin.s-live .psub{fill:#5136a3}
.mmap .pin.s-done .plab{opacity:.72}
.mmap .pin .chk circle{fill:#2b1d12;stroke:#d9b86c;stroke-width:1.5}
.mmap .pin .chk path{fill:none;stroke:#d9b86c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mfo{position:relative;min-height:0;overflow:auto;color:var(--ink);background:radial-gradient(130% 80% at 50% 0%,#f2e4c4,#e4cea0 70%,#d6ba86);border-radius:6px;padding:26px 24px 22px;box-shadow:inset 0 0 50px rgba(100,58,20,.35),0 0 0 1px rgba(217,184,108,.5),0 0 0 6px rgba(18,13,11,.9),0 0 0 7px rgba(217,184,108,.3),0 24px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
.mfob{display:flex;flex-direction:column;gap:14px;animation:krise .45s cubic-bezier(.22,1,.36,1)}
.mfh{display:flex;gap:14px;align-items:center}
.mfo .keb{color:var(--wax)}
.mfo h2{margin:3px 0 0;font:700 24px/1.15 var(--disp);text-wrap:balance}
.mfo .hook{margin:0;font:italic 500 19px/1.4 var(--serif);color:var(--ink2)}
.mfo .hook.blur{filter:blur(4px);opacity:.7;user-select:none}
