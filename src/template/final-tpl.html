<script>
%%DATA%%
const SCENE=`%%SCENE%%`,PORTRAIT=`%%PORTRAIT%%`,IMG_RETRATO="%%IMG_RETRATO%%",IMG_JEFE="%%IMG_JEFE%%";
/* Narración grabada por texto de la mesa (clave de S.nar). Los textos sin audio mantienen el aviso de «próximamente». */
const AUD={start:"%%AUD_START%%"};
let NA=null,NAK="";
function narStop(){if(NA){NA.pause();NA.currentTime=0}UI.au=""}
const $=s=>document.querySelector(s),R=n=>1+Math.floor(Math.random()*n);
const REDUCE=matchMedia("(prefers-reduced-motion:reduce)").matches;
const DN=["Principiante","Intermedio","Experto","Legendario"],PC=[25,50,100,200],TG=[7,9,10,12];
const QN={1:"NO",2:"NE",3:"SE",4:"SO"};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const em=s=>esc(s).replace(/\b(Ambush|Caster|Fast|Fear|Stealth|Villain|Tough|Rending|AP)\b/g,"<i>$1</i>");

/* ---------- estado ---------- */
const KEY="psn-m1-v2";
const S0=()=>({d:3,pts:300,heroes:3,round:0,al:1,wave:0,noEn:false,mk:[0,0,0],prim:false,secRolled:false,sec:0,secDone:false,armed:false,boss:false,end:false,dead:false,defeat:false,nar:"start",needEv:false,alert:"",ch:null,ev:null,hist:[],rolls:{},comp:{},table:[],shown:false,alw:[],alShow:false,manualPrim:false});
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&typeof j==="object"){const o=Object.assign(S0(),j);if(!(o.al>=1))o.al=1;return o}}catch(e){}return S0()}
let S=load(),UI={open:false,sure:false};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- reglas ---------- */
const D=()=>S.d,BUD=()=>Math.round(S.pts*PC[S.d-1]/100);
const nRef=()=>S.wave+((S.alw||[]).length);
const stage=()=>S.boss||nRef()>=2?"Día":nRef()===1?"Alba":"Noche";
/* ---------- ejército enemigo: la lista de Army Forge del jugador ----------
   Cada línea "Nx Nombre [modelos] Qn+ Dn+ | pts | reglas" es una entrada; N copias (1 si no pone nada).
   La línea siguiente son las armas. Se guarda aparte de la partida para que "Nueva partida" no la borre. */
const AKEY="psn-army-v1";
const ARMY_DEF=`++ Goblins - Goblins (v3.6.0), Wood Elves (v3.6.0), Orcs (v3.6.0) [AOFQAI 3185pts] [37 Units] ++

3x Goblins Guerreros epada escudo [3] Q5+ D6+ | 25pts | Mischievous, Tough(3), Strider
Hand Weapon (A3, Parry(1))

2x Goblins Lanceros [3] Q5+ D6+ | 30pts | Mischievous, Tough(3), Strider
Spear (A3, Counter, Brace(1))

4x Huruk lanceros [3] Q5+ D6+ | 35pts | Mischievous, Tough(3), Strider, Instinctive
Spear (A3, Counter, Brace(1))

3x Huruk Guerreros [3] Q5+ D6+ | 30pts | Mischievous, Tough(3), Strider, Instinctive
Hand Weapon (A3, Parry(1))

Goblins Lanceros en Lobo [3] Q5+ D5+ | 50pts | Mischievous, Tough(3), Scout, Strider
Lance (A3, Thrust), Poison Fangs (A3, Shred)

Goblins guerreros en lobo [3] Q5+ D5+ | 45pts | Mischievous, Tough(3), Scout, Strider
Hand Weapon (A3, Parry(1)), Poison Fangs (A3, Shred)

Lider Orco (orco mordor espada) [1] Q5+ D6+ | 95pts | Hero, Tough(9), Ferocious, Defense(1)
Dual Hand Weapons (A12)

3x Goblins arqueros [3] Q5+ D6+ | 50pts | Mischievous, Tough(3), Strider
Shortbow (18", A6), Strike (A3)

Guerrero Orco (guerrero mordor) [1] Q5+ D5+ | 35pts | Ferocious, Tough(3), Dodge
Hand Weapon (A3, Parry(1))

2x Shaman (Orco espada viejo en pose) [1] Q5+ D6+ | 50pts | Caster Group(1), Mischievous, Tough(3), Strider
Shaman Wand (9", A3, Assault, Unstoppable)

Asesino con cabeza en mano [1] Q5+ D6+ | 115pts | Stealth, Good Fighter, Mischievous, Tough(3), Strider, Takedown Strike(3)
Poison Daggers (A9, Shred)

3x Guerreros armas duales [3] Q5+ D6+ | 90pts | Ferocious, Scout, Tough(3)
Sling-Bombs (12", A3, Indirect, Rending, Assault)

3x Arquero orco [3] Q5+ D5+ | 45pts | Ferocious, Tough(3)
Bow (24", A3), Strike (A3)

2x Fanattico (Lancero Mordor) [1] Q5+ D6+ | 95pts | Bounding, Crossing Attack(9), Mischievous, Traversal, Tough(3), Furious
Wrecking Shroom (A3, AP(1), Blast(3))

Pester Swarm (Estandarte) [1] Q5+ D6+ | 100pts | Tough(9), Unpredictable Fighter, Mischievous, Strider
Pester Bombs (12", A3, Blast(3), Assault)

Explorador elfo silvano [1] Q4+ D5+ | 70pts | Scout, Stealth, Strider, Wild Veil, Tough(3)
Bow (24", A3), Strike (A3)

Arqueros con espadas [3] Q5+ D6+ | 55pts | Strider, Ferocious, Tough(3)
Shortbow (18", A6), Strike (A3)

2x Cazador de hierro (arquero mordor) [1] Q5+ D5+ | 115pts | Ferocious, Tough(3)
Killer-Snipebow (36", A3, Reliable, Rending, Takedown), Strike (A3)

Troll Giant [1] Q4+ D4+ | 845pts | Fear(6), Regeneration, Tough(36), Mischievous, Strider
Giant Club (A24, AP(2)), Stomp (A12, AP(1))

Carro de jabalies [1] Q5+ D3+ | 335pts | Fast, Impact(12), Tough(18), Ferocious
Spear Crew (A9, Thrust), Tusks (A6, AP(1))`;
function parseArmy(t){
 const re=/^(?:(\d+)\s*x\s+)?(.+?)\s*\[(\d+)\]\s*Q(\d)\+\s*D(\d)\+\s*\|\s*(\d+)\s*pts?\s*(?:\|\s*(.*))?$/i,out=[],bad=[];let last=null;
 String(t).split(/\r?\n/).forEach(raw=>{const l=raw.trim();if(!l||/^\+\+/.test(l))return;
  const m=l.match(re);
  if(m){last={n:+(m[1]||1),name:m[2].trim(),mod:+m[3],q:+m[4],d:+m[5],pts:+m[6],rules:(m[7]||"").trim(),w:""};out.push(last)}
  else if(last)last.w+=(last.w?" · ":"")+l;else bad.push(l)});
 return{units:out.filter(u=>u.pts>0&&u.n>0),bad};
}
const sig=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h};
let ARMY_TXT=ARMY_DEF;try{ARMY_TXT=localStorage.getItem(AKEY)||ARMY_DEF}catch(e){}
/* Si lo guardado es la lista de ejemplo de antes (todas las unidades con [1]), se cambia por la nueva con las miniaturas reales. */
{const nm=t=>String(t).replace(/\[\d+\]/g,"[n]").replace(/\r/g,"").trim();if(ARMY_TXT!==ARMY_DEF&&nm(ARMY_TXT)===nm(ARMY_DEF)){ARMY_TXT=ARMY_DEF;try{localStorage.setItem(AKEY,ARMY_DEF)}catch(e){}}}
let ARMY=parseArmy(ARMY_TXT).units,ASIG=sig(ARMY_TXT);
if(!ARMY.length){ARMY_TXT=ARMY_DEF;ARMY=parseArmy(ARMY_DEF).units;ASIG=sig(ARMY_DEF)}
function setArmy(t){ARMY_TXT=t;ARMY=parseArmy(t).units;ASIG=sig(t)}
const HER={name:"Heraldo del Umbral",pts:150}; /* jefe de la casa: coste estimado, lo representa la miniatura que elijas */

/* Sorteo de una oleada: unidades al azar de la lista sin pasarse del valor.
   Primero usa copias que no hayan salido en oleadas anteriores; si no queda ninguna que quepa,
   recicla (la unidad solo se usa si ya fue eliminada). Nunca más copias de las que tienes en una misma oleada. */
/* Copias de cada unidad que están ahora mismo en la mesa: las de oleadas anteriores (S.table)
   y las vivas de la oleada en curso (salvo la que se está sorteando, skipK). */
/* Miniaturas por unidad: el [n] de cada línea de Army Forge. "4x Huruk lanceros [3]" son 4 unidades de 3 miniaturas.
   En la lista de ejemplo, Nacho fijó 3 o 1 por unidad (2026-11-17). */
const modsOf=i=>Math.max(1,(ARMY[i]&&ARMY[i].mod)||1);
/* Miniaturas vivas de una unidad sorteada (e.m; sin valor = completa). */
const aliveM=e=>e.d?0:(e.m==null?modsOf(e.i):e.m);
function busy(skipK){
 const b=ARMY.map(()=>0);
 (S.table||[]).forEach(t=>{if(ARMY[t.i]&&t.m>0)b[t.i]++});
 const ck=curW(),c=S.comp[ck];
 if(S.shown&&c&&ck!==skipK&&!c.merged)c.u.forEach(e=>{if(aliveM(e)>0&&ARMY[e.i])b[e.i]++});
 return b;
}
/* Al pasar a la siguiente oleada (o al llegar el jefe), las unidades que siguen vivas pasan a «En mesa» (S.table: una entrada por unidad, con sus miniaturas). */
function mergeWave(k){
 const c=S.comp[k];if(!c||c.merged)return;
 S.table=(S.table||[]).filter(t=>t.m>0&&ARMY[t.i]);
 c.u.forEach(e=>{const m=aliveM(e);if(m>0&&ARMY[e.i])S.table.push({i:e.i,m})});
 S.table.sort((x,y)=>x.i-y.i);c.merged=true;
}
/* Sorteo: solo copias que no estén ya en la mesa (regla de la casa). Si no cabe ninguna, la oleada sale más corta. */
function genComp(k,budget){
 const bz=busy(k),free=ARMY.map((a,i)=>Math.max(0,a.n-bz[i]));
 /* Varios sorteos al azar y se queda el que más se acerca al valor de la oleada sin pasarse
    (un solo sorteo podía quedarse muy corto: p. ej. una unidad de 55 en una oleada de 75 o 150). */
 const once=()=>{const left=free.slice(),u=[];let rem=budget;
  const draw=()=>{const c=[];ARMY.forEach((a,i)=>{if(a.pts<=rem)for(let j=0;j<left[i];j++)c.push(i)});return c.length?c[Math.floor(Math.random()*c.length)]:-1};
  for(let g=0;g<300;g++){const i=draw();if(i<0)break;left[i]--;u.push({i});rem-=ARMY[i].pts}
  return{u,rem}};
 let best=once();
 for(let t=0;t<80&&best.rem>0;t++){const o=once();if(o.rem<best.rem)best=o}
 const u=best.u;
 if(!u.length&&budget>0){let left=free;let i=-1;ARMY.forEach((a,j)=>{if(left[j]>0&&(i<0||a.pts<ARMY[i].pts))i=j});if(i>=0)u.push({i})}
 if(k!=="boss"&&k%2===1&&u.length)u[Math.floor(Math.random()*u.length)].a=true;
 u.sort((x,y)=>x.i-y.i||((x.a?1:0)-(y.a?1:0)));
 return{b:budget,s:ASIG,u};
}
const wGroups=c=>{const g=[];c.u.forEach((e,j)=>{const x=g.find(y=>y.i===e.i&&y.a===!!e.a);if(x)x.j.push(j);else g.push({i:e.i,a:!!e.a,j:[j]})});return g};
function comp(k){
 const b=k==="boss"?Math.max(0,2*BUD()-HER.pts):BUD(),c=S.comp[k];
 if(!c||c.b!==b||c.s!==ASIG||c.u.some(e=>!ARMY[e.i])){S.comp[k]=genComp(k,b);delete S.rolls[k]}
 return S.comp[k];
}
function waveDef(k){
 const B=BUD();
 if(k==="boss")return{name:"Jefe",budget:2*B,p:"c",her:true,c:comp(k),surprise:"Oleada de doble valor y no entran más refuerzos. Las unidades de IA a 12\" usan la Calidad del Heraldo en moral mientras no esté Aturdido."};
 if(k===0)return{name:"Centinelas",budget:B,p:"q",c:comp(0),surprise:"Tira el evento de Neth de la ronda 1."};
 const c=comp(k);
 if(k%2===1)return{name:"Refuerzos "+k,budget:B,p:"c",c,surprise:"La unidad marcada con Ambush entra D3 rondas después, al empezar la ronda, a 6\" o menos de un Objetivo de IA (al azar si hay varios)."+(k>1?" Evento de Neth.":"")};
 const cas=c.u.some(e=>/\bCaster/i.test(ARMY[e.i].rules));
 return{name:"Refuerzos "+k,budget:B,p:"c",c,surprise:(cas?"Mientras la unidad con Caster no esté Aturdida, las unidades enemigas a 6\" de ella ganan +1 a impactar en cuerpo a cuerpo. ":"")+"Evento de Neth."};
}
const curW=()=>S.boss?"boss":S.wave;
const PLACE={q:"Centro de un cuadrante. Un dado por unidad.",c:"A 6\" o menos de una esquina. Un dado por unidad.",a:"D3 rondas después, a 6\" de un Objetivo de IA (al azar si hay varios)."};
function rollPos(){
 const k=curW(),w=waveDef(k);
 S.rolls[k]={u:w.c.u.map(e=>{if(e.a){const d3=R(3);return{t:"a",d:d3,at:S.round+d3}}return{t:w.p,d:R(6)}}),h:w.her?{t:"c",d:R(6)}:null};
}
function posLabel(r){
 if(r.t==="a")return"Ronda "+r.at+" · D3="+r.d;
 const what=r.t==="q"?"Cuadrante ":"Esquina ";
 return r.d<=4?what+r.d+" ("+QN[r.d]+")":"A tu elección ("+r.d+")";
}
function neth(n){const e=DATA.ev.find(x=>x[0]===String(n));return e}
function evExtra(txt){const x=[];if(/héroe al azar/i.test(txt))x.push("Héroe nº "+R(S.heroes)+" de "+S.heroes);if(/cuadrante al azar/i.test(txt))x.push("Cuadrante "+R(4));if(/D3/.test(txt))x.push("D3 = "+R(3));return x.join(" · ")}
const PEL=[[1,1,"Afligido","Al activarse debe superar Fuerza para quitárselo; si falla, recibe 1 herida."],[2,2,"Enfermo","Al activarse debe superar Voluntad para quitárselo; recibe tantas heridas como poder gaste."],[3,3,"Afectado","Puede gastar D3 de poder para quitárselo; mientras tanto tiene -1 a todas las tiradas de característica."],[4,4,"Debilitado","Al activarse debe superar Destreza para quitárselo; mientras tanto mueve la mitad."],[5,6,"Ninguno","El aire huele a ceniza, y nada más."]];
const ELX=[[1,3,"Elixir heroico","El héroe tiene +1 a impactar hasta el final de la ronda."],[4,5,"Elixir de conquista","El héroe tiene +1 a Fuerza, Destreza y Voluntad hasta el final de la ronda."],[6,6,"Elixir de poder","El héroe restaura D3+3 de poder."]];
const BMB=[[1,3,"Bomba de ruido","Las unidades enemigas a 3\" del punto ignoran a los héroes en su siguiente activación y corren hacia él."],[4,5,"Bomba de grasa","Un círculo de 3\" cuenta como terreno difícil hasta el final de la siguiente ronda."],[6,6,"Bomba aturdidora","Una unidad enemiga a 3\" del punto queda Aturdida (si no tiene resistencia 9+)."]];
const POC=[[1,3,"Poción de curación","Un héroe a 1\" se quita todos sus estados."],[4,5,"Poción de teletransporte","El héroe se coloca a 6\" o menos de la esquina que elija."],[6,6,"Poción de salud","Un héroe a 1\" restaura 3 heridas."]];
const pick=(t,d)=>t.find(r=>d>=r[0]&&d<=r[1]);
const CHEST=[[1,2,"Peligro","Un cofre que nunca tuvo dueño. Se desvanece al tocarlo y deja algo en el aire."],[3,3,"Bolsa de elixires","Frascos que alguien olvidó beber."],[4,4,"Bolsa de bombas","Esferas de arcilla con la etiqueta borrada."],[5,5,"Caja de pociones","Pociones en fila, cada una con un nombre que ya nadie recuerda."],[6,6,"Tesoro maldito","Monedas frías que pesan más de lo que deberían."]];
function rollChest(A,B){
 const a=A||R(6),c=pick(CHEST,a);let b=0,t="ok",title=c[2],text=c[3],x="";
 if(a<=2){b=B||R(6);const p=pick(PEL,b);title="Peligro · "+p[2];text=p[3]+" El cofre desaparece; solo afecta a un héroe a 1\".";t="bad"}
 else if(a===3){b=B||R(6);const p=pick(ELX,b);title=p[2];text=p[3]}
 else if(a===4){b=B||R(6);const p=pick(BMB,b);title=p[2];text=p[3]+" Se lanza como acción a 12\"."}
 else if(a===5){b=B||R(6);const p=pick(POC,b);title=p[2];text=p[3]}
 else{t="bad";title="Tesoro maldito";text="Los héroes obtienen "+5*S.d+" de oro y surge un Borrado débil junto al héroe que abrió el cofre."}
 return{a,b,t,title,text,x}
}
function setEv(x,y){const n=x*10+y,e2=neth(n);S.ev={n,t:e2[1],x:e2[2],tone:n<40?"bad":"ok",extra:evExtra(e2[2])};S.needEv=false;hist("Evento",n+" "+e2[1])}
function setCh(x,y){S.ch=rollChest(x,y);hist("Cofre",S.ch.a+(S.ch.b?"/"+S.ch.b:"")+" "+S.ch.title)}
const dsel=(id,l)=>`<label class="dl"><small>${l}</small><select id="${id}" class="dsel" data-f="${id}"><option value="">–</option>${[1,2,3,4,5,6].map(n=>`<option>${n}</option>`).join("")}</select></label>`;
function hist(k,t){S.hist.unshift(k+" "+t);S.hist=S.hist.slice(0,6)}

/* ---------- acciones ---------- */
function setNar(k){S.nar=k}
function reinforce(){
 if(S.shown)mergeWave(S.wave);
 S.shown=true;S.wave++;S.needEv=true;
 setNar(S.wave%2===1?"w1":"w2");
 S.alert="Entra la oleada "+(S.wave+1)+". Despliégala y tira un evento de Neth.";
}
/* Sube la Alertness. Al llegar a 6 entran refuerzos y lo que sobra pasa a la nueva cuenta
   (la cuenta va de 1 a 6 como un dado; al llegar a 6 entran refuerzos y vuelve siempre a 1, aunque sobre algo: regla de la casa para dar un respiro). Devuelve true si entraron refuerzos. */
/* Refuerzos por Alertness 6 (regla de la casa: separados de "Oleada actual"). Se sortean con la lista y se guardan en S.alw. */
function alertWave(){
 S.alw.push({c:genComp("al",BUD()),r:null,round:S.round});
 S.alShow=true;S.needEv=true;S.noEn=false;
 setNar(S.alw.length%2===1?"w1":"w2");
 S.alert="La Alertness llega a 6: entran refuerzos ("+S.alw.length+"). Los tienes en «Nivel de alerta». Despliégalos y tira un evento de Neth.";
}
function addAl(n){
 S.al+=n;
 if(S.boss){S.al=Math.min(5,S.al);return false}
 if(S.al>=6){alertWave();S.al=1;return true}
 return false;
}
function endRound(){
 S.alert="";
 if(S.armed&&!S.boss){if(S.shown)mergeWave(S.wave);S.shown=true;S.boss=true;S.armed=false;S.round++;setNar("boss");S.needEv=false;S.alert="Llega la pelea de jefe: el Heraldo y su oleada de doble valor. No entran más refuerzos.";return}
 const add=S.noEn?0:1;S.noEn=false; /* si se marcó Sin enemigos, el +2 ya se sumó */
 S.round++;
 if(S.boss)return;
 /* La narración va un paso por detrás de la ronda: la ronda 1 lee «Antes de empezar», la 2 lee «Ronda 1», etc. (decisión de Nacho, 2026-11-17). */
 if(!addAl(add)&&S.round>=2&&S.round<=4)setNar("r"+(S.round-1));
}
/* Secundario: se prepara con su botón una vez cumplido el principal. d6 en la tabla y +3 de Alertness. */
function prepSec(v){
 if(!S.prim||S.secRolled)return;
 S.secRolled=true;S.sec=v||R(6);setNar("sec");
 if(addAl(3)){S.alert="Objetivo secundario: "+DATA.sec[S.sec-1][0]+". La Alertness sube 3 y llega a 6: entran refuerzos (en «Nivel de alerta»). Despliégalos y tira un evento de Neth."}
 else S.alert="Objetivo secundario: "+DATA.sec[S.sec-1][0]+". La Alertness sube 3.";
 hist("Secundario",S.sec+" "+DATA.sec[S.sec-1][0]);
}
/* Al empezar se muestra «Antes de empezar» (con su audio); el texto avanza con «Avanzar ronda». Sin aviso al empezar. */
function startGame(){S.round=1;S.needEv=true;setNar("start");S.alert=""}
/* Reiniciar: partida nueva con la misma dificultad, puntos y héroes, ya empezada (sin volver a la pantalla de configuración). */
function restartGame(){const{d,pts,heroes}=S;narStop();S=Object.assign(S0(),{d,pts,heroes});startGame()}
function setMk(i){S.mk[i]=S.mk[i]?0:1;if(S.mk.every(Boolean)&&!S.prim){S.prim=true;setNar("pri")}else if(!S.mk.every(Boolean)&&S.prim&&!S.manualPrim)S.prim=false}
const ACT={
 d:v=>{if(!S.round)S.d=+v},
 pts:v=>{if(!S.round)S.pts=Math.min(3000,Math.max(50,S.pts+ +v))},
 heroes:v=>{if(!S.round)S.heroes=Math.min(4,Math.max(2,S.heroes+ +v))},
 start:()=>startGame(),
 restart:()=>{if(!UI.sureR){UI.sureR=true;UI.sure=false;setTimeout(()=>{UI.sureR=false;render()},3500);return}UI.sureR=false;restartGame()},
 end:()=>endRound(),
 alAdj:v=>{v=+v;if(v<0){S.al=Math.max(1,S.al+v);return}
  if(addAl(v)&&S.round){S.round++;S.alw[S.alw.length-1].round=S.round;S.alert="La Alertness llega a 6: pasáis a la ronda "+S.round+" y entran refuerzos (en «Nivel de alerta»). Despliégalos y tira un evento de Neth."}},
 /* Sin enemigos en mesa: suma +2 al momento (en lugar del +1 de fin de ronda). Desmarcar lo deshace. */
 noEn:()=>{if(S.noEn){S.noEn=false;S.al=Math.max(1,S.al-2);return}
  S.noEn=true;if(addAl(2)&&S.round){S.round++;S.alw[S.alw.length-1].round=S.round;S.alert="Sin enemigos en mesa: la Alertness llega a 6, pasáis a la ronda "+S.round+" y entran refuerzos (en «Nivel de alerta»). Despliégalos y tira un evento de Neth."}},
 mk:v=>setMk(+v),
 secDone:()=>{S.secDone=!S.secDone},
 endc:()=>{if(S.prim||S.end)S.end=!S.end},
 play:()=>{const k=S.nar;
  if(AUD[k]){if(!NA||NAK!==k){if(NA)NA.pause();NA=new Audio(AUD[k]);NAK=k;NA.onended=()=>{NA.currentTime=0;UI.au="";render()}}
   UI.au="play";NA.play().catch(()=>{UI.au="";render()});return}
  UI.soon=true;clearTimeout(UI.soonT);UI.soonT=setTimeout(()=>{UI.soon=false;render()},3500)},
 pause:()=>{if(NA)NA.pause();if(UI.au)UI.au="pause"},
 stop:()=>narStop(),
 arm:()=>{S.armed=true},
 dead:()=>{S.dead=!S.dead},
 defeat:()=>{S.defeat=!S.defeat},
 first:()=>{S.shown=true},
 next:()=>{if(!S.boss)reinforce()},
 pos:()=>rollPos(),
 alPos:()=>{const w=S.alw[S.alw.length-1];if(w)w.r=w.c.u.map(()=>({t:"c",d:R(6)}))},
 alHide:()=>{S.alShow=false},
 alHist:()=>{UI.alHist=!UI.alHist},
 reroll:()=>{const k=curW();delete S.comp[k];delete S.rolls[k]},
 /* Miniaturas en mesa de una unidad: "t|i|n" (S.table[i]) o "w|j|n" (entrada j de la oleada en curso). n=0 la elimina del tablero. */
 cnt:v=>{const[k,ix,m]=String(v).split("|"),n=Math.max(0,+m||0);
  if(k==="t"){const t=(S.table||[])[+ix];if(t)t.m=Math.min(modsOf(t.i),n);return}
  const c=S.comp[curW()];if(!c||c.merged)return;const e=c.u[+ix];if(e){delete e.d;e.m=Math.min(modsOf(e.i),n)}},
 wTog:()=>{S.wMin=!S.wMin},
 herT:()=>{UI.her=!UI.her},
 armyT:()=>{UI.army=!UI.army;UI.armyMsg=""},
 armySave:()=>{if(S.round)return;const el=$("#armyTxt");if(!el)return;const t=el.value,p=parseArmy(t);if(!p.units.length){UI.armyMsg="No he reconocido ninguna unidad. Cada una necesita una línea como: 3x Nombre [1] Q5+ D6+ | 25pts | reglas";return}try{localStorage.setItem(AKEY,t)}catch(e){}setArmy(t);UI.armyMsg="Lista cargada: "+p.units.length+" entradas."+(p.bad.length?" Se ignoraron "+p.bad.length+" líneas que no entendí.":"")+" Las oleadas se vuelven a sortear."},
 armyDef:()=>{if(S.round)return;try{localStorage.removeItem(AKEY)}catch(e){}setArmy(ARMY_DEF);UI.armyMsg="Lista de ejemplo restaurada."},
 ok:()=>{S.alert=""},
 reset:()=>{if(!UI.sure){UI.sure=true;UI.sureR=false;setTimeout(()=>{UI.sure=false;render()},3500);return}narStop();S=S0();UI.sure=false;try{localStorage.removeItem(KEY)}catch(e){}}
};
function tumble(kind,done){
 const el=document.getElementById("die-"+kind);
 if(REDUCE||!el){done();return}
 let n=0;const iv=setInterval(()=>{el.textContent=kind==="EV"?R(6)+""+R(6):R(6);if(++n>9){clearInterval(iv);done()}},55);
}
document.addEventListener("click",e=>{
 const n=e.target.closest("[data-nav]");
 if(n){e.preventDefault();NAV(n.dataset.nav);return}
 const b=e.target.closest("[data-a]");
 if(!b)return;
 const a=b.dataset.a,v=b.dataset.v;
 if(evLock()&&!EV_OK.has(a)&&$("#panel").contains(b)){e.preventDefault();return}
 if(a==="SECm"){if(!S.prim||S.secRolled)return;const x=+$("#secA").value;if(!x){UI.secMsg="Elige el resultado del dado.";render();return}UI.secMsg="";prepSec(x);save();render();return}
 if(a==="SEC"){if(!S.prim||S.secRolled)return;tumble("SEC",()=>{prepSec();save();render()});return}
 if(a==="CH"){UI.chMsg="";tumble("CH",()=>{setCh();save();render()});return}
 if(a==="EV"){UI.evMsg="";tumble("EV",()=>{setEv(R(6),R(6));save();render()});return}
 if(a==="EVm"){const x=+$("#evA").value,y=+$("#evB").value;if(!x||!y){UI.evMsg="Elige los dos dados: primero las decenas y luego las unidades.";render();return}UI.evMsg="";setEv(x,y);save();render();return}
 if(a==="CHm"){const x=+$("#chA").value,y=+$("#chB").value;if(!x){UI.chMsg="Elige el dado del contenido.";render();return}if(x<=5&&!y){UI.chMsg="Con "+x+" en el contenido hace falta el segundo dado (el objeto o el peligro).";render();return}UI.chMsg="";setCh(x,x<=5?y:0);save();render();return}
 if(ACT[a])ACT[a](v);
 save();render();
 /* Al minimizar «Oleadas» con la tarjeta ya desplazada, vuelve a su cabecera para no quedarse en mitad del panel. */
 if(a==="wTog"){const c=$("#wcard"),pb=$("#pbody");if(c&&c.getBoundingClientRect().top<pb.getBoundingClientRect().top)c.scrollIntoView({block:"start"})}
});

/* ---------- vistas: selector de misiones, pergamino y mesa ---------- */
let VIEW="camp",misY=0,swapT=0;
const VW={camp:"#camp",home:"#home",m1:"#mis"};
function swapView(from,to,after){
 clearTimeout(swapT);
 const go=()=>{from.hidden=true;from.classList.remove("leave","enter");to.hidden=false;to.classList.remove("leave");to.classList.add("enter");after&&after()};
 if(REDUCE){go();return}
 from.classList.remove("enter");from.classList.add("leave");swapT=setTimeout(go,230);
}
function toTop(y){window.scrollTo({top:y,left:0,behavior:"instant"})}
function openMesa(){
 const p=$("#panel");if(p.classList.contains("open"))return;
 p.inert=false;$("#mis").inert=true;document.documentElement.classList.add("lock");
 p.classList.add("open","intro");$("#fab").setAttribute("aria-expanded","true");
 setTimeout(()=>p.classList.remove("intro"),1200);
 requestAnimationFrame(()=>$("#px").focus({preventScroll:true}));
}
function closeMesa(){
 const p=$("#panel");if(!p.classList.contains("open"))return;
 if(UI.au){narStop();render()}
 p.classList.remove("open","intro");$("#mis").inert=false;document.documentElement.classList.remove("lock");
 $("#fab").setAttribute("aria-expanded","false");$("#fab").focus({preventScroll:true});
 setTimeout(()=>{if(!p.classList.contains("open"))p.inert=true},REDUCE?0:640);
}
function NAV(t){
 if(t==="open")return openMesa();
 if(t==="close")return closeMesa();
 if(!VW[t]||t===VIEW)return;
 const from=$(VW[VIEW]),to=$(VW[t]);
 if(VIEW==="m1"){closeMesa();misY=window.scrollY}
 VIEW=t;
 if(t==="home")HOME.map();else if(t==="camp")HOME.camp();
 swapView(from,to,()=>{if(t==="m1"){tocOv();toTop(misY);$("#mis .back").focus({preventScroll:true})}else{toTop(0);if(t==="home")HOME.mapAfter();else HOME.focusCamp()}});
}
function tocOv(){const t=$("#toc");t.classList.toggle("ov",t.scrollWidth>t.clientWidth+2)}
addEventListener("resize",tocOv);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#panel").classList.contains("open")){e.preventDefault();closeMesa()}});
let COLS=0;const MQ3=matchMedia("(min-width:1280px)"),MQ2=matchMedia("(min-width:760px)");
const colsNow=()=>MQ3.matches?3:MQ2.matches?2:1;
[MQ3,MQ2].forEach(m=>{const f=()=>{if(colsNow()!==COLS)render()};m.addEventListener?m.addEventListener("change",f):m.addListener(f)});

/* ---------- panel ---------- */
function gauge(){
 const cx=125,cy=118,r=92;let p="";
 for(let i=0;i<6;i++){const a0=(180-i*30-2)*Math.PI/180,a1=(180-(i+1)*30+2)*Math.PI/180;
  const x0=cx+r*Math.cos(a0),y0=cy-r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy-r*Math.sin(a1);
  p+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${i<S.al?(S.al>=5?"#d9b86c":"#a78bfa"):"#2a2340"}" stroke-width="16" stroke-linecap="round"/>`}
 return`<svg class="gauge" viewBox="0 0 250 132" role="img" aria-label="Alertness ${S.al} de 6">${p}<text x="125" y="108" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="46" fill="#ece7f5">${S.al}</text><text x="125" y="127" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#a59fba">de 6 · a 6 entran refuerzos</text></svg>`;
}
function prof(a){return"Q"+a.q+"+ D"+a.d+"+"+(a.rules?" · "+a.rules:"")+(a.w?" · "+a.w:"")}
function unitRow(q,name,sub,place,rs,tags,extra,cls){
 const chips=rs.map(r=>`<i class="${r.d>4&&r.t!=="a"?"ch":""}">${esc(posLabel(r))}</i>`).join("");
 return`<div class="un ${cls||""}"><div class="q">${q}</div><div><b>${esc(name)}</b>${tags?` <span class="tgs">${tags}</span>`:""}<small>${em(sub)}</small>${place?`<small>${esc(place)}</small>`:""}${chips?`<div class="chipsr">${chips}</div>`:""}${extra||""}</div></div>`;
}
/* Pestaña de cada unidad: cuántas miniaturas siguen en la mesa (de t a 1) o eliminarla del tablero. */
function cntTab(kind,ix,n,t,lb){
 if(!n)return`<div class="cnt off"><span>${lb} · eliminada del tablero</span><button class="pb sm gh" data-a="cnt" data-v="${kind}|${ix}|${t}" data-f="c${kind}${ix}u">Deshacer</button></div>`;
 let s="";for(let m=t;m>=1;m--)s+=`<button type="button" class="${m===n?"on":""}" data-a="cnt" data-v="${kind}|${ix}|${m}" data-f="c${kind}${ix}_${m}" aria-pressed="${m===n}" aria-label="${lb}: ${m} ${m===1?"miniatura":"miniaturas"} en mesa">${m}</button>`;
 return`<div class="cnt"><span>${lb}</span><div class="segs" role="group" aria-label="${lb}: miniaturas en mesa">${s}</div><button type="button" class="rm" data-a="cnt" data-v="${kind}|${ix}|0" data-f="c${kind}${ix}x">Eliminar del tablero</button></div>`;
}
/* Fila de una unidad del ejército con una pestaña por cada unidad sorteada (copias = [{kind,ix,m}]). */
function armyRow(i,copies,place,rs,tags){
 const a=ARMY[i],t=modsOf(i),live=copies.filter(c=>c.m>0).length;
 const tabs=copies.map((c,q)=>cntTab(c.kind,c.ix,c.m,t,copies.length>1?"Unidad "+(q+1):"Miniaturas")).join("");
 return unitRow(live,a.name,prof(a)+" · "+a.pts+" pts c/u · "+t+(t===1?" miniatura por unidad":" miniaturas por unidad"),place,rs,tags,`<div class="cnts">${tabs}</div>`,live?"":"gone");
}
/* Recuadro fijo del jefe: aparece al activar la pelea de jefe y se queda arriba de «Oleadas». */
function bossBox(){
 if(!S.armed&&!S.boss)return"";
 return`<div class="hbx"><img src="${IMG_JEFE}" alt="" width="64" height="81"><div><p class="hbt">${S.boss?"Jefe en la mesa":"Llega al final de esta ronda"}</p><b>${HER.name}</b><div class="chipsr"><i>Calidad 3+</i><i>Defensa 3+</i><i class="ch">Tough(${TG[S.d-1]})</i><i>Fear(3)</i><i>Caster(3)</i></div><button class="linkb" type="button" data-a="herT" data-f="herT" aria-expanded="${!!UI.her}">${UI.her?"Ocultar la ficha":"Ver la ficha completa"}</button></div></div>${UI.her?herFicha():""}`;
}
/* Ficha del Heraldo: solo se ve en la mesa cuando entra en juego (en el pergamino está oculta). */
function herFicha(){
 return`<div class="hfi"><figure class="hfimg"><img src="${IMG_JEFE}" width="640" height="808" alt="El Heraldo del Umbral se alza sobre los tejados del pueblo, con la hoz vertical en la mano"></figure><h4>Ficha del Heraldo · estadísticas de la casa</h4><div class="chipsr"><i>Calidad 3+</i><i>Defensa 3+</i><i class="ch">Tough(${TG[S.d-1]})</i><i>Fear(3)</i><i>Caster(3)</i></div>
 <p><b>Reglas especiales:</b> <i>Villain</i>, <i>Fear</i>(3), <i>Stealth</i>, <i>Tough</i>(${TG[S.d-1]}), <i>Caster</i>(3). Con <i>Villain</i>, las unidades de IA a 12" usan su Calidad en moral si es mejor, mientras no esté Aturdido.</p>
 <p><b>Hoz del vacío</b> (cuerpo a cuerpo): 4 ataques, AP(2), <i>Rending</i>.</p>
 <ul><li><b>Olvido · 1</b>Un héroe a 12" pasa una tirada de Wil o pierde su siguiente acción de habilidad.</li><li><b>Borrado · 2</b>Un héroe a 12" recibe 3 impactos con AP(1).</li><li><b>Silencio · 3</b>Todos los héroes a 9" pasan una tirada de Wil o pierden D3 de poder.</li></ul>
 <p><b>Cómo actúa:</b> gana 3 fichas de hechizo al empezar cada ronda, elige un hechizo al azar y gasta todas sus fichas al activarse. Con 4+ surte efecto sobre un objetivo en línea de visión. Un héroe con <i>Caster</i> a 18" puede gastar fichas para restarle -1 por ficha. Con <i>Tough</i>(9) o más no queda Aturdido, y cada moral fallido le causa D3 heridas.</p>
 <p><b>Punto débil:</b> los ataques del héroe que lleve el diario del olvidado contra el Heraldo ganan AP(1).</p></div>`;
}
function waveCard(){
 if(!S.shown&&!S.boss&&S.wave===0)return`<section class="pc"><h3><span class="tt">Oleadas</span></h3>${bossBox()}<p style="margin:0 0 12px;font-size:12.5px;line-height:1.5;color:var(--pmu)">Todavía no hay enemigos en la mesa. Elige antes la dificultad, los puntos de los héroes y tu ejército, y pulsa el botón para generar la primera oleada.</p><div class="cwrap"><button class="pb pr big" data-a="first" data-f="first">Primera oleada</button></div></section>`;
 const k=curW(),w=waveDef(k),ro=S.rolls[k]&&!Array.isArray(S.rolls[k])?S.rolls[k]:null,g=wGroups(w.c);
 /* En mesa: lo que sigue vivo de oleadas anteriores, agrupado por unidad. */
 const T=(S.table||[]).map((t,ix)=>({t,ix})).filter(o=>ARMY[o.t.i]&&o.t.m!=null);
 let old="";
 if(T.length){const n=T.filter(o=>o.t.m>0).length,G=[];
  T.forEach(o=>{const x=G.find(y=>y.i===o.t.i);const c={kind:"t",ix:o.ix,m:o.t.m};if(x)x.c.push(c);else G.push({i:o.t.i,c:[c]})});
  old=`<p class="grp">En mesa · oleadas anteriores<span>${n} ${n===1?"unidad":"unidades"}</span></p>`+G.map(x=>armyRow(x.i,x.c,"",[],"")).join("")}
 /* Recién llegadas: la oleada en curso, una pestaña por unidad sorteada. */
 let h="";
 if(w.her)h+=unitRow(1,HER.name,"Q3+ D3+ · Villain, Fear(3), Stealth, Caster(3), Tough("+TG[S.d-1]+") · "+HER.pts+" pts (estimado)",PLACE.c,ro&&ro.h?[ro.h]:[],"");
 g.forEach(x=>{h+=armyRow(x.i,x.j.map(j=>({kind:"w",ix:j,m:aliveM(w.c.u[j])})),PLACE[x.a?"a":w.p],ro?x.j.map(j=>ro.u[j]).filter(Boolean):[],x.a?`<i class="tg">Ambush</i>`:"")});
 if(!ARMY.length)h=`<p style="margin:6px 0;font-size:12.5px;color:var(--pbad)">No hay unidades en tu lista. Pégala en «Ejército enemigo».</p>`;
 else if(!g.length)h+=`<p style="margin:6px 0;font-size:12.5px;line-height:1.5;color:var(--pbad)">No quedan copias libres que quepan en esta oleada. Elimina del tablero las unidades que hayan caído y pulsa «Otra composición».</p>`;
 const tot=w.c.u.reduce((s,e)=>s+ARMY[e.i].pts,0)+(w.her?HER.pts:0),n=w.c.u.length+(w.her?1:0);
 const lbl=k==="boss"?"Oleada del jefe":k===0?"Centinelas":"Refuerzos "+k;
 /* Unidades vivas en mesa (anteriores + recién llegadas) para el resumen y el botón de minimizar. */
 const onT=T.filter(o=>o.t.m>0).length+w.c.u.filter(e=>aliveM(e)>0).length+(w.her&&!S.dead?1:0);
 const sum=`${onT} ${onT===1?"unidad":"unidades"} en mesa`;
 const body=S.wMin?`<p class="wsum">Última oleada: ${lbl}. Pulsa «Mostrar oleadas» para ver las unidades.</p>`:`<p style="margin:0 0 6px;font-size:12.5px;color:var(--pmu)">Valor de la última oleada: <b style="color:var(--pink)">${w.budget} pts</b> (${k==="boss"?"el doble de ":""}${PC[S.d-1]}% de ${S.pts}). Sorteadas: <b style="color:var(--pink)">${n} unidades · ${tot} pts</b>.</p>${old}<p class="grp new">${T.length?"Recién llegadas · ":""}${lbl}<span>${n} ${n===1?"unidad":"unidades"}</span></p>${h}<p style="margin:8px 0 10px;font-size:12.5px;line-height:1.5;color:var(--pmu)">${em(w.surprise)}</p>`;
 /* Botón para minimizar/mostrar: va al final de la tarjeta y, si la tarjeta es más alta que la pantalla, se queda pegado abajo (sticky). */

 const G=16,hOf=c=>[...c.children].reduce((s,n)=>s+n.offsetHeight,0)+G*Math.max(0,c.children.length-1);

 const order=["round","al","wave","obj","dice"],el={};pb.querySelectorAll(".mc").forEach(n=>el[n.dataset.k]=n);

 order.forEach(k=>{if(!el[k])return;let j=0;H.forEach((h,i)=>{if(h<H[j]-1)j=i});L[j].push(k);H[j]+=el[k].offsetHeight+G});

}

function hfSplit(s){const out=[];let d=0,b="";for(const ch of s){if(ch==="(")d++;else if(ch===")")d=Math.max(0,d-1);if(ch===","&&!d){if(b.trim())out.push(b.trim());b=""}else b+=ch}if(b.trim())out.push(b.trim());return out}
/* Lee la exportación de héroe de Army Forge (AoF: Quest):
   ++ Nombre - Profesión (Raza) [AOFQ 285pts] [Lvl 4] ++
   Nombre | Qua 3+ Def 6+ Tou 18 Pow 4 | Str 3+ Dex 6+ Wil 6+ | 285pts | 9XP | reglas
   armas · Consumables: 2x Health Potion · Skills: a, b */
function hfParse(t){
 const lines=String(t).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
 const reQ=/^(.+?)\s*\|\s*Qua\s*(\d)\+\s*Def\s*(\d)\+\s*(?:Tou\s*(\d+))?\s*(?:Pow\s*(\d+))?\s*\|\s*Str\s*(\d)\+\s*Dex\s*(\d)\+\s*Wil\s*(\d)\+\s*\|\s*(\d+)\s*pts?\s*(?:\|\s*(\d+)\s*XP)?\s*(?:\|\s*(.*))?$/i;
 const r={prof:"",raza:"",nivel:null,rules:[],weap:[],cons:[],skills:[],pot:null};let u=false;
 for(const l of lines){
  if(/^\+\+/.test(l)){const s=l.replace(/^\+\+\s*|\s*\+\+$/g,""),lv=s.match(/\[Lvl\s*(\d+)\]/i),body=s.replace(/\[.*?\]/g,"").replace(/\(v[\d.]+\)/g,"").trim(),m=body.match(/^(.+?)\s+-\s+(.+?)(?:\s*\((.+?)\))?\s*$/);
   if(lv)r.nivel=+lv[1];if(m){r.hname=m[1].trim();r.prof=m[2].trim();r.raza=(m[3]||"").trim()}continue}
  let m=l.match(reQ);
  if(m&&!u){u=true;Object.assign(r,{name:m[1].trim(),cal:+m[2],def:+m[3],hpMax:m[4]?+m[4]:null,pwMax:m[5]!=null?+m[5]:null,fue:+m[6],des:+m[7],vol:+m[8],pts:+m[9],afxp:m[10]?+m[10]:null});r.rules=hfSplit(m[11]||"");continue}
  if(!u)continue;
  if((m=l.match(/^Consumables?:\s*(.*)$/i))){for(const x of hfSplit(m[1])){const c=x.match(/^(\d+)\s*x\s+(.+)$/i),n=c?+c[1]:1,nm=(c?c[2]:x).trim();if(/health\s*potion|poci[oó]n de salud/i.test(nm))r.pot=(r.pot||0)+n;else r.cons.push({n:nm,q:n})}continue}
  if((m=l.match(/^Skills?:\s*(.*)$/i))){r.skills.push(...hfSplit(m[1]));continue}
  r.weap.push(...hfSplit(l).map(x=>{const w=x.match(/^(.+?)\s*\((.*)\)$/);return w?{n:w[1].trim(),k:w[2].trim()}:{n:x,k:""}}));
 }
 if(!u)return{err:"No encuentro la línea del héroe. En Army Forge se ve así: Nombre | Qua 3+ Def 6+ Tou 18 Pow 4 | Str 3+ Dex 6+ Wil 6+ | 285pts | …"};
 return r;
}
function hfClamp(h){h.hpMax=Math.max(1,+h.hpMax||1);h.pwMax=Math.max(0,+h.pwMax||0);h.hp=Math.min(Math.max(0,+h.hp||0),h.hpMax);h.pw=Math.min(Math.max(0,+h.pw||0),h.pwMax);h.pot=Math.max(0,+h.pot||0);h.gold=Math.max(0,+h.gold||0);h.nivel=Math.max(1,+h.nivel||1)}
/* Copia lo leído a la ficha. No toca el oro ni los estados; la XP de Army Forge no se usa (la de la campaña empieza en 0). Tough(n) ya son las heridas: no se repite en Reglas. */
function hfApply(h,r){
 h.name=r.name||r.hname||h.name;h.cal=r.cal;h.def=r.def;if(r.prof)h.prof=r.prof;if(r.raza)h.raza=r.raza;if(r.nivel)h.nivel=r.nivel;if(r.pts)h.pts=r.pts;
 if(r.fue)h.fue=r.fue;if(r.des)h.des=r.des;if(r.vol)h.vol=r.vol;
 if(r.hpMax){const full=h.hp===h.hpMax;h.hpMax=r.hpMax;if(full||h.hp>r.hpMax)h.hp=r.hpMax}
 if(r.pwMax!=null){const full=h.pw===h.pwMax;h.pwMax=r.pwMax;if(full||h.pw>r.pwMax)h.pw=r.pwMax}
 if(r.pot!=null)h.pot=r.pot;
 h.sk=r.rules.filter(x=>!/^Tough\(\d+\)$/i.test(x)).map(x=>({g:"regla",n:x,k:"",d:""}))
  .concat(r.skills.map(x=>({g:"hab",n:x,k:"",d:""})),r.weap.map(x=>({g:"equipo",n:x.n,k:x.k,d:""})),r.cons.map(x=>({g:"equipo",n:(x.q>1?x.q+"× ":"")+x.n,k:"Consumible",d:""})));
 hfClamp(h);
}

 return `<mask id="${id}" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1400" height="1200"><g filter="url(#blot)"><rect x="-200" y="-200" width="1400" height="1200" fill="${W}"/><rect class="fogr" x="-200" y="-1500" width="1400" height="1500" fill="${B}" style="transform:translateY(${from}px)"/>${rv}<circle cx="590" cy="106" r="165" fill="${B}"/></g></mask>`}
function mapSVG(){
 const sts=MIS.map((_,i)=>mst(i)),far=sts.reduce((a,s,i)=>s!=="lock"?i:a,0),fogY=FOGY[far],from=seen?seen.y:fogY;
 let legs="";for(let k=0;k<6;k++)legs+=`<path class="${sts[k]!=="lock"?"rt-on":"rt-off"}" d="${legD(k)}"/>`;
 const LB=[[34,1],[34,1],[-34,-1],[34,1],[-34,-1],[34,1]];
 let pins="";P.forEach((p,i)=>{const st=sts[i],m=MIS[i],R=rng(30+i),lb=LB[i],anc=lb[1]>0?"start":"end";
  const fill=st==="live"?"url(#wxV)":st==="done"?"url(#wxG)":st==="lock"?"url(#wxL)":"url(#wxR)";
  pins+=`<g class="pin s-${st}${M.sel===i?" on":""}" data-mi="${i}" tabindex="0" role="button" aria-label="Misión ${m.n}, ${m.t}: ${stl(i)}" transform="translate(${p[0]} ${p[1]})"><circle class="hit" r="46"/><circle class="ring" r="21"/><circle class="sel" r="34"/><g class="mseal"><path d="${blob(22,14,R,1.8)}" fill="${fill}" stroke="rgba(0,0,0,.25)"/><circle class="wxi" r="15"/><text class="wn" y="5">${m.n}</text></g>${st==="done"?`<g class="chk" transform="translate(18 -18)"><circle r="9"/><path d="M-4 0l3 3 5-6"/></g>`:""}${st!=="lock"?`<text class="plab" x="${lb[0]}" y="2" text-anchor="${anc}">${m.t}</text><text class="psub" x="${lb[0]}" y="20" text-anchor="${anc}">${SHORT[st].toUpperCase()}${st==="live"?` · RONDA ${S.round}`:""}</text>`:""}</g>`});
 const fy=fogY-150,lands=`<g filter="url(#ink)">${terrain()}${legs}</g>`;
 return `<svg class="mmap" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa de las tierras al norte del Muro con las seis misiones">
 <defs><clipPath id="mpc"><path d="${EDGE}"/></clipPath>
 <linearGradient id="mpg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecdcb6"/><stop offset="1" stop-color="#dcc290"/></linearGradient>
 <radialGradient id="mvg" r=".75"><stop offset=".55" stop-color="#5a2e0c" stop-opacity="0"/><stop offset="1" stop-color="#4a230a" stop-opacity=".6"/></radialGradient>
 <radialGradient id="mns" r=".5"><stop offset="0" stop-color="#3a1f5c" stop-opacity=".28"/><stop offset=".6" stop-color="#3a1f5c" stop-opacity=".08"/><stop offset="1" stop-color="#3a1f5c" stop-opacity="0"/></radialGradient>
 <radialGradient id="mlg"><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
 <radialGradient id="wxR" cx=".35" cy=".3"><stop offset="0" stop-color="#c04a59"/><stop offset=".55" stop-color="#842332"/><stop offset="1" stop-color="#4e121b"/></radialGradient>
 <radialGradient id="wxV" cx=".35" cy=".3"><stop offset="0" stop-color="#9479ea"/><stop offset=".55" stop-color="#5a3fae"/><stop offset="1" stop-color="#2f1f66"/></radialGradient>
 <radialGradient id="wxG" cx=".35" cy=".3"><stop offset="0" stop-color="#e8cb83"/><stop offset=".55" stop-color="#b48a3c"/><stop offset="1" stop-color="#6b4c18"/></radialGradient>
 <radialGradient id="wxL" cx=".35" cy=".3"><stop offset="0" stop-color="#7a6754"/><stop offset=".6" stop-color="#4d3e30"/><stop offset="1" stop-color="#2a211a"/></radialGradient>
 <filter id="mgrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .28 0"/></filter>
 <filter id="mmot" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".007" numOctaves="4" seed="9"/><feColorMatrix values="0 0 0 0 .45 0 0 0 0 .27 0 0 0 0 .1 0 0 0 .7 -.22"/></filter>
 <filter id="ink"><feTurbulence baseFrequency=".045" numOctaves="2" seed="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="3.2"/></filter>
 <filter id="blot" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="5" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="80" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="6"/></filter>
 ${fogMask("mfog",sts,from,false)}${fogMask("mfogi",sts,from,true)}
 <mask id="mlens" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1400" height="1200"><circle id="mlensc" cx="-999" cy="-999" r="44" fill="url(#mlg)"/></mask>
 </defs>
 <g clip-path="url(#mpc)">
  <rect width="1000" height="800" fill="url(#mpg)"/><rect width="1000" height="800" filter="url(#mmot)"/><rect width="1000" height="800" filter="url(#mgrain)"/>
  <circle cx="770" cy="640" r="46" fill="none" stroke="#7a4a1a" stroke-opacity=".1" stroke-width="5"/><circle cx="120" cy="190" r="30" fill="none" stroke="#7a4a1a" stroke-opacity=".08" stroke-width="4"/>
  <g mask="url(#mfog)">${lands}</g>
  <g class="lens" mask="url(#mlens)" opacity=".5"><g mask="url(#mfogi)">${lands}</g></g>
  <circle cx="590" cy="106" r="200" fill="url(#mns)"/>
  <g filter="url(#ink)">
   <path d="M14 776C300 768 700 782 990 772" fill="none" stroke="#2f1d10" stroke-width="9"/>
   <path d="M14 766C300 758 700 772 990 762" fill="none" stroke="#2f1d10" stroke-width="7" stroke-dasharray="7 9"/>
   <g fill="#e6d1a4" stroke="#2f1d10" stroke-width="1.6" stroke-linejoin="round"><path d="M474 760v-22h10v22z"/><path d="M472 738l7-9 7 9z"/><path d="M491 760v-30h15v30z"/><path d="M489 730l9.5-12 9.5 12z"/><path d="M513 760v-19h10v19z"/><path d="M511 741l7-8 7 8z"/></g>
  </g>
  <text class="cap" x="548" y="748" style="font-size:14px;letter-spacing:.14em">VAREK'S HOLD</text>
  <text class="lab" x="64" y="752" style="font-size:16px">el Muro que nadie construyó</text>
  <text class="lab" x="992" y="648" text-anchor="end" style="font-size:17px">la frontera</text>
  <g transform="translate(36 34)"><rect width="300" height="88" rx="2" fill="#efe0bc" fill-opacity=".7" stroke="#3b2615" stroke-width="1.2"/><rect x="5" y="5" width="290" height="78" fill="none" stroke="#3b2615" stroke-width=".7"/><text class="cap" x="150" y="38" text-anchor="middle">TIERRAS AL NORTE</text><text class="cap" x="150" y="56" text-anchor="middle" style="font-size:11px;letter-spacing:.3em">DEL MURO</text><text class="lab" x="150" y="74" text-anchor="middle" style="font-size:14px;fill:#5c4630">campaña de El Pueblo Sin Nombre</text></g>
  ${compass(906,110)}
  <g transform="translate(40 708)"><rect width="36" height="6" fill="#3b2615"/><rect x="36" width="36" height="6" fill="none" stroke="#3b2615"/><rect x="72" width="36" height="6" fill="#3b2615"/><text class="lab" y="-6" style="font-size:13px">0</text><text class="lab" x="72" y="-6" text-anchor="middle" style="font-size:13px">5</text><text class="lab" x="112" y="-6" style="font-size:13px">10 leguas</text></g>
  ${far<5?`<text class="fogt" x="${fy<250?760:740}" y="${fy}" text-anchor="middle" transform="rotate(-4 740 ${fy})">Aquí el mapa aún no recuerda nada</text>`:""}
  <rect width="1000" height="800" fill="url(#mvg)" pointer-events="none"/>
 </g>
 <path d="${EDGE}" fill="none" stroke="#5a3a1a" stroke-opacity=".5" stroke-width="1.5"/>
 ${pins}
 </svg>`}
function foHTML(){const i=M.sel,m=MIS[i],st=mst(i);
 let b=`<div class="mfh"><span class="kwax ${st}">${m.n}</span><div><p class="keb">Misión ${m.n} · ${m.z}</p><h2>${m.t}</h2></div></div>`;
 if(st==="lock")b+=`<p class="hook blur" aria-hidden="true">${m.h}</p><div class="klock">${LOCK}<span>Sellada. Se abrirá al cumplir la misión ${MIS[i-1].n}; todavía está en preparación.</span></div>`;
 else{b+=`<p class="hook">${m.h}</p>`;
  if(st==="done"){const xp=(S.prim?2*S.d:0)+(S.secDone?S.d:0)+(S.dead?2*S.d:0);b+=`<p class="kstl done"><i></i>Cumplida</p><div class="kres"><div><span>Final</span><b>${S.dead?"Heraldo destruido":"Sin pelea de jefe"}</b></div><div><span>Por héroe</span><b>${xp} XP</b></div><div><span>Paga</span><b>${5*S.d} oro</b></div></div><button class="kcta ghost" type="button" data-nav="m1">Ver la misión</button>`}
  else{const mk=(S.mk||[]).filter(Boolean).length;b+=`<div class="kchips"><span><b>2 a 4</b> héroes</span><span>Mesa de <b>48"</b></span><span>Jefe <b>opcional</b></span></div>`+(st==="live"?`<div class="kchips"><span>Alerta <b>${S.al}/6</b></span><span><b>${mk}</b> de 3 rastros</span></div>`:"")+`<p class="kstl ${st}"><i></i>${stl(i)}</p><button class="kcta${st==="live"?" vio":""}" type="button" data-nav="m1"><span>${st==="live"?"Continuar la partida":"Entrar en la misión"}</span>${ARROW}</button>`}}
 const rows=MIS.map((x,k)=>{const s=mst(k);return`<li><button type="button" class="s-${s}${k===i?" on":""}" data-mi="${k}"><span class="n">${x.n}</span><span class="t">${x.t}</span><span class="s">${SHORT[s]}</span></button></li>`}).join("");
 return `<div class="mfob">${b}</div>${KORN}<p class="keb rh">La ruta hacia el norte</p><ol class="mroute">${rows}</ol>`}
function map(){const el=$("#home"),n=MIS.filter((_,i)=>mst(i)!=="lock").length;
 el.innerHTML=`<header class="mvh"><button class="back" type="button" data-nav="camp" aria-label="Volver a las campañas">${BACKI}<span>Campañas</span></button><div class="mvt"><p class="keb">Érebo · Campaña I</p><h1>El Pueblo Sin Nombre</h1></div><div class="mprog"><span>${n} de 6 misiones</span><i>${MIS.map((_,i)=>`<b class="${mst(i)!=="lock"?"on":""}"></b>`).join("")}</i></div></header><div class="mmapw">${mapSVG()}</div><aside class="mfo" id="mfo" aria-live="polite">${foHTML()}</aside>`;
 lens(el.querySelector(".mmap"))}
/* Lente: un círculo de unos 2 cm que deja intuir, al 50 %, lo que la niebla tapa bajo el ratón. */
function lens(svg){const c=svg.querySelector("#mlensc");let raf=0,ev=null;
 svg.addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;ev=e;if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const m=svg.getScreenCTM();if(!m)return;
  const p=new DOMPoint(ev.clientX,ev.clientY).matrixTransform(m.inverse());c.setAttribute("cx",f(p.x));c.setAttribute("cy",f(p.y));c.setAttribute("r",f(37.8*1.25/m.a))})});
 svg.addEventListener("pointerleave",()=>{c.setAttribute("cx",-999)})}
function mapAfter(){const sts=MIS.map((_,i)=>mst(i)),far=sts.reduce((a,s,i)=>s!=="lock"?i:a,0),y=FOGY[far],u=sts.map((s,i)=>s!=="lock"?i:-1).filter(i=>i>=0);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{$$m(".fogr").forEach(r=>r.style.transform=`translateY(${y}px)`);$$m(".rv").forEach(c=>c.style.transform="scale(1)")}));
 seen={y,u};try{localStorage.setItem(FKEY,JSON.stringify(seen))}catch(e){}
 const g=$("#mfo .kcta");if(g)g.focus({preventScroll:true})}
const $$m=s=>document.querySelectorAll("#home "+s);
function mselect(i){M.sel=i;$$m(".pin").forEach(p=>p.classList.toggle("on",+p.dataset.mi===i));$("#mfo").innerHTML=foHTML();
 if(innerWidth<=860){const fo=$("#mfo");window.scrollTo({top:fo.getBoundingClientRect().top+scrollY-12,behavior:"smooth"})}}
$("#home").addEventListener("click",e=>{if(e.target.closest("[data-nav]"))return;const m=e.target.closest("[data-mi]");if(m)mselect(+m.dataset.mi)});
$("#home").addEventListener("keydown",e=>{const p=e.target.closest(".pin");if(p&&(e.key==="Enter"||e.key===" ")){e.preventDefault();mselect(+p.dataset.mi)}});
let sig="";const sigNow=()=>[S.round,S.al,S.prim,S.end,S.defeat,S.dead,S.secDone,(S.mk||[]).join("")].join("|");
return{
 camp,map,mapAfter,
 build(){sig=sigNow();camp()},
 /* Tras cada cambio de la partida: repinta la vista visible solo si algo de lo que muestra ha cambiado. */
 paint(){const s=sigNow();if(s===sig)return;sig=s;if(VIEW==="camp")camp();else if(VIEW==="home"){map();mapAfter()}},
 focusCamp(){const c=$(`.kcard[data-kc="${K.sel}"]`);if(c)c.focus({preventScroll:true})}
}})();
function buildHome(){HOME.build()}
function paintHome(){HOME.paint()}
buildHome();buildSheet();buildToc();render();
</script>
