<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>El Pueblo Sin Nombre</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Una sola hoja de pergamino con la historia y las reglas, y un panel de juego fijo al lado (barra inferior en móvil). */
:root{--desk:#120d0b;--paper:#ead9b4;--ink:#2b1d12;--ink2:#5c4630;--red:#8a2a35;--goldd:#8f6a1f;--rule:rgba(90,60,30,.38);
--pbg:#0c0a12;--pcard:#15121f;--pcard2:#1c1830;--pline:#2a2340;--pink:#ece7f5;--pmu:#a59fba;--pvio:#a78bfa;--pgold:#d9b86c;--pbad:#ec8aa0;--pok:#86d1ae;
--disp:Cinzel,Georgia,serif;--deco:"Cinzel Decorative",Cinzel,Georgia,serif;--serif:"Cormorant Garamond",Georgia,serif;--ui:Inter,system-ui,sans-serif;--num:"Space Grotesk",Inter,sans-serif;
--bar:calc(72px + env(safe-area-inset-bottom,0px));color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:auto;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:radial-gradient(1100px 640px at 28% -8%,#33201a 0,#120d0b 68%),#120d0b;color:var(--pink);font:15px/1.6 var(--ui);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#120d0b;z-index:60}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--pgold);outline-offset:2px}
html{scrollbar-gutter:stable}
html.lock{overflow:hidden}
[hidden]{display:none!important}
.view.enter{animation:vfade .5s ease-out backwards}
.mis.enter .scroll{animation:vin .8s cubic-bezier(.22,1,.36,1) backwards}
.view.leave{animation:vout .24s ease-in forwards;pointer-events:none}
@keyframes vin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes vfade{from{opacity:0}}
@keyframes vout{to{opacity:0}}
.col{min-width:0;padding:0 max(24px,env(safe-area-inset-right,0px)) 120px max(24px,env(safe-area-inset-left,0px))}

/* ===== selector de misiones ===== */
.home{position:relative;min-height:100vh;padding:calc(56px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 64px max(24px,env(safe-area-inset-left,0px));overflow:hidden}
.home::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(900px 520px at 50% -6%,rgba(217,160,90,.16),transparent 62%),radial-gradient(1200px 700px at 50% 120%,rgba(0,0,0,.55),transparent 60%)}
.home::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .5 0 0 0 0 .4 0 0 0 0 .3 0 0 0 .35 0'/%3E%3C/filter%3E%3Crect width='220' height='220' filter='url(%23n)'/%3E%3C/svg%3E")}
.hwrap{position:relative;z-index:1;max-width:1120px;margin:0 auto}
.hhead{text-align:center;margin:0 auto 44px;max-width:720px}
.hhead .sigil{width:58px;height:58px;color:var(--pgold);filter:drop-shadow(0 0 14px rgba(217,184,108,.35))}
.hhead .eb{color:#c99a62;letter-spacing:.32em;text-wrap:balance}
.hhead h1{margin:6px 0 0;font:700 clamp(36px,6.4vw,64px)/1.05 var(--deco);letter-spacing:.01em;background:linear-gradient(180deg,#f8ead0 0,#e2c37f 48%,#a87d34 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance;filter:drop-shadow(0 2px 18px rgba(217,160,90,.18))}
.hhead .orn{margin:16px auto 14px;color:#9c7a3c}
.hhead p.lead{margin:0;text-wrap:balance;font:italic 500 clamp(19px,2.4vw,22px)/1.45 var(--serif);color:#cdb894}
.hprog{display:inline-flex;align-items:center;gap:12px;white-space:nowrap;margin-top:18px;font:600 11px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:#a8906c}
.hprog i{display:flex;gap:7px;align-items:center}.hprog i b{width:8px;height:8px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.2px #6a5236}
.hprog i b.on{width:10px;height:10px;background:radial-gradient(circle at 35% 30%,#f6e3b0,#c99a48 60%,#8f6a1f);box-shadow:0 0 0 3px rgba(217,184,108,.16),0 0 10px rgba(226,195,127,.55)}
.mgridh{display:grid;gap:22px;grid-template-columns:repeat(3,minmax(0,1fr))}
.mcard{position:relative;display:flex;flex-direction:column;border-radius:10px;min-width:0;animation:vin .7s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*70ms + 120ms)}
.mcard .art{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:6px}
.mcard .txt{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.mcard .mn{font:600 11px var(--ui);letter-spacing:.28em;text-transform:uppercase}
.mcard h2{margin:0;font:700 22px/1.2 var(--disp);text-wrap:balance}
.mcard .th{margin:0;font:italic 500 18px/1.35 var(--serif)}
/* misión disponible: folio de pergamino */
.mcard.on{color:var(--ink);padding:10px;box-shadow:inset 0 0 46px rgba(100,58,20,.38),0 0 0 1px rgba(217,184,108,.55),0 0 0 6px rgba(18,13,11,.9),0 0 0 7px rgba(217,184,108,.35),0 24px 60px rgba(0,0,0,.6),0 0 80px rgba(217,160,90,.12);transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s}
.mcard.on .art{background:#1a1322;border:1.5px solid var(--goldd);box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.mcard.on .art svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.22,1,.36,1)}
.mcard.on .art .wax{position:absolute;left:14px;top:12px;width:48px;height:48px;font-size:16px;z-index:1}
.mcard.on .mn{color:var(--red)}
.mcard.on .th{color:var(--ink2)}
.mcard.on .meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.mcard.on .meta span{border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font:500 12px var(--ui);color:var(--ink2);background:rgba(255,248,230,.4)}
.mcard.on .meta b{color:var(--ink)}
.mst{display:flex;align-items:center;gap:8px;margin:auto 0 0;padding-top:14px;font:600 12px var(--ui);color:var(--ink2)}
.mst i{width:8px;height:8px;border-radius:50%;background:#5f8f6c;box-shadow:0 0 0 3px rgba(95,143,108,.2)}
.mst.live i{background:#7b5fd6;box-shadow:0 0 0 3px rgba(123,95,214,.22);animation:blink 2s infinite}
@keyframes blink{50%{box-shadow:0 0 0 6px rgba(123,95,214,0)}}
.go{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;padding:13px 18px;border:0;border-radius:8px;background:linear-gradient(180deg,#9a3442,#7a2431);color:#f8ead0;font:700 12.5px var(--ui);letter-spacing:.2em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px rgba(122,36,49,.35)}
.go::after{content:"";position:absolute;inset:0;border-radius:10px}
.go svg{width:16px;height:16px;transition:transform .3s}
.mcard.on:hover{transform:translateY(-4px)}
.mcard.on:hover .art svg{transform:scale(1.04)}
.mcard.on:hover .go svg{transform:translateX(4px)}
.mcard.on:has(.go:focus-visible){outline:2px solid var(--pgold);outline-offset:10px}
.go:focus-visible{outline:none}
/* misiones selladas */
.mcard.lk{color:#bda98a;background:linear-gradient(165deg,#21170f 0,#150f0b 70%);border:1px solid #3a2a1c;box-shadow:inset 0 1px 0 rgba(255,230,180,.05),0 18px 40px rgba(0,0,0,.4);padding:10px}
.mcard.lk .art{display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#2a1d14,#120c09 72%);border:1px solid #2e2116;box-shadow:inset 0 0 50px rgba(0,0,0,.7)}
.mcard.lk .emb{width:46%;max-width:120px;color:#8a6a3a;opacity:.55;filter:drop-shadow(0 1px 0 rgba(0,0,0,.8))}
.mcard.lk .lock{position:absolute;right:12px;top:12px;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6d2b33,#3d141b 72%);box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.25);color:#d9a8a8}
.mcard.lk .lock svg{width:16px;height:16px}
.mcard.lk .mn{color:#8f7556}
.mcard.lk h2{color:#d9c6a5}
.mcard.lk .th{color:#9d8a6e}
.soon{align-self:flex-start;margin-top:auto;padding-top:12px;font:600 10.5px var(--ui);letter-spacing:.24em;text-transform:uppercase;color:#7d6748}
.wax{display:grid;place-items:center;border-radius:50%;font:700 17px var(--disp);color:#f6e9d0;background:radial-gradient(circle at 35% 30%,#c4505f,#7a2431 70%);box-shadow:0 3px 10px rgba(0,0,0,.55),inset 0 0 0 3px rgba(0,0,0,.14),inset 0 0 0 5px rgba(255,255,255,.06)}
.hfoot{margin:48px auto 0;max-width:640px;text-align:center;font:500 12.5px/1.6 var(--ui);color:#7d6a52}

/* barra superior de la misión: volver + capítulos */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 auto;max-width:940px;display:flex;align-items:center;gap:10px;padding:10px 0 8px;background:linear-gradient(#120d0bf2 70%,#120d0b00)}
.back{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px 0 11px;border-radius:999px;border:1px solid #6b4a2a;background:linear-gradient(180deg,#2c1d12,#1c130c);color:#f1e2c2;font:600 12px var(--ui);letter-spacing:.12em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,230,180,.08),0 4px 12px rgba(0,0,0,.35);transition:border-color .2s,background .2s}
.back svg{width:16px;height:16px;color:var(--pgold);transition:transform .25s}
.back:hover{border-color:var(--pgold)}.back:hover svg{transform:translateX(-3px)}

/* Las fichas de héroe solo se ven con la mesa de juego abierta. */
/* Fichas de héroe: en la mesa y en la página de la misión (cartas). */
body:not(:has(#panel.open)):not(:has(#mis:not([hidden]))) #hfLayer{display:none}
/* El Heraldo, dentro del prólogo */
.heri{margin-top:34px}.heri>.orn{margin:0 auto 18px}
.herb{text-align:center;max-width:52ch;margin:0 auto 26px!important}
.herh{margin:0 0 10px;font:700 19px/1.25 var(--disp);color:var(--ink)}
/* pergamino */
.scroll{max-width:900px;margin:6px auto 0}
.roller{position:relative;height:34px;border-radius:17px;background:linear-gradient(#3a2412,#a77c46 28%,#dcbc7c 50%,#8a6234 74%,#2f1c0d);box-shadow:0 10px 24px rgba(0,0,0,.55);z-index:2}
.roller::before,.roller::after{content:"";position:absolute;top:-5px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0dba0,#9a742d 62%,#4a3212);box-shadow:0 4px 10px rgba(0,0,0,.5)}
.roller::before{left:-16px}.roller::after{right:-16px}
.sheet{position:relative;margin:-4px 20px;padding:72px clamp(22px,7vw,88px) 80px;color:var(--ink)}
.sheet,.mcard.on{background:radial-gradient(120% 50% at 50% 0,rgba(255,250,235,.28),transparent 60%),
url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='260' height='260'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .36 0 0 0 0 .24 0 0 0 0 .1 0 0 0 .2 0'/%3E%3C/filter%3E%3Crect width='260' height='260' filter='url(%23n)'/%3E%3C/svg%3E"),
linear-gradient(90deg,#cdb27c 0,#e6d3a8 7%,#ecdcb9 50%,#e6d3a8 93%,#cdb27c 100%);
box-shadow:inset 0 0 70px rgba(100,58,20,.42),0 30px 80px rgba(0,0,0,.6)}
.sheet p{margin:0 0 14px}
.eb{margin:0 0 6px;font:600 11px var(--ui);letter-spacing:.28em;text-transform:uppercase;color:var(--red)}
.sheet h2{margin:0 0 4px;font:700 clamp(26px,4.4vw,38px)/1.12 var(--disp);color:var(--ink);text-wrap:balance}
.sheet h3{margin:0 0 6px;font:700 17px/1.25 var(--disp);color:var(--ink)}
.orn{display:block;width:min(320px,80%);height:22px;margin:10px 0 22px;color:var(--goldd)}
.sec>.eb,.sec>h2{text-align:center}
.sec>.orn{margin-left:auto;margin-right:auto}
.sec{padding-top:56px}
.sec:first-of-type{padding-top:40px}
.body{font:500 clamp(19px,2.3vw,21px)/1.55 var(--serif)}
.body p{max-width:64ch}
.note{font:italic 500 19px/1.45 var(--serif);color:var(--ink2)}
.small{font:500 13.5px/1.55 var(--ui);color:var(--ink2)}
.hl{color:var(--red)}

/* portada */
.cover{text-align:center;padding-bottom:20px}
.sigil{display:block;margin:0 auto 14px;width:54px;height:54px;color:var(--goldd)}
.cover h1{margin:0 0 6px;font:700 clamp(40px,8.6vw,76px)/1.04 var(--deco);color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.cover .sub{margin:0 auto 22px;font:italic 500 clamp(19px,2.6vw,25px)/1.35 var(--serif);color:var(--ink2);max-width:34ch}
.plate{padding:8px;border:1.5px solid var(--goldd);border-radius:4px;background:#1a1322;box-shadow:0 0 0 5px rgba(234,217,180,.9),0 0 0 6.5px var(--goldd),0 18px 36px rgba(60,30,10,.45);margin:0 8px}
.plate svg{display:block;width:100%;height:auto}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:30px 0 8px}
.chips span{border:1px solid var(--rule);border-radius:999px;padding:5px 14px;font:500 13px var(--ui);color:var(--ink2);background:rgba(255,248,230,.35)}
.chips b{color:var(--ink)}

/* prólogo */
.drop::first-letter{float:left;font:700 4.4em/.78 var(--deco);padding:.09em .1em 0 0;color:var(--red)}
/* tres ejemplos de una tabla: lo mejor, lo peor y uno al azar */
.picks{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr));margin:18px 0 6px}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;border:1px solid var(--rule);border-radius:8px;padding:30px 16px 18px;background:rgba(255,248,230,.42);box-shadow:inset 0 0 24px rgba(120,80,30,.08)}
.pick .lb{position:absolute;top:-11px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:3px 12px;border-radius:999px;font:600 10.5px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:#f6e9d0;background:#7a2431}
.pick.best .lb{background:#8f6a1f}.pick.rnd .lb{background:#4a3a8a}
.pick .seal{min-width:52px;width:auto;height:52px;padding:0 14px;border-radius:999px;font:700 16px var(--disp);white-space:nowrap;margin-bottom:12px}
.pick h3{margin:0 0 4px;font:700 16px/1.25 var(--disp);color:var(--ink)}
.pick p{margin:0;font:500 16.5px/1.4 var(--serif);color:var(--ink2)}
.pick small{display:block;margin-top:8px;font:600 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);opacity:.75}
@media (max-width:640px){.picks{grid-template-columns:1fr;gap:20px}}

/* objetivos */
.objs{display:grid;gap:18px;margin:0 0 22px}
.ob{display:flex;gap:16px;align-items:flex-start}
.seal{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--disp);color:#f6e9d0;background:radial-gradient(circle at 35% 30%,#b84a58,#7a2431 70%);box-shadow:0 3px 8px rgba(60,20,10,.5),inset 0 0 0 3px rgba(0,0,0,.12)}
.seal.v{background:radial-gradient(circle at 35% 30%,#8a74d0,#4a3a8a 70%)}
.seal.g{background:radial-gradient(circle at 35% 30%,#e0c57c,#8a6a28 70%);color:#2b1d12}
.seal.o{background:none;border:2px dashed var(--red);color:var(--red);box-shadow:none}
.ob p{font:500 19px/1.5 var(--serif);margin:0}
.tw{overflow-x:auto;margin:6px 0 18px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;color:inherit}
th{font:600 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#7a5a38;text-align:left;padding:8px 10px;border-bottom:1.5px solid #6b4a2a}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top;font:500 16px/1.45 var(--serif);color:#3b2716}
td b{color:#2b1d12}
td:first-child{font:700 13px var(--ui);white-space:nowrap}
tr.cur td{background:rgba(138,42,53,.12)}
td.num{font-family:var(--ui);font-size:14px;font-weight:600}

/* pasos y mapa */
.steps{list-style:none;margin:0 0 22px;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;margin-bottom:12px;font:500 19px/1.5 var(--serif)}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--goldd);display:grid;place-items:center;font:700 14px var(--disp);color:var(--red);margin-top:2px}
.map{margin:10px 0 0;padding:10px;border:1px solid var(--rule);border-radius:4px;background:rgba(255,248,230,.3)}
.map svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
.map figcaption{font:500 13px/1.5 var(--ui);color:var(--ink2);margin-top:8px;text-align:center}
.fold{margin:12px 0;border:1px solid var(--rule);border-radius:6px;background:rgba(255,248,230,.3)}
.fold summary{cursor:pointer;list-style:none;padding:13px 16px;font:700 14px var(--disp);letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"+";font:600 20px var(--ui);color:var(--red)}
.fold[open] summary::after{content:"–"}
.fold .in{padding:4px 16px 14px}
.evg{display:grid;gap:4px 28px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.evg div{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);font:500 16px/1.4 var(--serif)}
.evg b{flex:none;width:28px;font:700 13px var(--ui);color:var(--red);padding-top:2px}

/* enemigos */
.mons{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:6px 0 24px}
.mon{border:1px solid var(--rule);border-radius:6px;padding:12px 14px 14px;background:rgba(255,248,230,.3)}
.mon svg{display:block;width:100%;max-width:150px;margin:0 auto 8px}
.mon p{font:500 17px/1.4 var(--serif);margin:0}
.bars{margin:6px 0 20px}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font:500 13px var(--ui);color:var(--ink2)}
.bar .t{flex:1;height:9px;border-radius:5px;background:rgba(90,60,30,.18);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#b8923f,#8f6a1f)}

/* heraldo */
.her{display:grid;gap:32px;grid-template-columns:minmax(0,240px) minmax(0,1fr);align-items:start}
@media (max-width:640px){.her{grid-template-columns:1fr;justify-items:center}.her .body{justify-self:stretch}}
.porf{margin:0;width:100%;max-width:240px}
.por{display:block;width:100%;height:auto;max-width:240px;border-radius:4px;border:1.5px solid var(--goldd);box-shadow:0 0 0 4px rgba(234,217,180,.9),0 0 0 5.5px var(--goldd),0 16px 30px rgba(60,30,10,.35)}
.porf figcaption{margin-top:14px;text-align:center;font:600 10.5px var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);opacity:.8}
.quote{position:relative;margin:26px 0 0;padding:22px 26px 20px;border-top:1px solid var(--goldd);border-bottom:1px solid var(--goldd);text-align:center}
.quote::before{content:"“";display:block;height:30px;margin:-4px 0 6px;font:700 54px/1 var(--deco);color:var(--red)}
.quote p{margin:0!important;font:italic 600 clamp(21px,2.6vw,25px)/1.4 var(--serif);color:var(--ink)}
.quote cite{display:block;margin-top:10px;font:600 11px var(--ui);font-style:normal;letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
/* ficha del Heraldo en la mesa (solo cuando entra en juego) */
.hfi{margin:10px 0 4px;padding:14px;border-radius:13px;border:1px solid #5b4a2a;background:linear-gradient(135deg,#2a2112,#1c1830)}
.hfimg{margin:-14px -14px 12px;overflow:hidden;border-radius:12px 12px 0 0;border-bottom:1px solid #5b4a2a}

/* ===== selector de campañas (baraja del Umbral) y selector de misiones (mapa del norte) ===== */
.camp,.mapv{--wax:#8a2a35;--gold:#d9b86c;--gold2:#a87d34;--night:#0b0d16}
.keb{margin:0;font:600 11px var(--ui);letter-spacing:.24em;text-transform:uppercase}
.kchips{display:flex;flex-wrap:wrap;gap:6px}
.kchips span{border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font:500 12px var(--ui);color:var(--ink2);background:rgba(255,248,230,.4)}
.kchips b{color:var(--ink)}
.kcta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 18px;border:0;border-radius:8px;background:linear-gradient(180deg,#9a3442,#7a2431);color:#f8ead0;font:700 12.5px var(--ui);letter-spacing:.2em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px rgba(122,36,49,.35);transition:filter .2s,transform .2s}
.kcta:hover{filter:brightness(1.12)}.kcta:active{transform:translateY(1px)}
.kcta svg{width:16px;height:16px;transition:transform .3s}.kcta:hover svg{transform:translateX(4px)}
.kcta.vio{background:linear-gradient(180deg,#7357d6,#5136a3);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px rgba(81,54,163,.4)}
.kcta.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule)}
.kstl{display:flex;align-items:center;gap:8px;margin:0;font:600 12px var(--ui);color:var(--ink2)}
.kstl i{width:8px;height:8px;border-radius:50%;background:#5f8f6c;box-shadow:0 0 0 3px rgba(95,143,108,.2)}
.kstl.live i{background:#7b5fd6;box-shadow:0 0 0 3px rgba(123,95,214,.22);animation:kblink 2s infinite}
.kstl.done i{background:var(--gold2);box-shadow:0 0 0 3px rgba(168,125,52,.2)}
.kstl.lock i{background:#6a5236;box-shadow:none}
@keyframes kblink{50%{box-shadow:0 0 0 6px rgba(123,95,214,0)}}
@keyframes krise{from{opacity:0;transform:translateY(10px)}}
@keyframes kfade{from{opacity:0}}
.klock{display:flex;gap:10px;align-items:center;padding:11px 13px;border:1px dashed var(--rule);border-radius:8px;font:500 13.5px/1.4 var(--ui);color:var(--ink2);background:rgba(255,248,230,.25)}
.klock svg{width:18px;height:18px;flex:none;color:var(--wax)}
.kres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--rule)}
.kres div{padding:9px 10px;background:#ecdcb8;display:flex;flex-direction:column;gap:1px;min-width:0}
.kres span{font:600 9.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.kres b{font:700 15px/1.25 var(--disp);color:var(--ink)}
.korn{display:flex;align-items:center;gap:10px;color:#8f6a1f}
.korn::before,.korn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(143,106,31,.6),transparent)}
.korn svg{width:14px;height:14px}
.kwax{flex:none;display:grid;place-items:center;width:50px;height:50px;border-radius:50%;font:700 17px var(--disp);color:#f6e2c4;background:radial-gradient(circle at 34% 30%,#b4404f,#7d2230 55%,#4e121b);box-shadow:inset 0 0 0 3px rgba(0,0,0,.18),inset 0 -3px 6px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.45);text-shadow:0 1px 0 rgba(0,0,0,.5)}
.kwax.live{background:radial-gradient(circle at 34% 30%,#9479ea,#5a3fae 55%,#2f1f66)}
.kwax.lock{background:radial-gradient(circle at 34% 30%,#5d4b3b,#3a2d22 55%,#1e1712);color:#a8906c}
.kwax.done{background:radial-gradient(circle at 34% 30%,#d9b86c,#a87d34 55%,#6b4c18);color:#2b1d12;text-shadow:0 1px 0 rgba(255,240,200,.4)}

/* --- campañas: baraja --- */
.camp{position:relative;height:100vh;height:100svh;min-height:660px;overflow:hidden;--ac:#5f86d6;--cw:168px;--ch:258px;background:radial-gradient(900px 600px at 75% 30%,color-mix(in srgb,var(--ac) 22%,transparent),transparent 70%),radial-gradient(800px 500px at 0% 100%,rgba(217,184,108,.06),transparent 60%),var(--night)}
.kbg{position:absolute;inset:0}
.klay{position:absolute;inset:0}
.klay.in{animation:kfade .8s ease}
.klay img{position:absolute;right:0;top:0;height:100%;width:64%;object-fit:cover;object-position:50% 14%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 42%);mask-image:linear-gradient(90deg,transparent 0,#000 42%);filter:brightness(.62) saturate(.85) contrast(1.05)}
.klay .kbk{position:absolute;right:9%;top:7%;width:min(30%,330px);opacity:.24;transform:rotate(6deg);color:#c9a456}
.klay .kbk svg{width:100%;height:auto;display:block}
.camp::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(11,13,22,.95) 0,rgba(11,13,22,.55) 34%,transparent 60%),linear-gradient(90deg,rgba(11,13,22,.88),transparent 55%)}
.kbrand{position:absolute;z-index:3;top:calc(30px + env(safe-area-inset-top,0px));left:max(56px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:13px;color:var(--pgold)}
.kbrand .sigil{width:40px;height:40px;filter:drop-shadow(0 0 12px rgba(217,184,108,.35))}
.kbrand b{display:block;font:700 24px/1 var(--deco);letter-spacing:.04em;background:linear-gradient(180deg,#f8ead0,#e2c37f 50%,#a87d34);-webkit-background-clip:text;background-clip:text;color:transparent}
.kbrand span{display:block;margin-top:4px;font:600 10px var(--ui);letter-spacing:.24em;text-transform:uppercase;color:#8a96b4}
.kinfo{position:absolute;z-index:2;left:max(56px,env(safe-area-inset-left,0px));top:calc(150px + env(safe-area-inset-top,0px));width:min(450px,40%);display:flex;flex-direction:column;gap:14px;animation:krise .55s cubic-bezier(.22,1,.36,1)}
.kinfo .keb{color:color-mix(in srgb,var(--ac) 60%,#efe3cc)}
.kinfo .knum{position:absolute;left:-22px;top:-30px;z-index:-1;font:700 170px/1 var(--deco);color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--ac) 45%,transparent);opacity:.55;pointer-events:none}
.kinfo h2{margin:0;font:700 clamp(36px,4.2vw,56px)/1.02 var(--deco);color:#f4e6cc;text-wrap:balance;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.kinfo .hook{margin:0;font:italic 500 21px/1.42 var(--serif);color:#d9cbb2;text-wrap:pretty}
.kinfo .kchips span{background:rgba(255,255,255,.04);border-color:rgba(217,184,108,.25);color:#cdb894}
.kinfo .kchips b{color:#f1e2c4}
.kinfo .kstl{color:#cdb894}
.camp .kstl.live i{background:#5f86d6;box-shadow:0 0 0 3px rgba(95,134,214,.25);animation:none}
.kinfo .kcta{width:auto;align-self:flex-start;padding:14px 26px}
.kinfo .klock{color:#cdb894;border-color:rgba(217,184,108,.3);background:rgba(255,255,255,.03)}
.kinfo .klock svg{color:#b4404f}
.kfan{position:absolute;left:66%;bottom:44px;z-index:3;width:0;height:var(--ch)}
.kcard{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;position:absolute;left:calc(var(--cw) / -2);bottom:0;width:var(--cw);height:var(--ch);padding:0;border:0;border-radius:12px;background:#0f1628;transform-origin:50% 330%;transform:rotate(calc(var(--o) * 7deg)) translateY(-280%) perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(280%);transition:transform .55s cubic-bezier(.22,1,.36,1),box-shadow .4s;box-shadow:0 14px 30px rgba(0,0,0,.6),0 0 0 1px rgba(217,184,108,.5);overflow:hidden;animation:kdeal .8s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i) * 70ms + 100ms)}
@keyframes kdeal{from{transform:rotate(0deg) translateY(120px);opacity:0}}
/* La inclinación gira alrededor del centro de la carta (el giro del abanico usa un origen muy por debajo):
   por eso se lleva al centro (-280 %) antes de inclinar y se devuelve después. */
/* Zona invisible bajo la carta para que, al subir con el hover, no se pierda el ratón por abajo. */
.kcard::before{content:"";position:absolute;left:0;right:0;top:100%;height:48px}
.kcard:hover{transform:rotate(calc(var(--o) * 7deg)) translateY(-16px) translateY(-280%) perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(280%)}
.kcard.on{transform:rotate(calc(var(--o) * 7deg)) translateY(-44px) scale(1.06) translateY(-280%) perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(280%);z-index:5;box-shadow:0 24px 50px rgba(0,0,0,.7),0 0 0 1.5px var(--gold),0 0 40px color-mix(in srgb,var(--cac) 55%,transparent)}
.kcard:focus-visible{outline:none;box-shadow:0 0 0 2px var(--gold),0 0 0 5px rgba(217,184,108,.3)}
.kcard::after{content:"";position:absolute;inset:6px;border-radius:8px;border:1px solid rgba(217,184,108,.45);pointer-events:none}
.kcard .kart{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--cac) 55%,#0f1628),#0f1628 75%)}
.kcard .kart img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.kcard .kcn{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:999px;background:rgba(11,14,24,.8);border:1px solid rgba(217,184,108,.6);font:700 12px var(--disp);color:#f1e2c4}
.kcard .kct{position:absolute;inset:auto 0 0;padding:36px 12px 16px;background:linear-gradient(0deg,rgba(11,14,24,.96) 30%,transparent);font:700 13.5px/1.2 var(--disp);letter-spacing:.04em;color:#f4e6cc;text-align:center;text-wrap:balance}
.kcard .kct small{display:block;margin-top:5px;font:600 8.5px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:#9aa6c2}
.kcard .kback{position:absolute;inset:0;width:100%;height:100%;color:#c9a456}
/* Reversos de Neth, brillo metálico e inclinación al pasar el ratón */
.kcard .nbk{position:absolute;inset:0;width:100%;height:100%}
.kcard.s-lock::after{display:none}
.kcard.tilt{transition:transform .1s linear,box-shadow .4s}
.ksh{position:absolute;inset:0;z-index:4;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,240,200,.3),transparent 45%),linear-gradient(115deg,transparent 25%,rgba(255,226,150,.22) 42%,rgba(160,190,255,.16) 50%,rgba(255,226,150,.2) 58%,transparent 75%);background-size:100% 100%,260% 260%;background-position:center,var(--mx) var(--my);mix-blend-mode:color-dodge}
.kcard:hover .ksh{opacity:1}
@media (hover:none){.ksh{display:none}}
.nb-pulse{animation:nbp 4s ease-in-out infinite alternate}
@keyframes nbp{from{opacity:.55}to{opacity:1}}
.nb-drift{animation:nbd 7s linear infinite}
@keyframes nbd{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
.klay .kbk svg{border-radius:18px}
.kinfo .kmot{margin:-4px 0 0;font:italic 500 17px var(--serif);color:#8a96b4}
.kcard.s-lock{background:radial-gradient(circle at 50% 45%,#1d2740,#0b0f1c 75%)}
.kcard.s-lock .kcn{background:transparent;border-color:rgba(217,184,108,.3);color:#a8906c;top:auto;bottom:14px}
.kcard .klv{position:absolute;left:50%;top:52px;transform:translateX(-50%);padding:3px 9px;border-radius:999px;background:#2f4f8f;color:#e6eeff;font:700 9px var(--ui);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;box-shadow:0 0 0 3px rgba(95,134,214,.25)}
.kcard.shake{animation:kshake .45s}
@keyframes kshake{25%{translate:-5px 0}50%{translate:5px 0}75%{translate:-3px 0}}
.khint{position:absolute;left:max(56px,env(safe-area-inset-left,0px));bottom:32px;z-index:2;margin:0;display:flex;gap:8px;align-items:center;font:600 10.5px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:#7a86a3}
.khint kbd{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;border:1px solid #2c3a58;background:#111827;font:600 12px var(--ui);color:#c9d3ea}
@media (max-width:860px){
 .camp{height:auto;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;--cw:124px;--ch:190px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .camp::after{display:none}
 .kbrand{left:max(20px,env(safe-area-inset-left,0px));top:calc(20px + env(safe-area-inset-top,0px))}
 .kbrand .sigil{width:32px;height:32px}.kbrand b{font-size:20px}
 .kbg{position:relative;height:360px;flex:none}
 .kbg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--night) 2%,transparent 60%),linear-gradient(180deg,rgba(11,13,22,.75),transparent 30%)}
 .klay img{width:100%;-webkit-mask-image:none;mask-image:none;object-position:50% 16%}
 .klay .kbk{right:50%;transform:translateX(50%);width:170px;top:70px}
 .kinfo{position:relative;left:auto;top:auto;width:auto;margin:-100px 0 0;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));gap:12px}
 .kinfo .knum{font-size:110px;left:4px;top:-24px}
 .kinfo h2{font-size:34px}.kinfo .hook{font-size:19px}
 .kinfo .kcta{width:100%;align-self:stretch}
 .kfan{position:relative;left:auto;bottom:auto;width:auto;height:auto;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:58px max(20px,env(safe-area-inset-right,0px)) 30px max(20px,env(safe-area-inset-left,0px));margin-top:6px;scrollbar-width:none}
 .kcard{position:relative;left:auto;flex:none;scroll-snap-align:center;transform:none;animation:none}
 .kcard:hover{transform:translateY(-6px)}
 .kcard.on{transform:translateY(-22px)}
 .khint{display:none}
}

/* --- misiones: mapa del norte (carta nocturna, braseros, nubes y ficha junto al brasero; elegido 2026-11-17) --- */
.mapv{position:relative;height:100vh;height:100svh;min-height:660px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:0 34px;padding:calc(26px + env(safe-area-inset-top,0px)) max(26px,env(safe-area-inset-right,0px)) 20px max(36px,env(safe-area-inset-left,0px));background:radial-gradient(900px 600px at 40% -10%,rgba(90,110,170,.18),transparent 65%),radial-gradient(900px 600px at 50% 120%,rgba(0,0,0,.7),transparent 60%),#0b0d16}
.mside{display:flex;flex-direction:column;gap:20px;min-height:0;min-width:0}
.mvh{display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-width:0}
.mvh .back{border-color:rgba(217,184,108,.38);background:rgba(11,14,24,.6)}
.mvh .keb{color:#8a96b4;font-size:10px}
.mvh h1{margin:3px 0 0;font:700 30px/1.08 var(--deco);background:linear-gradient(180deg,#f8ead0,#e2c37f 50%,#a87d34);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.mvh .mprog{display:inline-flex;align-items:center;gap:12px;white-space:nowrap;font:600 11px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:#8a96b4}
.mprog i{display:flex;gap:7px;align-items:center}
.mprog i b{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.2px #3d4a68}
.mprog i b.on{width:10px;height:10px;background:radial-gradient(circle at 35% 30%,#f6e3b0,#c99a48 60%,#8f6a1f);box-shadow:0 0 0 3px rgba(217,184,108,.16),0 0 10px rgba(226,195,127,.55)}
.mprog i b.lv{width:10px;height:10px;background:radial-gradient(circle at 35% 30%,#c9b6ff,#7b55e0 60%,#3f2a8a);box-shadow:0 0 0 3px rgba(139,108,240,.2),0 0 10px rgba(139,108,240,.6)}
.midx{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.midx .keb{color:#7a86a3;margin-bottom:8px}
.midx button{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:8px;background:none;text-align:left;color:#cdb894;transition:background .2s}

.midx .s-done .n{background:radial-gradient(circle at 35% 30%,#e8cb83,#a87d34);color:#2b1d12;box-shadow:none}
.midx .s-lock{opacity:.5}
.midx .t{font:500 17px/1.15 var(--serif)}
.midx .t small{display:block;margin-top:2px;font:600 9px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:#7a86a3}
.midx .s-live .t small{color:#b7a2ff}
.mhint{margin:auto 0 0;font:italic 500 16px/1.35 var(--serif);color:#6f7a96}
.mmapw{position:relative;min-height:0;min-width:0}
.mmap{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 20px 28px rgba(0,0,0,.6)) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.mmap text{font-family:var(--serif)}
.mmap .mt{fill:#18213a;stroke:#cdb57d;stroke-width:1.1;stroke-linejoin:round}
.mmap .mts{fill:#000;opacity:.35}
.mmap .tr{fill:#172038;stroke:#cdb57d;stroke-width:1.1}
.mmap .trs{fill:none;stroke:#cdb57d;stroke-width:2.2;opacity:.32}
.mmap .tk{fill:none;stroke:#cdb57d;stroke-width:1.3}
.mmap .mhl{fill:none;stroke:#cdb57d;stroke-width:1.4;opacity:.7}
.mmap .wt{fill:none;stroke:#8fb3d6;stroke-width:2.4;stroke-linecap:round;opacity:.85}
.mmap .lk{fill:rgba(143,179,214,.16);stroke:#8fb3d6;stroke-width:1.8}
.mmap .rp{fill:none;stroke:#8fb3d6;stroke-width:1.2;opacity:.55}
.mmap .gl{fill:#18213a;stroke:#cdb57d;stroke-width:1.4;stroke-linejoin:round}

.mmap .rt-on{fill:none;stroke:#d9862f;stroke-width:2;stroke-linecap:round;opacity:.6}
.mmap .rt-off{fill:none;stroke:#cdb57d;stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round;opacity:.4}
.mmap .eglow{fill:none;stroke:#ff9a3c;stroke-width:9;opacity:.35;filter:blur(5px)}
.mmap .emb{fill:none;stroke:#ffd27a;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 16;animation:mmarch 1.4s linear infinite}
@keyframes mmarch{to{stroke-dashoffset:-18}}
.mmap .lab{fill:#e3cb92;font:italic 600 19px var(--serif)}
.mmap .cap{fill:#e3cb92;font:600 13px var(--disp);letter-spacing:.24em}
.mmap .lab,.mmap .cap{filter:drop-shadow(0 0 4px rgba(227,203,146,.25))}
.mmap .stars circle{fill:#f3e6c4}
.mmap .stars .tw{animation:mtw 3.6s ease-in-out infinite alternate}
@keyframes mtw{from{opacity:.15}to{opacity:.9}}
.mmap .cloud{animation:mdrift 70s linear infinite alternate}
.mmap .cloud.c2{animation-duration:46s;animation-direction:alternate-reverse}
@keyframes mdrift{from{transform:translateX(-160px)}to{transform:translateX(160px)}}
.mmap .fogr{transition:transform 1.9s cubic-bezier(.45,0,.2,1)}
.mmap .rv{transform-box:fill-box;transform-origin:center;transition:transform 1.7s .35s cubic-bezier(.3,0,.2,1)}
.mmap .lens{pointer-events:none}
.mmap .pin{cursor:pointer;outline:none}
.mmap .pin .hit{fill:transparent}
.mmap .pin .sel{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:4 5;transform-box:fill-box;transform-origin:center;opacity:0;transition:opacity .3s}
.mmap .pin.on .sel,.mmap .pin:focus-visible .sel{opacity:1;animation:mspin 16s linear infinite}
@keyframes mspin{to{transform:rotate(360deg)}}
.mmap .pin .body{transform-box:fill-box;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.mmap .pin:hover .body,.mmap .pin.on .body{transform:scale(1.12)}
.mmap .pin .plab{fill:#e3cb92;font:italic 700 23px var(--serif);paint-order:stroke;stroke:#141c31;stroke-width:6px;stroke-linejoin:round;transition:opacity .25s}
.mmap .pin .psub{fill:#a99a78;font:600 9.5px var(--ui);letter-spacing:.16em;paint-order:stroke;stroke:#141c31;stroke-width:5px;stroke-linejoin:round;transition:opacity .25s}
.mmap .pin.s-live .psub{fill:#b7a2ff}
.mmap .pin.s-done .plab{opacity:.75}
.mapv:not(.popoff) .mmap .pin.on .plab,.mapv:not(.popoff) .mmap .pin.on .psub{opacity:0}
/* braseros: arden las misiones abiertas (fuego naranja), la partida en curso (violeta) y las cumplidas (oro) */
.mmap .bowl{fill:#3a3020;stroke:#cdb57d;stroke-width:1.2}
.mmap .flm{transform-box:fill-box;transform-origin:50% 100%;animation:mflick 1.1s ease-in-out infinite alternate}
.mmap .flm.f2{animation-duration:.8s;animation-delay:-.3s}
.mmap .flm.f3{animation-duration:1.4s;animation-delay:-.7s}
@keyframes mflick{0%{transform:scale(1,1) skewX(0)}50%{transform:scale(.92,1.08) skewX(3deg)}100%{transform:scale(1.04,.94) skewX(-3deg)}}
.mmap .glow{mix-blend-mode:screen;animation:mglow 2.2s ease-in-out infinite alternate}
@keyframes mglow{from{opacity:.65}to{opacity:1}}
.mmap .hn{font:700 13px var(--disp);text-anchor:middle;fill:#e3cb92;paint-order:stroke;stroke:#141c31;stroke-width:4px}
.mmap .smoke{fill:none;stroke:#8b7d6b;stroke-width:1.4;stroke-linecap:round;opacity:.6}
/* ficha junto al brasero */
.mpop{position:absolute;z-index:4;width:340px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px;border-radius:10px;color:#efe3cc;background:radial-gradient(130% 90% at 50% 0%,#24304d,#161e34 75%);box-shadow:0 0 0 1px rgba(217,184,108,.4),0 30px 60px rgba(0,0,0,.6),0 8px 18px rgba(0,0,0,.35);animation:mpopin .4s cubic-bezier(.22,1,.36,1)}
.mapv.popoff .mpop{display:none}
@keyframes mpopin{from{opacity:0;transform:scale(.94)}}
.mpop::before{content:"";position:absolute;top:calc(var(--ay,50%) - 11px);width:22px;height:22px;background:#1f2942;transform:rotate(45deg);box-shadow:inset 0 0 0 1px rgba(217,184,108,.4)}
.mpop.r::before{left:-11px;clip-path:polygon(0 0,0 100%,100% 100%)}
.mpop.l::before{right:-11px;clip-path:polygon(0 0,100% 0,100% 100%)}
.mpop .mx{position:absolute;right:10px;top:10px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#cdb894}
.mpop .mx svg{width:14px;height:14px}
.mpop .mfh{display:flex;gap:14px;align-items:center;padding-right:28px}
.mpop .keb{color:var(--gold);font-size:10px}
.mpop h2{margin:3px 0 0;font:700 22px/1.15 var(--disp);color:#f6e8cc;text-wrap:balance}
.mpop .hook{margin:0;font:italic 500 18px/1.42 var(--serif);color:#d8cdb6}
.mpop .hook.blur{filter:blur(4px);opacity:.55;user-select:none}
.mpop .kchips span{background:rgba(255,255,255,.04);border-color:rgba(217,184,108,.3);color:#cdb894}
.mpop .kchips b{color:#f1e2c4}
.mpop .kstl{color:#cdb894}
.mpop .klock{color:#cdb894;border-color:rgba(217,184,108,.3);background:rgba(255,255,255,.03)}
.mpop .klock svg{color:#d9b86c}
.mpop .kres{border-color:rgba(217,184,108,.3);background:rgba(217,184,108,.3)}
.mpop .kres div{background:#1a2238}
.mpop .kres span{color:#a99a78}
.mpop .kres b{color:#f1e2c4}
.mpop .kcta.ghost{color:#e9dcc2;box-shadow:inset 0 0 0 1.5px rgba(217,184,108,.4)}
.mpop .kwax{width:46px;height:46px;font-size:16px}
@media (max-width:860px){
 .mapv{height:auto;min-height:100vh;display:flex;flex-direction:column;gap:18px;padding:calc(14px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
 .mside{display:contents}
 .mvh{order:1;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 16px}
 .mvh h1{font-size:22px}
 .mvh .mprog{flex-basis:100%}
 .mmapw{order:2;aspect-ratio:1000/800;width:100%}
 .mpop,.mapv.popoff .mpop{order:3;display:flex;position:relative;left:auto!important;top:auto!important;width:auto;animation:none}
 .mpop::before,.mpop .mx{display:none}
 .midx{order:4;margin-top:0}
 .mhint{display:none}
 .mapv .mmap .pin.on .plab{opacity:1!important}
 .mmap .pin .plab{font-size:28px;stroke-width:7px}
 .mmap .pin .psub{display:none}
 .mmap .lab{font-size:24px}
}

/* ===== página de la misión: mesa de cartas en ambiente Neth (elegida 2026-11-17, maqueta docs/maquetas/pagina-mision.html, D) ===== */
.mis{--qbg:#06070c;--qp1:#10131f;--qp2:#080a12;--qtx:#e4dccb;--qtx2:#c9c1ae;--qmu:#8791a8;--qgd:#d9b86c;--qgdl:#f3dc9a;--qac:#6f8fd0;--qacl:#9aa9c8}
.qv{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;color:var(--qtx);padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));background:radial-gradient(700px 520px at 74% 14%,rgba(95,134,214,.16),transparent 60%),radial-gradient(1200px 700px at 50% 120%,rgba(0,0,0,.9),transparent 60%),var(--qbg)}
.qer{filter:url(#qerode)}
.qgt{background:linear-gradient(180deg,#f8ead0,#e2c37f 50%,#a87d34);-webkit-background-clip:text;background-clip:text;color:transparent}
.qeb{margin:0;font:600 11px var(--ui);letter-spacing:.3em;text-transform:uppercase;color:var(--qacl)}
.qmotes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.qmotes i{position:absolute;width:2px;height:2px;background:var(--qgd);opacity:0;animation:qmote linear infinite}
@keyframes qmote{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-160px);opacity:0}}
/* portada */
.qhero{position:relative;height:clamp(360px,50vh,440px)}
.qart{position:absolute;right:0;top:0;bottom:0;width:62%;-webkit-mask:linear-gradient(90deg,transparent,#000 40%),linear-gradient(0deg,transparent,#000 40%);-webkit-mask-composite:source-in;mask:linear-gradient(90deg,transparent,#000 40%),linear-gradient(0deg,transparent,#000 40%);mask-composite:intersect}
.qart img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:brightness(.7) saturate(.8) contrast(1.05)}
.qecl{position:absolute;right:16%;top:-6%;width:clamp(260px,30vw,420px);aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 1px rgba(217,184,108,.3),0 0 80px rgba(95,134,214,.4),inset 0 0 60px rgba(95,134,214,.28);mix-blend-mode:screen;pointer-events:none}
.qtop{position:absolute;z-index:4;left:max(32px,env(safe-area-inset-left,0px));right:max(32px,env(safe-area-inset-right,0px));top:calc(22px + env(safe-area-inset-top,0px));display:flex;align-items:center}
.qtop .back{border-color:rgba(217,184,108,.38);background:rgba(6,7,12,.6)}
.qht{position:absolute;z-index:2;left:max(70px,env(safe-area-inset-left,0px));top:calc(104px + env(safe-area-inset-top,0px));max-width:min(680px,60%);display:flex;flex-direction:column;gap:14px}
.qht h1{margin:0;font:700 clamp(46px,6vw,80px)/1 var(--deco);text-wrap:balance}
.qht .sub{margin:0;font:italic 500 clamp(18px,1.7vw,22px)/1.42 var(--serif);color:var(--qtx2);max-width:44ch}
/* cartas */
.qrow{position:relative;z-index:3;display:flex;justify-content:center;align-items:flex-start;gap:22px;margin-top:-10px;padding:20px max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));perspective:1600px}
.qcard{position:relative;flex:none;width:200px;height:300px;border:0;padding:0;border-radius:14px;background:linear-gradient(165deg,#121624,#07090f);box-shadow:0 0 0 1px rgba(217,184,108,.5),0 0 0 6px #0b0f1c,0 0 0 7px rgba(217,184,108,.2),0 24px 50px rgba(0,0,0,.55);color:var(--qtx);text-align:center;display:flex;flex-direction:column;align-items:center;overflow:hidden;transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s;animation:qdeal .7s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i) * 70ms + 120ms)}
@keyframes qdeal{from{opacity:0;transform:translateY(60px)}}
.qcard:nth-child(odd){transform:translateY(10px) rotate(-1.2deg)}.qcard:nth-child(even){transform:rotate(1deg)}
.qcard:hover,.qcard:focus-visible{transform:translateY(-18px) rotate(0);box-shadow:0 0 0 1px var(--qgd),0 0 0 6px #0b0f1c,0 0 0 7px rgba(217,184,108,.4),0 34px 70px rgba(0,0,0,.65),0 0 50px rgba(95,134,214,.3);outline:none}
.qcard.big{width:236px;height:330px}
.qcard::after{content:"";position:absolute;inset:7px;border-radius:9px;border:1px solid rgba(217,184,108,.45);pointer-events:none;-webkit-mask:linear-gradient(90deg,#000 0 25%,transparent 25% 31%,#000 31% 77%,transparent 77% 80%,#000 80%),linear-gradient(180deg,#000 0 62%,transparent 62% 70%,#000 70%);-webkit-mask-composite:source-in;mask:linear-gradient(90deg,#000 0 25%,transparent 25% 31%,#000 31% 77%,transparent 77% 80%,#000 80%),linear-gradient(180deg,#000 0 62%,transparent 62% 70%,#000 70%);mask-composite:intersect}
.qcard .ic{position:relative;flex:none;width:100%;height:150px;display:grid;place-items:center;background:radial-gradient(circle at 50% 55%,rgba(95,134,214,.25),transparent 65%)}
.qcard.big .ic{height:170px}
.qcard .ic svg{width:84px;height:84px;color:var(--qgd)}
.qcard .ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:brightness(.85) saturate(.8)}
.qcard .ic.im::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0d1120,transparent 60%)}
.qcard .nm{margin-top:12px;font:600 9.5px var(--ui);letter-spacing:.26em;text-transform:uppercase;color:var(--qacl)}
.qcard h3{margin:6px 14px;font:700 20px/1.12 var(--disp);color:var(--qtx)}
.qcard p{margin:0 18px;font:italic 500 15.5px/1.38 var(--serif);color:var(--qmu)}
.qcard .rd{margin-top:auto;margin-bottom:16px;font:600 10px var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--qgd)}
.qhint{margin:34px 0 0;text-align:center;font:italic 500 18px var(--serif);color:var(--qmu)}
/* panel de lectura */
.qov{position:fixed;inset:0;z-index:47;display:grid;place-items:center;grid-template-columns:minmax(0,1fr);padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:rgba(4,6,12,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:vfade .35s ease}
.qpn{position:relative;border-radius:12px;background:linear-gradient(165deg,var(--qp1),var(--qp2));box-shadow:0 18px 44px rgba(0,0,0,.4)}
.qpn::before{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(217,184,108,.55);pointer-events:none;-webkit-mask:linear-gradient(90deg,#000 0 var(--g1,22%),transparent var(--g1,22%) calc(var(--g1,22%) + 4%),#000 calc(var(--g1,22%) + 4%) var(--g2,71%),transparent var(--g2,71%) calc(var(--g2,71%) + 7%),#000 calc(var(--g2,71%) + 7%)),linear-gradient(180deg,#000 0 var(--g3,38%),transparent var(--g3,38%) calc(var(--g3,38%) + 9%),#000 calc(var(--g3,38%) + 9%));-webkit-mask-composite:source-in;mask:linear-gradient(90deg,#000 0 var(--g1,22%),transparent var(--g1,22%) calc(var(--g1,22%) + 4%),#000 calc(var(--g1,22%) + 4%) var(--g2,71%),transparent var(--g2,71%) calc(var(--g2,71%) + 7%),#000 calc(var(--g2,71%) + 7%)),linear-gradient(180deg,#000 0 var(--g3,38%),transparent var(--g3,38%) calc(var(--g3,38%) + 9%),#000 calc(var(--g3,38%) + 9%));mask-composite:intersect}
.qpn:nth-of-type(2n)::before{--g1:58%;--g2:84%;--g3:66%}
.qpn:nth-of-type(3n)::before{--g1:12%;--g2:47%;--g3:22%}
.qrd{min-width:0;max-width:100%;width:min(1000px,100%);height:min(800px,calc(100svh - 40px));display:flex;flex-direction:column;animation:vin .45s cubic-bezier(.22,1,.36,1)}
.qrd .rhd{display:flex;align-items:center;gap:18px;padding:26px 30px 18px;border-bottom:1px solid rgba(217,184,108,.16)}
.qrd .rhd h2{margin:4px 0 0;font:700 clamp(28px,3.4vw,38px)/1.05 var(--deco)}
.qrd .qx{margin-left:auto;flex:none;width:42px;height:42px;border-radius:50%;border:1px solid rgba(217,184,108,.35);background:none;display:grid;place-items:center;color:var(--qgd)}
.qrd .qx svg{width:16px;height:16px}
.qrd .rbd{flex:1;min-height:0;min-width:0;overflow-y:auto;overscroll-behavior:contain;padding:30px clamp(18px,4vw,44px);scrollbar-width:thin;scrollbar-color:#2c3a58 transparent}
.qrd .rft{display:flex;justify-content:space-between;gap:12px;padding:14px 30px;border-top:1px solid rgba(217,184,108,.16)}
.qrd .rft button{border:0;background:none;padding:6px 0;font:600 12px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--qgd)}
.qrd .rft button:disabled{opacity:.3;cursor:default}
/* contenido */
.qseal{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;font:700 15px var(--disp);color:var(--qgd);background:radial-gradient(circle at 50% 50%,#03050b 58%,#2a3a66 74%,#0b0f1c);box-shadow:0 0 0 1px rgba(217,184,108,.6),0 0 16px rgba(95,134,214,.45)}
.qlead{margin:0 0 30px;font:500 19.5px/1.55 var(--serif);color:var(--qtx2)}
.qpro p{margin:0;font:500 20px/1.62 var(--serif);color:var(--qtx2)}
.qpro p+p{margin-top:16px}
.qpro .dc::first-letter{float:left;font:700 4.3em/.8 var(--deco);padding:.08em .12em 0 0;color:#e8d6a8;text-shadow:0 0 18px rgba(95,134,214,.6)}
.qbridge{margin:0 auto 26px;max-width:46ch;text-align:center;font:italic 500 20px/1.45 var(--serif);color:var(--qmu)}
.qher{display:grid;grid-template-columns:280px minmax(0,1fr);gap:34px;align-items:start}
.qpor{position:relative;height:360px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(217,184,108,.4),0 0 40px rgba(95,134,214,.35),0 24px 50px rgba(0,0,0,.7)}
.qpor img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.75) contrast(1.08)}
.qher h3{margin:0 0 12px;font:700 21px/1.2 var(--disp);color:var(--qtx)}
.qher p{margin:0;font:500 19px/1.55 var(--serif);color:var(--qtx2)}
.qher p+p{margin-top:12px}
.qher p.n{font-style:italic;color:var(--qmu)}
.qq{margin:26px 0 0;text-align:center;padding:24px 20px}
.qq::before{content:"“";display:block;height:30px;font:700 54px/1 var(--deco);color:var(--qgd)}
.qq p{margin:0;font:italic 600 clamp(21px,2.4vw,26px)/1.38 var(--serif);color:var(--qtx)}
.qq cite{display:block;margin-top:12px;font:600 10.5px var(--ui);font-style:normal;letter-spacing:.26em;text-transform:uppercase;color:var(--qgd)}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.qgrid+.qgrid{margin-top:18px}
.qgrid>.qpn{padding:24px 22px;min-width:0;overflow-x:auto}
.qob{display:flex;gap:16px;align-items:flex-start}
.qob h3{margin:0 0 4px;font:700 17px/1.25 var(--disp);color:var(--qtx)}
.qob p{margin:0;font:500 17.5px/1.5 var(--serif);color:var(--qtx2)}
.qh4{margin:0 0 8px;font:600 11px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--qgd)}
.qtbl{width:100%;border-collapse:collapse}
.qtbl th{font:600 10.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--qgd);text-align:left;padding:8px 10px;border-bottom:1px solid rgba(217,184,108,.22)}
.qtbl td{padding:8px 10px;border-bottom:1px solid rgba(217,184,108,.1);font:500 16px/1.4 var(--serif);color:var(--qtx2);vertical-align:top}
.qtbl td:first-child{font:700 13px var(--ui);color:var(--qgd);white-space:nowrap}
.qtbl td b{color:var(--qtx)}
.qtbl .n{text-align:center;font:600 14px var(--ui);color:var(--qtx)}
.qprep{display:grid;grid-template-columns:320px minmax(0,1fr);gap:34px;align-items:start}
.qprep>.qpn{padding:20px}
.qmap svg{display:block;width:100%;height:auto}
.qmap p{margin:10px 0 0;font:500 12.5px/1.5 var(--ui);color:var(--qmu);text-align:center}
.qsteps{list-style:none;margin:0;padding:0;counter-reset:qs;display:grid;gap:14px}
.qsteps li{counter-increment:qs;display:flex;gap:14px;font:500 18px/1.5 var(--serif);color:var(--qtx2)}
.qsteps li::before{content:counter(qs);flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1.4px var(--qgd);font:700 13px var(--disp);color:var(--qgd);margin-top:2px}
.qsteps b{color:var(--qtx)}
/* Eventos de Neth y Cofres: familias de resultados explicadas */
.qhr{display:inline-block;margin:0 0 16px;padding:3px 11px;border-radius:999px;font:600 9.5px var(--ui);letter-spacing:.2em;text-transform:uppercase;background:#10162a;box-shadow:inset 0 0 0 1px rgba(217,184,108,.3);color:var(--qgd)}
.qfams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:4px}
.qfam{padding:22px 22px 20px;display:flex;gap:16px;align-items:flex-start;min-width:0}
.qfam.w{grid-column:1/-1}
.qfam .dv{flex:none;display:grid;place-items:center;min-width:58px;height:48px;padding:0 10px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--qgd);font:700 14px var(--disp);color:var(--qgd);white-space:nowrap}
.qfam.bad .dv{box-shadow:inset 0 0 0 1.5px #e08a8a;color:#e8a0a0}
.qfam.good .dv{box-shadow:inset 0 0 0 1.5px #8fd1ae;color:#a6dcbf}
.qfam.odd .dv{box-shadow:inset 0 0 0 1.5px #b9a2f0;color:#cdbdf6}
.qfam>div{min-width:0}
.qfam h3{margin:0 0 6px;font:700 17px/1.25 var(--disp);color:var(--qtx)}
.qfam .fl{margin:0 0 10px;font:italic 500 17.5px/1.45 var(--serif);color:var(--qmu)}
.qfam p{margin:0;font:500 17px/1.5 var(--serif);color:var(--qtx2)}
.qfam small{display:block;margin-top:10px;font:600 10px/1.5 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--qgd)}
p.qtx{margin:0;font:500 17.5px/1.5 var(--serif);color:var(--qtx2)}
.qlead b,p.qtx b{font-weight:700;color:var(--qgd)}
.qnote{margin:26px 0 0;text-align:center;font:italic 500 17px/1.5 var(--serif);color:var(--qmu)}
/* lectura obligatoria antes de la mesa de juego */

@media (max-width:760px){
 .qhero{height:auto;min-height:420px}

 .qtop{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px))}
 .qht{position:relative;left:auto;top:auto;max-width:none;padding:calc(130px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
 .qcard{width:180px;height:280px}.qcard.big{width:200px;height:300px}

 .qrd{width:100%;height:100%;border-radius:0}
 .qrd .rhd{padding:calc(16px + env(safe-area-inset-top,0px)) 16px 14px}
 .qrd .rft{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
 .qher,.qprep{grid-template-columns:minmax(0,1fr)}
 .qpor{height:320px;max-width:260px;margin:0 auto;width:100%}

}
@media (prefers-reduced-motion:reduce){.qv *,.qov *{animation:none!important}}
@media (prefers-reduced-motion:reduce){.camp *,.mapv *{animation:none!important;transition:none!important}}

/* =====================================================================================================
   Mesa de juego · «Sala de guerra» (2026-11-18, elegida de docs/maquetas/mesa-juego.html):
   noche azul y oro del mapa + violeta de la mesa + marcos rotos de Neth. La luz cambia con Noche/Alba/Día
   (data-ph en #panel). Alerta con el eclipse de Neth, dados de hueso, unidades en filas con sello,
   y el tablero táctico en una pestaña flotante a la derecha (#btab / #bdrw).
   ===================================================================================================== */
:root{--pbg:#06070c;--pcard:#111a2f;--pcard2:#16213b;--pline:#24304d;--pline2:#33416a;--pmu:#8f9abb;--pmu2:#c3cbe0}
.panel{overflow:hidden;--sky:#0a1020;--sky2:#17264a;--hz:rgba(95,134,214,.22);--amb:#7d9be0;--star:.9;
 background:radial-gradient(900px 420px at 50% -8%,var(--hz),transparent 70%),linear-gradient(180deg,var(--sky2) 0,var(--sky) 46%,#06070c 100%)}
.panel[data-ph="Alba"]{--sky:#120d1e;--sky2:#3b2448;--hz:rgba(236,150,160,.24);--amb:#e7a08a;--star:.35}
.panel[data-ph="Día"]{--sky:#11131a;--sky2:#2d2a24;--hz:rgba(217,184,108,.2);--amb:#d9b86c;--star:0}
.psky{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.psky::before{content:"";position:absolute;inset:0;opacity:var(--star);transition:opacity 1.2s;
 background-image:radial-gradient(1px 1px at 12% 18%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 28% 8%,#fff7 50%,transparent 51%),radial-gradient(1.4px 1.4px at 44% 22%,#fffa 50%,transparent 51%),radial-gradient(1px 1px at 61% 12%,#fff6 50%,transparent 51%),radial-gradient(1.2px 1.2px at 77% 26%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 88% 9%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 6% 40%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 93% 44%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 36% 36%,#fff4 50%,transparent 51%),radial-gradient(1px 1px at 70% 40%,#fff4 50%,transparent 51%)}
.psky::after{content:"";position:absolute;inset:0;opacity:.4;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .6 0 0 0 .3 0'/%3E%3C/filter%3E%3Crect width='220' height='220' filter='url(%23n)'/%3E%3C/svg%3E")}
.psky i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#c9b8ff;box-shadow:0 0 8px #a78bfa;opacity:0;animation:pmote 14s linear infinite}
@keyframes pmote{0%{transform:translate(0,0);opacity:0}12%{opacity:.7}100%{transform:translate(30px,-90vh);opacity:0}}
.phead,.pbody{position:relative;z-index:1}
.phead{background:linear-gradient(180deg,rgba(6,8,15,.92),rgba(8,11,22,.72));border-bottom-color:rgba(217,184,108,.16)}
.phead::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(217,184,108,.55) 30%,rgba(167,139,250,.5) 70%,transparent)}
.px{border-color:var(--pline2);background:radial-gradient(circle at 35% 30%,#1c2645,#0c1222)}
.ptl small{color:#8fa6d6}
.pst span{background:rgba(12,18,34,.7);border-color:var(--pline2);color:var(--pmu2)}
.pst .mp i{background:#25304f}
/* tarjetas con marco dorado completo (2026-11-18: antes tenía tramos que faltaban) */
.pc{position:relative;border:0;border-radius:16px;background:linear-gradient(180deg,rgba(23,32,58,.88),rgba(13,19,36,.92));box-shadow:0 18px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04)}
.pc::before,.fn::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
 background:linear-gradient(160deg,rgba(217,184,108,.62),rgba(217,184,108,.36) 50%,rgba(217,184,108,.55));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.pc h3 .tt{border-color:rgba(217,184,108,.75);font-weight:700;letter-spacing:.2em}
.pc h3 em{color:var(--pmu)}
/* botones */
.pb{border-color:#4a3d8f;background:rgba(20,16,40,.6);color:#d6ccff;transition:background .2s,border-color .2s,transform .2s,box-shadow .2s}
.pb:hover{background:#231c45;border-color:var(--pvio)}
.pb.pr{border:0;color:#120c26;background:linear-gradient(180deg,#c9b8ff 0,#a78bfa 45%,#8a6cf0 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(60,30,140,.25),0 0 0 1px rgba(167,139,250,.5),0 10px 26px rgba(110,80,220,.35)}
.pb.pr:hover{background:linear-gradient(180deg,#d6caff 0,#b49cfb 45%,#977cf2 100%);transform:translateY(-1px)}
.pb.gh{border-color:var(--pline2);background:rgba(12,18,34,.6);color:var(--pmu2)}
.pb.gh:hover{border-color:rgba(217,184,108,.5);color:var(--pgold);background:rgba(20,28,50,.8)}
.pb:disabled:hover{transform:none}
.stp button,.dsel,#armyTxt,.mkr,.res{border-color:var(--pline2)}
.seals button{border-color:var(--pline2)}
/* texto de la ronda: cinta con el pozo a la izquierda */
.narb{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;padding:20px 26px}
.narb .nic{width:56px;height:56px;color:var(--pgold);opacity:.9}
.narb .nic svg{width:100%;height:100%}
.narb h3{margin-bottom:8px}
.narb .plays,.narb>.play{align-self:center}
.narb .play{width:40px;height:40px;border-color:rgba(217,184,108,.7);background:radial-gradient(circle at 35% 30%,#24305a,#0e1428)}
.nar{color:var(--pink);text-wrap:pretty}
/* Ronda y alerta (eclipse de Neth) */
.vig{display:flex;flex-direction:column;align-items:center;text-align:center}
.vig h3{align-self:stretch}
.ecw{width:214px;height:214px;margin:0 auto 4px}
.ecw svg{width:100%;height:100%;display:block}
.phs{display:flex;align-items:center;gap:12px;width:100%;margin:8px 0 0;padding:12px 14px;border-radius:12px;background:rgba(8,12,24,.55);border:1px solid var(--pline);text-align:left}
.phs svg{flex:none;width:34px;height:34px;color:var(--amb)}
.phs b{display:block;font:700 13px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--pgold)}
.phs small{display:block;font-size:12px;line-height:1.4;color:var(--pmu2)}
.alrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;width:100%;margin-top:12px;gap:8px}
.alrow .tog{margin:0;font-size:12.5px}
.alrow .tog input{width:17px;height:17px}
.vig .go{margin-top:16px;width:100%}
.vig .gow{width:100%}
.vig .nxt{width:100%;text-align:center;border-top:0;padding-top:0;margin-top:10px}
.vig .alw,.vig .cwrap,.vig .alh{width:100%;text-align:left}
/* unidades: fila con sello */
.un{grid-template-columns:50px minmax(0,1fr);gap:4px 14px;padding:12px 2px;border-top-color:rgba(51,65,106,.5)}
.un .q{position:relative;width:46px;height:46px;padding:0}
.un .q svg{width:46px;height:46px;display:block}
.un .q b{position:absolute;right:-4px;bottom:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;display:grid;place-items:center;font:700 11px/1 var(--num);color:#1a1208;background:linear-gradient(180deg,#f3dc9a,#c99a48);box-shadow:0 2px 6px rgba(0,0,0,.45)}
.un.gone .q{filter:grayscale(1);opacity:.5}
.un.gone .q b{background:#3a4566;color:var(--pmu2)}
.grp{color:var(--pmu)}
.grp.new{color:var(--pvio)}
/* dados de hueso */
.dice2{flex:none;display:flex;gap:6px}
.bone{display:block;width:42px;height:42px;border-radius:10px;background:linear-gradient(145deg,#f6ecd2,#d8c49a);box-shadow:inset 0 -3px 0 rgba(120,90,40,.35),inset 0 1px 0 #fff,0 6px 14px rgba(0,0,0,.45)}
.bone svg{width:100%;height:100%;display:block}
.dice2.ghost .bone{opacity:.22;filter:grayscale(.6)}
.dice2.tmb .bone{animation:bshake .11s linear infinite}
@keyframes bshake{0%{transform:rotate(-8deg) translateY(-2px)}50%{transform:rotate(7deg) translateY(1px)}100%{transform:rotate(-8deg) translateY(-2px)}}
.dice2.land .bone{animation:bland .6s cubic-bezier(.3,1.4,.5,1)}
.dice2.land .bone:nth-child(2){animation-delay:.07s}
@keyframes bland{0%{transform:translate(-26px,-20px) rotate(-160deg) scale(.7);opacity:0}60%{transform:translate(3px,1px) rotate(10deg)}100%{transform:none}}
.res{background:rgba(10,15,30,.75);border-color:#2a3557}
.res.bad{border-color:rgba(236,138,160,.45);background:linear-gradient(135deg,rgba(80,24,40,.35),rgba(10,15,30,.75))}
.res.ok{border-color:rgba(134,209,174,.4);background:linear-gradient(135deg,rgba(24,70,54,.35),rgba(10,15,30,.75))}
.res.all{border-color:rgba(167,139,250,.45);background:linear-gradient(135deg,rgba(60,40,120,.35),rgba(10,15,30,.75))}
.rtg{display:block;margin-bottom:2px;font:700 9.5px var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--pmu)}
.res.bad .rtg{color:var(--pbad)}.res.ok .rtg{color:var(--pok)}.res.all .rtg{color:#c9b8ff}
/* objetivos */
.mkr{background:rgba(10,15,30,.6);border-color:var(--pline)}
.mkr.on{border-color:rgba(217,184,108,.6);background:linear-gradient(120deg,rgba(80,60,20,.35),rgba(10,15,30,.6))}
.exit{border-color:rgba(217,184,108,.4);background:linear-gradient(135deg,rgba(60,48,20,.45),rgba(14,20,40,.8))}
/* botín: franja a lo ancho */
.fn{position:relative;border:0;background:linear-gradient(120deg,rgba(60,46,16,.4),rgba(13,19,36,.92) 45%);display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:16px 22px;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.fn h3{margin:0}
.fn>p{flex-basis:100%;order:3;margin:0}
.fn .xp{flex:1 1 280px;margin:0}
.fn .xp div{background:rgba(8,12,24,.5)}
.fn .defw{margin:0;order:2}
.alert{background:linear-gradient(135deg,#2a2150,#121a30);border-color:rgba(217,184,108,.5);box-shadow:0 16px 40px rgba(0,0,0,.45),0 0 40px rgba(167,139,250,.18)}
/* pestaña flotante del tablero táctico: a la derecha, por encima de los medallones de héroe */
.btab{position:absolute;z-index:6;right:0;bottom:calc(128px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border:1px solid rgba(217,184,108,.55);border-right:0;border-radius:14px 0 0 14px;background:linear-gradient(160deg,#1f2c58,#0d1428);color:var(--pgold);box-shadow:-10px 14px 34px rgba(0,0,0,.55),0 0 30px rgba(95,134,214,.18);transition:padding .3s cubic-bezier(.22,1,.36,1),opacity .3s,transform .3s}
.btab:hover{padding-right:24px}
.btab svg{flex:none;width:30px;height:30px}
.btab b{display:block;font:700 11px/1.15 var(--ui);letter-spacing:.18em;text-transform:uppercase}
.btab small{display:block;margin-top:2px;font:600 11px var(--num);color:var(--pmu2);letter-spacing:.02em}
.btab[hidden]{display:none}
.panel.bopen .btab{opacity:0;pointer-events:none;transform:translateX(30px)}
.btab{transition:padding .3s cubic-bezier(.22,1,.36,1),opacity .3s,transform .3s,bottom .4s cubic-bezier(.22,1,.36,1)}
.bscrim{position:absolute;inset:0;z-index:7;background:rgba(3,5,10,.5);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.panel.bopen .bscrim{opacity:1;visibility:visible;transition:opacity .35s}
.bdrw{position:absolute;z-index:8;top:0;right:0;bottom:0;width:min(640px,100%);display:flex;flex-direction:column;background:linear-gradient(180deg,#111a33,#080b16);border-left:1px solid rgba(217,184,108,.3);box-shadow:-30px 0 80px rgba(0,0,0,.6);transform:translateX(104%);visibility:hidden;transition:transform .5s cubic-bezier(.22,1,.36,1),visibility 0s linear .5s}
.panel.bopen .bdrw{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.22,1,.36,1),visibility 0s}
.bdh{flex:none;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 14px 18px;border-bottom:1px solid rgba(217,184,108,.16)}
.bdh .px{width:40px;height:40px}
.bdh small{display:block;font:600 10px var(--ui);letter-spacing:.22em;text-transform:uppercase;color:#8fa6d6}
.bdh b{display:block;font:700 17px/1.1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--pgold)}
.bdb{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px max(18px,env(safe-area-inset-right,0px)) calc(130px + env(safe-area-inset-bottom,0px)) 18px;scrollbar-width:thin;scrollbar-color:#2b3557 transparent}
.bmap{display:block;width:100%;height:auto;filter:drop-shadow(0 24px 50px rgba(0,0,0,.55))}
.bmap .bz{cursor:pointer}
.bmap .bz:hover{fill:rgba(217,184,108,.06)}
.bmap .btk{cursor:grab;touch-action:none}
.bmap .btk.drag{cursor:grabbing}.bmap .btk.drag .bb{stroke:#fff;stroke-width:2.4}
.panel.bdrag .bmap .bz:hover{fill:transparent}
.bsb{margin-left:auto;display:flex;gap:6px;flex:none}
.bsel b.bdist{display:inline;font-size:inherit;color:#f3dc9a}.bsel b.bdist.run{color:#c9b8ff}
.bmap .btk.cut .bb{stroke:#c9b8ff;stroke-width:2.6}
/* Con el tablero táctico abierto no se ven los medallones de héroe. */
.hf-meds{transition:bottom .4s cubic-bezier(.22,1,.36,1),opacity .3s,visibility 0s}
body:has(#qov:not([hidden])):not(:has(#panel.open)) .hf-meds,body:has(#panel.bopen) .hf-meds{opacity:0;visibility:hidden;pointer-events:none;transition:bottom .4s cubic-bezier(.22,1,.36,1),opacity .25s,visibility 0s .25s}
.bmap .btk:hover .bb{stroke:#fff}
.bmap .brs{cursor:pointer}
.panel:not(.bpick) .bmap .bz{cursor:default}.panel:not(.bpick) .bmap .bz:hover{fill:transparent}
.blg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:10px 0 0;font:600 11px var(--ui);color:var(--pmu)}
.blg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.bhint{margin:12px 0 0;padding:10px 12px;border-radius:11px;border:1px solid var(--pline);background:rgba(8,12,24,.55);font-size:12.5px;line-height:1.5;color:var(--pmu2)}
.bhint b{color:var(--pgold);font-weight:600}
.bsec{margin:16px 0 8px;font:700 10px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--pmu)}
.btray{display:flex;flex-wrap:wrap;gap:6px}
.btray button{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border-radius:999px;border:1px solid var(--pline2);background:rgba(12,18,34,.7);font:600 12px var(--ui);color:var(--pmu2)}
.btray button i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 9.5px var(--num);font-style:normal;color:#fff;background:radial-gradient(circle at 35% 30%,#9a7cf5,#4a2fa8)}
.btray button.n i{background:radial-gradient(circle at 35% 30%,#ec8aa0,#8a2a45)}
.btray button.on{border-color:var(--pgold);color:var(--pgold)}
.btray .none{font:italic 500 15px var(--serif);color:var(--pmu)}
.bsel{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:12px;border:1px solid rgba(167,139,250,.55);background:linear-gradient(120deg,rgba(60,40,120,.3),rgba(10,15,30,.7));font-size:12.5px;color:var(--pmu2)}
.bsel b{display:block;font-size:13.5px;color:var(--pink)}
.bhc{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bhc .seg2{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--pline2);background:rgba(8,12,24,.7)}
.bhc .seg2 button{border:0;background:none;width:32px;height:28px;border-radius:999px;font:700 12px var(--num);color:var(--pmu)}
.bhc .seg2 button[aria-pressed="true"]{background:linear-gradient(180deg,#f3dc9a,#c99a48);color:#1a1208}
@media (max-width:640px){
 .narb{grid-template-columns:minmax(0,1fr) auto;padding:16px;gap:12px}
 .narb .nic{display:none}
 .ecw{width:180px;height:180px}
 .btab{padding:9px 12px 9px 10px;bottom:calc(132px + env(safe-area-inset-bottom,0px))}
 .btab span{display:none}
 .btab svg{width:28px;height:28px}
 .bdrw{width:100%}
}
@media (prefers-reduced-motion:reduce){.psky i{animation:none;opacity:0}.bdrw,.bscrim,.btab{transition:none}.dice2 .bone{animation:none!important}}
/* ---------- pantalla de carga del selector de campañas ---------- */
#kload{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;background:radial-gradient(700px 420px at 50% 38%,rgba(95,134,214,.18),transparent 65%),#070a14;color:#e9ebf5;text-align:center;transition:opacity .6s ease,visibility .6s}
#kload.out{opacity:0;visibility:hidden;pointer-events:none}
#kload .kl-ec{width:112px;height:112px;position:relative}
#kload .kl-ec svg{width:100%;height:100%;overflow:visible}
#kload .kl-ring{transform-origin:50% 50%;animation:kl-rot 9s linear infinite}
